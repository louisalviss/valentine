name: Verify AURA DOM live

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published DOM site
        run: |
          set -euo pipefail
          PAGE='https://louisalviss.github.io/valentine/aura-eclipse-scroll/'
          ok=0
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/aura.html -w '%{http_code}' "$PAGE?v=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = '200' ] \
              && grep -q 'headphones.webp' /tmp/aura.html \
              && grep -q 'Precision Tuned' /tmp/aura.html \
              && grep -q 'requestAnimationFrame' /tmp/aura.html \
              && ! grep -qi '<video' /tmp/aura.html \
              && ! grep -q 'source.mp4' /tmp/aura.html; then
              echo "page_ok attempt=$i http=$code"
              ok=1
              break
            fi
            echo "page_not_ready attempt=$i http=$code"
            sleep 5
          done
          test "$ok" = '1'

      - name: Verify product image
        run: |
          set -euo pipefail
          ASSET='https://louisalviss.github.io/valentine/aura-eclipse-scroll/headphones.webp'
          curl -fL -sS -D /tmp/h -o /tmp/a "$ASSET?v=${GITHUB_RUN_ID}"
          grep -qi 'content-type: image/webp' /tmp/h
          test "$(wc -c < /tmp/a)" -gt 10000
          echo "asset_bytes=$(wc -c < /tmp/a)"

      - name: PASS
        run: echo 'AURA_DOM_SCROLL_LIVE_OK'
