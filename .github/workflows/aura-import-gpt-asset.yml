name: AURA repair GPT asset

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild verified GPT WebP
        run: |
          set -euo pipefail
          cat .aura-asset-repair/r*.b64 | tr -d '\n\r' | base64 -d > aura-eclipse-scroll/headphones-gpt.webp
          test "$(wc -c < aura-eclipse-scroll/headphones-gpt.webp)" -eq 52508
          python - <<'PY'
          from pathlib import Path
          p = Path('aura-eclipse-scroll/headphones-gpt.webp').read_bytes()
          assert p[:4] == b'RIFF', p[:16]
          assert p[8:12] == b'WEBP', p[:16]
          print('WEBP_HEADER_OK', len(p))
          PY
          file aura-eclipse-scroll/headphones-gpt.webp | grep -qi 'Web/P image\|WebP'

      - name: Commit repaired asset to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aura-eclipse-scroll/headphones-gpt.webp
          if git diff --cached --quiet; then
            echo 'asset already current'
            exit 0
          fi
          git commit -m 'fix: restore valid GPT Image WebP [skip ci]'
          git push origin HEAD:main
