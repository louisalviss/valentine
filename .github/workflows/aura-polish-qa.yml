name: AURA polish live QA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: aura-polish-live-qa
  cancel-in-progress: true

jobs:
  live-qa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published classic final build and GPT WebP
        run: |
          set -euo pipefail
          BASE='https://louisalviss.github.io/valentine/aura-eclipse-scroll/'
          ok=0
          for i in $(seq 1 48); do
            code=$(curl -L -sS -o /tmp/aura.html -w '%{http_code}' "$BASE?v=${GITHUB_RUN_ID}-${i}" || true)
            curl -fL -sS "$BASE/headphones-gpt.webp?v=${GITHUB_RUN_ID}-${i}" -o /tmp/h.webp || true
            curl -fL -sS "$BASE/features-v5.js?v=${GITHUB_RUN_ID}-${i}" -o /tmp/features.js || true
            if [ "$code" = '200' ] \
              && grep -q 'data-build="aura-editorial-v6"' /tmp/aura.html \
              && grep -q 'featureClose' /tmp/aura.html \
              && grep -q 'feature-btn t1' /tmp/aura.html \
              && grep -q 'openFeature' /tmp/features.js \
              && grep -q 'src="./headphones-gpt.webp"' /tmp/aura.html; then
              if python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/h.webp').read_bytes()
          assert len(p)==52508, len(p)
          assert p[:4]==b'RIFF', p[:16]
          assert p[8:12]==b'WEBP', p[:16]
          PY
              then ok=1; echo "AURA_EDITORIAL_V6_LIVE_OK attempt=$i http=$code bytes=$(wc -c < /tmp/h.webp)"; break; fi
            fi
            echo "waiting attempt=$i http=$code"
            sleep 5
          done
          test "$ok" = '1'

      - name: Capture desktop and mobile final frames
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p qa
          BASE='https://louisalviss.github.io/valentine/aura-eclipse-scroll/'
          for f in .78 .88 1; do
            name=$(echo "$f" | tr -d '.')
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot="qa/desktop-${name}.png" "$BASE?frame=$f&v=$GITHUB_RUN_ID"
          done
          for f in .78 .88 1; do
            name=$(echo "$f" | tr -d '.')
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot="qa/mobile-${name}.png" "$BASE?frame=$f&v=$GITHUB_RUN_ID"
          done
          ls -lh qa

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aura-classic-v6-qa-${{ github.run_id }}
          path: qa/
          retention-days: 2

      - name: PASS
        run: echo 'AURA_EDITORIAL_V6_QA_OK'
