name: Build Robot GLB
on:
  push:
    branches: [main]
    paths:
      - 'robot/build_robot.py'
      - '.github/workflows/build-robot-glb.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install trimesh numpy scipy
      - run: python robot/build_robot.py
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robot/robot.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build final Kaizen robot GLB"
          git push
