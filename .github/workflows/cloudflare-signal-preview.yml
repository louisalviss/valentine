name: Deploy The Last Signal preview to Cloudflare

on:
  push:
    branches:
      - agent/the-last-signal-cloudflare
    paths:
      - "signal-story/deploy-pr-trigger.txt"
      - ".github/workflows/cloudflare-signal-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy temporary Workers static assets
        shell: bash
        run: |
          set +e
          npx wrangler@4.110.0 deploy \
            --assets signal-story \
            --name the-last-signal \
            --compatibility-date 2026-08-18 \
            --temporary 2>&1 | tee deploy.log
          STATUS=${PIPESTATUS[0]}

          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev[^[:space:]]*' deploy.log | tail -n 1 | sed -E 's/[),]+$//')
          CLAIM=$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[A-Za-z0-9_-]+' deploy.log | tail -n 1)

          {
            echo "status=$STATUS"
            echo "url=$URL"
            echo "claim=$CLAIM"
            echo
            echo "--- deploy log ---"
            tail -n 120 deploy.log
          } > signal-story/cloudflare-preview-result.txt

      - name: Commit deployment result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal-story/cloudflare-preview-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Cloudflare preview result [skip ci]"
          git push
