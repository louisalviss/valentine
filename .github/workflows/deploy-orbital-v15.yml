name: Deploy Orbital V15
on:
  push:
    paths:
      - .github/workflows/deploy-orbital-v15.yml
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write V15
        env:
          PAYLOAD: 
        run: python -c "import os,zlib,base64,pathlib; pathlib.Path('orbital-shrine/index.html').write_bytes(zlib.decompress(base64.b64decode(os.environ['PAYLOAD'])))"
      - name: Commit V15
        run: |
          rm -f .github/workflows/deploy-orbital-v15.yml .github/workflows/fix-orbital-v14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orbital-shrine/index.html .github/workflows || true
          git commit -m 'Orbital Shrine V15 — visible temple mechanism'
          git push
