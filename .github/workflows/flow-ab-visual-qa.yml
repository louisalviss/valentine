name: Flow AB Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'flow-ab/**'
      - 'visual-primitives/**'
      - '.github/workflows/flow-ab-visual-qa.yml'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-qa:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[flow-ab-qa]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Initialize durable status
        run: |
          mkdir -p flow-ab/qa/latest
          printf 'started_at=%s\nsource_sha=%s\nactor=%s\nevent=%s\n' "$(date -u +%FT%TZ)" "$(git rev-parse HEAD)" "$GITHUB_ACTOR" "$GITHUB_EVENT_NAME" > flow-ab/qa/latest/workflow-status.txt

      - name: Commit start receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flow-ab/qa/latest/workflow-status.txt
          git commit -m 'chore: mark flow AB visual QA started [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        id: playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        id: server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flow-ab-http.log 2>&1 &
          echo $! >/tmp/flow-ab-http.pid
          sleep 2
          curl --fail http://127.0.0.1:4173/flow-ab/ >/dev/null

      - name: Capture and runtime QA
        id: runtime
        continue-on-error: true
        run: node flow-ab/qa/visual-qa.mjs

      - name: Install Pillow
        id: pillow
        run: python3 -m pip install --quiet pillow

      - name: Analyze silhouette divergence
        id: silhouette
        run: python3 flow-ab/qa/analyze-silhouette.py

      - name: Build QA summary
        if: always()
        run: |
          {
            echo '## Flow A/B Visual QA'
            echo
            echo '### Runtime checks'
            echo '```'
            cat flow-ab/qa/output/runtime-failures.txt 2>/dev/null || true
            echo '```'
            echo
            cat flow-ab/qa/output/silhouette-report.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-ab-visual-qa
          path: |
            flow-ab/qa/output/screens/*.png
            flow-ab/qa/output/qa-metrics.json
            flow-ab/qa/output/runtime-failures.txt
            flow-ab/qa/output/silhouette-report.json
            flow-ab/qa/output/silhouette-report.md
            flow-ab/qa/latest/contact-mobile.jpg
            flow-ab/qa/latest/contact-desktop.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Commit durable QA receipt
        if: always()
        run: |
          mkdir -p flow-ab/qa/latest
          {
            echo "finished_at=$(date -u +%FT%TZ)"
            echo "node=${{ steps.node.outcome }}"
            echo "playwright=${{ steps.playwright.outcome }}"
            echo "server=${{ steps.server.outcome }}"
            echo "runtime=${{ steps.runtime.outcome }}"
            echo "pillow=${{ steps.pillow.outcome }}"
            echo "silhouette=${{ steps.silhouette.outcome }}"
          } >> flow-ab/qa/latest/workflow-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flow-ab/qa/latest/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update flow AB visual QA receipt [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail on runtime regressions
        if: steps.runtime.outcome == 'failure'
        run: |
          echo 'Runtime QA reported failures.'
          cat flow-ab/qa/output/runtime-failures.txt || true
          exit 1
