name: Orbital Shrine Aww V7
on:
  push:
    paths:
      - '.github/workflows/orbital-aww-v7.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V7
        run: echo '' | base64 -d | python
      - name: Commit V7
        run: |
          rm -f .github/workflows/orbital-aww-v7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Upgrade Orbital Shrine to Awwwards-style V7"
          git push
