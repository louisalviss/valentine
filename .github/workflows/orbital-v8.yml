name: Orbital Shrine V8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbital-v8.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build layered motion version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          old=Path('orbital-shrine/index.html').read_text()
          m=re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', old)
          if not m:
              raise SystemExit('embedded webp not found')
          Path('orbital-shrine/bg.webp').write_bytes(base64.b64decode(m.group(1)))
          html=r'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090c"><title>Orbital Shrine — Awwwards Motion V8</title><style>
:root{--p:0;--mx:0;--my:0;--vel:0}*{box-sizing:border-box}html,body{margin:0;background:#07090c;color:#eee8dc;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:320vh;overflow-x:hidden;cursor:none}.stage{position:fixed;inset:0;overflow:hidden;background:#07090c}.layer{position:absolute;inset:-2%;background:url('./bg.webp') center/cover no-repeat;will-change:transform,filter}.base{transform:translate3d(calc(var(--mx)*-8px),calc(var(--my)*-5px),0) scale(calc(1.015 + var(--p)*.055));filter:saturate(.98) contrast(1.025) brightness(.96)}.sky{clip-path:polygon(36% 0,100% 0,100% 58%,40% 58%);mask-image:linear-gradient(#000 0 72%,transparent 100%);transform:translate3d(calc(var(--mx)*-16px),calc(var(--my)*-9px - var(--p)*10px),0) scale(calc(1.025 + var(--p)*.07));filter:saturate(1.04) brightness(1.015)}.tower{clip-path:polygon(50% 6%,82% 6%,82% 84%,46% 84%);mask-image:radial-gradient(ellipse 48% 82% at 66% 49%,#000 0 61%,transparent 78%);transform:translate3d(calc(var(--mx)*10px),calc(var(--my)*5px + var(--p)*-8px),22px) scale(calc(1.005 + var(--p)*.035));filter:contrast(1.03) brightness(1.02)}.foreground{clip-path:polygon(24% 61%,100% 54%,100% 100%,0 100%,0 75%);mask-image:linear-gradient(transparent 0,#000 36%);transform:translate3d(calc(var(--mx)*18px),calc(var(--my)*10px + var(--p)*-14px),40px) scale(calc(1.02 + var(--p)*.08));filter:brightness(.92)}
.vignette,.grain,.fog,.sweep,.scan,.beam,.halo,.ringFx,.progress,.status{position:absolute;pointer-events:none}.vignette{inset:0;background:radial-gradient(circle at 65% 45%,transparent 0 26%,rgba(7,9,12,.08) 46%,rgba(7,9,12,.52) 100%),linear-gradient(180deg,rgba(7,9,12,.16),transparent 18%,transparent 76%,rgba(7,9,12,.58))}.grain{inset:-30%;opacity:.042;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:grain 7s steps(7) infinite}@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-1.5%)}75%{transform:translate(2%,1%)}100%{transform:translate(0)}}
.fog{inset:0;background:radial-gradient(35% 18% at 71% 44%,rgba(224,205,165,.09),transparent 72%),radial-gradient(48% 22% at 68% 63%,rgba(205,195,176,.06),transparent 70%);filter:blur(36px);animation:fog 10s ease-in-out infinite alternate;mix-blend-mode:screen}@keyframes fog{from{transform:translate3d(-2%,1%,0);opacity:.38}to{transform:translate3d(2%,-1%,0);opacity:.72}}
.beam{left:66.2%;top:6%;width:3px;height:65%;transform:translateX(-50%) scaleY(calc(.92 + var(--p)*.12));transform-origin:50% 58%;background:linear-gradient(180deg,rgba(255,222,153,0),rgba(255,230,176,.96) 25%,rgba(255,247,222,.98) 56%,rgba(255,218,139,.15));box-shadow:0 0 9px rgba(255,225,164,.68),0 0 34px rgba(255,200,116,.34);filter:blur(.4px);animation:beam 2.4s ease-in-out infinite}@keyframes beam{0%,100%{opacity:.52}50%{opacity:1}}
.halo{left:60.8%;top:13%;width:11%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,232,189,.24),rgba(255,201,115,.08) 36%,transparent 67%);filter:blur(8px);animation:halo 4s ease-in-out infinite}@keyframes halo{50%{transform:scale(1.14);opacity:.82}}
.ringFx{left:55.2%;top:21.5%;width:23%;aspect-ratio:1.75;border-radius:50%;border:1px solid rgba(226,185,109,.24);box-shadow:0 0 24px rgba(211,166,83,.12),inset 0 0 24px rgba(211,166,83,.06);transform:rotate(calc(var(--p)*18deg)) translate3d(calc(var(--mx)*4px),calc(var(--my)*2px),0);animation:ring 16s linear infinite}@keyframes ring{to{filter:hue-rotate(12deg);transform:rotate(360deg)}}
.sweep{inset:-20%;background:linear-gradient(108deg,transparent 38%,rgba(255,224,170,.045) 47%,rgba(255,247,226,.13) 50%,rgba(255,224,170,.04) 53%,transparent 62%);transform:translateX(calc(-52% + var(--p)*105%));mix-blend-mode:screen}.scan{left:0;right:0;height:1px;top:calc(12% + var(--p)*76%);background:linear-gradient(90deg,transparent,rgba(229,198,144,.1),rgba(255,244,218,.42),rgba(229,198,144,.1),transparent);box-shadow:0 0 16px rgba(226,186,113,.18);opacity:calc(.12 + var(--vel)*2.4)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cursor{position:fixed;z-index:20;width:34px;height:34px;border:1px solid rgba(235,214,174,.52);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference}.cursor:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}.status{left:50%;bottom:3.2vh;transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(210,181,128,.18);border-radius:999px;background:rgba(7,9,12,.3);backdrop-filter:blur(12px);font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:rgba(236,225,204,.65);text-transform:uppercase}.progress{right:18px;top:18%;bottom:18%;width:1px;background:rgba(220,191,136,.14)}.progress i{display:block;width:3px;height:15%;margin-left:-1px;background:#d9b878;box-shadow:0 0 16px rgba(216,183,117,.45);transform:translateY(calc(var(--p)*70vh));border-radius:999px}
@media(max-width:900px){body{min-height:240vh;cursor:auto}.base,.sky,.tower,.foreground{background-position:64% center}.base{transform:scale(calc(1.06 + var(--p)*.045)) translate3d(calc(var(--mx)*-3px),calc(var(--my)*-2px),0)}.sky{transform:translate3d(calc(var(--mx)*-7px),calc(var(--my)*-4px),0) scale(calc(1.07 + var(--p)*.045))}.tower{clip-path:polygon(43% 4%,94% 4%,94% 90%,39% 90%);mask-image:radial-gradient(ellipse 52% 82% at 69% 49%,#000 0 58%,transparent 78%);transform:translate3d(calc(var(--mx)*5px),calc(var(--my)*3px),15px) scale(calc(1.04 + var(--p)*.03))}.foreground{transform:translate3d(calc(var(--mx)*7px),calc(var(--my)*5px),20px) scale(calc(1.07 + var(--p)*.045))}.beam{left:70%;top:7%;height:58%}.ringFx{left:56%;top:22%;width:31%}.halo{left:66%;top:18%;width:15%}.cursor{display:none}.progress{display:none}.status{font-size:7px;bottom:2vh}}
</style></head><body><div class="stage"><div class="layer base"></div><div class="layer sky"></div><div class="layer tower"></div><div class="layer foreground"></div><div class="vignette"></div><div class="ringFx"></div><div class="beam"></div><div class="halo"></div><div class="fog"></div><canvas id="fx"></canvas><div class="sweep"></div><div class="scan"></div><div class="grain"></div><div class="progress"><i></i></div><div class="status">AWWARDS STUDY · SCROLL / POINTER / CLICK</div></div><div class="cursor"></div><script>
const root=document.documentElement,c=document.getElementById('fx'),x=c.getContext('2d'),cur=document.querySelector('.cursor');let tx=0,ty=0,mx=0,my=0,tp=0,p=0,lastY=0,vel=0,parts=[];
function resize(){const d=Math.min(devicePixelRatio,1.6);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);parts=Array.from({length:innerWidth<900?28:52},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.15,vy:-(.12+Math.random()*.28),r:.5+Math.random()*1.6,a:.08+Math.random()*.42}))}resize();addEventListener('resize',resize);
function onScroll(){const m=document.documentElement.scrollHeight-innerHeight;tp=m?scrollY/m:0;vel=Math.min(.18,Math.abs(scrollY-lastY)/220);lastY=scrollY}addEventListener('scroll',onScroll,{passive:true});onScroll();addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'},{passive:true});
addEventListener('pointerdown',e=>{const r=document.createElement('i');Object.assign(r.style,{position:'fixed',left:e.clientX+'px',top:e.clientY+'px',width:'20px',height:'20px',border:'1px solid rgba(255,226,170,.55)',borderRadius:'50%',pointerEvents:'none',zIndex:19,transform:'translate(-50%,-50%)'});document.body.appendChild(r);r.animate([{transform:'translate(-50%,-50%) scale(.6)',opacity:1},{transform:'translate(-50%,-50%) scale(6)',opacity:0}],{duration:700,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>r.remove()});
function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const o of parts){o.x+=o.vx+mx*.05;o.y+=o.vy-p*.15;if(o.y<-10){o.y=innerHeight+10;o.x=Math.random()*innerWidth}if(o.x<-10)o.x=innerWidth+10;if(o.x>innerWidth+10)o.x=-10;x.beginPath();x.fillStyle=`rgba(244,218,169,${o.a})`;x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}}
function tick(){mx+=(tx-mx)*.045;my+=(ty-my)*.045;p+=(tp-p)*.05;vel*=.92;root.style.setProperty('--mx',mx.toFixed(3));root.style.setProperty('--my',my.toFixed(3));root.style.setProperty('--p',p.toFixed(4));root.style.setProperty('--vel',vel.toFixed(4));draw();requestAnimationFrame(tick)}tick();</script></body></html>'''
          Path('orbital-shrine/index.html').write_text(html)
          Path('.github/workflows/orbital-v8.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild Orbital Shrine as layered Awwwards motion V8"
          git push
