name: Orbital Shrine V8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orbital-v8.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V8
        shell: bash
        run: |
          python -c "from pathlib import Path; import re,base64; s=Path('orbital-shrine/index.html').read_text(); m=re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',s); assert m; Path('orbital-shrine/bg.webp').write_bytes(base64.b64decode(m.group(1)))"
          echo '' | base64 -d > orbital-shrine/index.html
          rm .github/workflows/orbital-v8.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rebuild Orbital Shrine as layered Awwwards motion V8'
          git push
