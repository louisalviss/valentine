name: Diagnose and repair GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - pages-diagnostic.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BEFORE_CODE=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          PUT_CODE=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')

          AFTER_CODE=$(curl -sS -o /tmp/pages-after.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          {
            echo "before_http=$BEFORE_CODE"
            cat /tmp/pages-before.json
            echo
            echo "put_http=$PUT_CODE"
            cat /tmp/pages-put.json
            echo
            echo "after_http=$AFTER_CODE"
            cat /tmp/pages-after.json
            echo
          } > pages-diagnostic.txt

      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture Pages diagnostic [skip ci]"
          git push
