name: Web Motion Library QA

on:
  push:
    branches: [main]
    paths:
      - 'web-motion-library/**'
      - 'patterns/aura-eclipse/**'
      - 'patterns/mechanical-iris/**'
      - 'patterns/castle-assembly/**'
      - 'patterns/aurel-build/**'
      - 'patterns/mira-ai-motion/**'
      - 'patterns/signal-story/**'
      - 'patterns/living-atlas/**'
      - 'patterns/last-house-cinematic/**'
      - 'patterns/vanta-editorial/**'
      - 'patterns/sword-3d/**'
      - 'patterns/nocturne/**'
      - 'patterns/vokie-process-machine/**'
      - 'patterns/preflight/**'
      - 'patterns/kaizen/**'
      - '.github/workflows/web-motion-library-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate library schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          lib=json.loads(Path('web-motion-library/library.json').read_text())
          quality=json.loads(Path('web-motion-library/quality.json').read_text())
          assert len(lib['patterns']) >= 10
          assert set(p['id'] for p in lib['patterns']) == set(quality['patterns'])
          assert sum(quality['weights'].values()) == 100
          ids=set(); indexes=set()
          for p in lib['patterns']:
              for key in ['id','index','title','family','live','description','primitives','status']:
                  assert p.get(key), (p.get('id'), key)
              assert p['live'].startswith('../patterns/'), (p['id'], p['live'])
              assert p['id'] not in ids and p['index'] not in indexes
              ids.add(p['id']); indexes.add(p['index'])
              assert len(p['primitives']) >= 1
          print('LIBRARY_SCHEMA_OK', len(lib['patterns']))
          PY

      - name: Run quality gate
        run: node web-motion-library/quality-gate.mjs

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/wml-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/web-motion-library/ >/tmp/wml.html && break
            sleep 1
          done
          grep -q 'data-build="motion-library-v2"' /tmp/wml.html
          curl -fsS http://127.0.0.1:4173/web-motion-library/quality.json | grep -q 'distinctGrammar'
          curl -fsS http://127.0.0.1:4173/web-motion-library/library.json | grep -q '../patterns/kaizen/'
          curl -fsS http://127.0.0.1:4173/patterns/aura-eclipse/ >/dev/null
          echo 'LIBRARY_ROUTE_OK'

      - name: Capture responsive QA
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          mkdir -p qa
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa/mobile-390x844.png http://127.0.0.1:4173/web-motion-library/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=768,1024 --screenshot=qa/tablet-768x1024.png http://127.0.0.1:4173/web-motion-library/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=qa/desktop-1440x900.png http://127.0.0.1:4173/web-motion-library/
          test -s qa/mobile-390x844.png
          test -s qa/tablet-768x1024.png
          test -s qa/desktop-1440x900.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web-motion-library-qa-${{ github.run_id }}
          path: qa/
          retention-days: 2

      - name: PASS
        run: echo 'WEB_MOTION_LIBRARY_QA_OK'
