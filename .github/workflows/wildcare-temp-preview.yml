name: Deploy Wildcare temporary preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "motion-morph/deploy-pr-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle bird media locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p motion-morph/assets
          curl -fL --retry 3 --retry-delay 2 \
            'https://video.twimg.com/amplify_video/2090685286162501632/vid/avc1/1920x1080/rzvA3-jWeYTTi1JP.mp4?tag=29' \
            -o motion-morph/assets/bird.mp4
          curl -fL --retry 3 --retry-delay 2 \
            'https://pbs.twimg.com/amplify_video_thumb/2090685286162501632/img/TncRk7yS5sGZMgdJ.jpg' \
            -o motion-morph/assets/bird.jpg
          test -s motion-morph/assets/bird.mp4
          test -s motion-morph/assets/bird.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('motion-morph/index.html')
          s = p.read_text()
          s = s.replace('https://video.twimg.com/amplify_video/2090685286162501632/vid/avc1/1920x1080/rzvA3-jWeYTTi1JP.mp4?tag=29', 'assets/bird.mp4')
          s = s.replace('https://pbs.twimg.com/amplify_video_thumb/2090685286162501632/img/TncRk7yS5sGZMgdJ.jpg', 'assets/bird.jpg')
          p.write_text(s)
          PY
          ls -lh motion-morph/assets/bird.mp4 motion-morph/assets/bird.jpg

      - name: Deploy temporary Workers static assets
        id: cf
        shell: bash
        run: |
          set +e
          npx wrangler@4.110.0 deploy \
            --assets motion-morph \
            --name wildcare-motion-morph \
            --compatibility-date 2026-08-22 \
            --temporary 2>&1 | tee deploy.log
          STATUS=${PIPESTATUS[0]}

          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev[^[:space:]]*' deploy.log | tail -n 1 | sed -E 's/[),]+$//')
          CLAIM=$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[A-Za-z0-9_-]+' deploy.log | tail -n 1)

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "claim=$CLAIM" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ] || [ -z "$URL" ]; then
            exit 1
          fi

      - name: Comment live URL
        if: success()
        uses: actions/github-script@v7
        env:
          LIVE_URL: ${{ steps.cf.outputs.url }}
          CLAIM_URL: ${{ steps.cf.outputs.claim }}
        with:
          script: |
            const extra = process.env.CLAIM_URL ? `\n\nClaim temporary account: ${process.env.CLAIM_URL}` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Wildcare live preview: ${process.env.LIVE_URL}${extra}`
            });

      - name: Comment deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.existsSync('deploy.log') ? fs.readFileSync('deploy.log','utf8') : 'No deploy log.';
            if (log.length > 12000) log = log.slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Wildcare Cloudflare deployment failed.\n\n\`\`\`text\n${log}\n\`\`\``
            });