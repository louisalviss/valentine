<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#040812"><title>Dragon Strike — Cinematic Wuxia</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;touch-action:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#scene{position:fixed;inset:-2%;background:url('./dragon-concept.jpg') center center/cover no-repeat;transform:scale(1.025);filter:saturate(1.08) contrast(1.04) brightness(.9);will-change:transform,filter}#scene:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 63% 42%,rgba(80,212,255,.05),transparent 27%),radial-gradient(circle at 28% 63%,rgba(255,210,132,.035),transparent 22%),linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.16))}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 52% 46%,transparent 45%,rgba(0,0,0,.32) 100%)}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));pointer-events:none}.top{max-width:min(72vw,540px)}.ey{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(218,236,249,.58);margin-bottom:8px}h1{margin:0;font-size:clamp(27px,6.7vw,58px);line-height:.9;letter-spacing:-.052em;color:rgba(248,252,255,.96);text-shadow:0 0 28px rgba(71,183,255,.18)}.sub{margin-top:10px;max-width:340px;font-size:12px;line-height:1.45;color:rgba(222,235,246,.58)}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.hint{font-size:10px;line-height:1.45;max-width:160px;color:rgba(218,230,240,.45)}.ctrl{pointer-events:auto}#cast{position:relative;border:1px solid rgba(179,229,255,.28);background:linear-gradient(180deg,rgba(14,31,51,.75),rgba(3,8,14,.82));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f8fcff;border-radius:999px;padding:14px 20px 14px 16px;display:flex;align-items:center;gap:10px;font:750 11px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 14px 44px rgba(0,0,0,.46),inset 0 0 28px rgba(91,203,255,.07);touch-action:manipulation}#cast:before{content:"";width:10px;height:10px;border-radius:50%;background:#d5fbff;box-shadow:0 0 10px #d5fbff,0 0 28px #5ee8ff}#cast:active{transform:scale(.97)}#meter{position:absolute;left:15px;right:15px;bottom:5px;height:1px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}#meter i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#6fe9ff,#fff1b4,#6fe9ff);box-shadow:0 0 8px #67ddff}@media(max-width:680px){.sub{font-size:11px;max-width:280px}.hint{max-width:125px}.ui{padding-left:14px;padding-right:14px}}
</style></head><body><div id="scene"></div><canvas id="fx"></canvas><div class="shade"></div><div class="ui"><div class="top"><div class="ey">Cinematic wuxia spell</div><h1>DRAGON<br>STRIKE</h1><div class="sub">Tap to aim the impact. CAST makes the existing spirit dragon surge, coil and detonate instead of redrawing it with crude geometry.</div></div><div class="bottom"><div class="hint">Recast anytime. Built as a cinematic plate + live VFX for iPhone Safari.</div><div class="ctrl"><button id="cast">Cast dragon<div id="meter"><i></i></div></button></div></div></div><script>
(()=>{const scene=document.getElementById('scene'),c=document.getElementById('fx'),x=c.getContext('2d'),btn=document.getElementById('cast'),meter=document.querySelector('#meter i');let w=0,h=0,dpr=1,last=0,castT=-9,aim={x:0,y:0};const coarse=matchMedia('(pointer:coarse)').matches,parts=[],rings=[],streaks=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),ease=t=>1-Math.pow(1-t,3);function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,coarse?1.5:2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);aim.x=w*.73;aim.y=h*.45}function burst(px,py,n=45){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(45,210);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.45,1.05),m:rnd(1.5,4.5),g:Math.random()>.7})}}function wave(px,py,gold=false){rings.push({x:px,y:py,r:8,a:1,gold})}function cast(){castT=performance.now()*.001;const sx=w*.31,sy=h*.64;wave(sx,sy,true);wave(sx,sy,false);burst(sx,sy,34);setTimeout(()=>{wave(aim.x,aim.y,true);wave(aim.x,aim.y,false);burst(aim.x,aim.y,56)},540);navigator.vibrate?.([18,28,22])}function aimAt(px,py){aim.x=clamp(px,w*.45,w*.9);aim.y=clamp(py,h*.2,h*.72)}function drawAmbient(t){x.save();x.globalCompositeOperation='screen';for(let i=0;i<26;i++){const yy=(i*83+t*9)% (h+80)-40,xx=(i*139+t*3)% (w+100)-50;x.fillStyle=`rgba(170,230,255,${.025+.018*Math.sin(t+i)})`;x.beginPath();x.arc(xx,yy,1.2+(i%3)*.35,0,7);x.fill()}x.restore()}function drawAim(){x.save();x.globalCompositeOperation='screen';const p=1+Math.sin(performance.now()*.004)*.06;x.strokeStyle='rgba(155,230,255,.26)';x.lineWidth=1.2;x.beginPath();x.arc(aim.x,aim.y,22*p,0,7);x.stroke();x.beginPath();x.arc(aim.x,aim.y,33*p,.2,4.7);x.stroke();x.fillStyle='rgba(243,253,255,.72)';x.beginPath();x.arc(aim.x,aim.y,2.8,0,7);x.fill();x.restore()}function drawSpell(t){const age=t-castT;if(age<0||age>2.4){meter.style.transform='scaleX(0)';return}const p=clamp(age/1.25,0,1),e=ease(p),sx=w*.31,sy=h*.64;meter.style.transform=`scaleX(${p})`;scene.style.transform=`translate(${Math.sin(e*Math.PI)*-6}px,${Math.sin(e*Math.PI)*3}px) scale(${1.025+Math.sin(e*Math.PI)*.026})`;scene.style.filter=`saturate(${1.08+Math.sin(e*Math.PI)*.18}) contrast(${1.04+Math.sin(e*Math.PI)*.08}) brightness(${.9+Math.sin(e*Math.PI)*.16})`;x.save();x.globalCompositeOperation='screen';const cx=(sx+aim.x)*.54,cy=(sy+aim.y)*.46-h*.14;for(let j=0;j<4;j++){x.strokeStyle=j%2?`rgba(255,218,151,${.11*(1-p)})`:`rgba(92,210,255,${.17*(1-p)})`;x.lineWidth=j?1.5:3;x.beginPath();const rr=(Math.hypot(aim.x-sx,aim.y-sy)*(.48+j*.12))*(.7+.3*Math.sin(e*Math.PI));x.arc(cx,cy,rr,t*(.22+j*.04)+j, t*(.22+j*.04)+j+Math.PI*(.8+j*.05));x.stroke()}const headX=sx+(aim.x-sx)*e,headY=sy+(aim.y-sy)*e-Math.sin(e*Math.PI)*h*.18;const g=x.createLinearGradient(sx,sy,headX,headY);g.addColorStop(0,'rgba(213,250,255,.05)');g.addColorStop(.58,'rgba(103,223,255,.28)');g.addColorStop(1,'rgba(255,248,214,.72)');x.strokeStyle=g;x.lineCap='round';x.lineWidth=8+12*Math.sin(e*Math.PI);x.shadowBlur=22;x.shadowColor='rgba(89,219,255,.65)';x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(cx,cy,headX,headY);x.stroke();x.shadowBlur=0;x.strokeStyle=`rgba(255,226,164,${.35*Math.sin(e*Math.PI)})`;x.lineWidth=2;x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(cx,cy+18,headX,headY);x.stroke();x.restore();if(age>1.15){const k=clamp((age-1.15)/.75,0,1);scene.style.transform=`translate(${Math.sin(k*28)*(1-k)*7}px,${Math.cos(k*22)*(1-k)*4}px) scale(${1.05-k*.025})`;scene.style.filter=`saturate(${1.25-k*.17}) contrast(${1.12-k*.08}) brightness(${1.05-k*.15})`}if(age>2.2){scene.style.transform='scale(1.025)';scene.style.filter='saturate(1.08) contrast(1.04) brightness(.9)'}}function update(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+8*dt;if(p.l<=0)parts.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*(r.gold?310:250);r.a-=dt*1.1;if(r.a<=0)rings.splice(i,1)}}function drawParticles(){x.save();x.globalCompositeOperation='screen';for(const p of parts){const a=clamp(p.l,0,1),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.m*4);g.addColorStop(0,p.g?`rgba(255,223,157,${a*.8})`:`rgba(127,232,255,${a*.78})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.m*4,0,7);x.fill()}for(const r of rings){x.strokeStyle=r.gold?`rgba(255,225,169,${r.a*.65})`:`rgba(136,229,255,${r.a*.62})`;x.lineWidth=r.gold?2:4;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()}x.restore()}function frame(ms){const t=ms*.001,dt=Math.min(.033,t-(last||t));last=t;x.clearRect(0,0,w,h);drawAmbient(t);update(dt);drawSpell(t);drawParticles();drawAim();requestAnimationFrame(frame)}function pointer(e){if(btn.contains(e.target))return;aimAt(e.clientX,e.clientY)}addEventListener('pointerdown',pointer,{passive:true});addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)},{passive:true});btn.addEventListener('pointerdown',e=>{e.preventDefault();cast()});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden){scene.style.transform='scale(1.025)';scene.style.filter='saturate(1.08) contrast(1.04) brightness(.9)'}});resize();requestAnimationFrame(frame)})();
</script></body></html>
