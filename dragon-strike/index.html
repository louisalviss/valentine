<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030713"><title>Dragon Strike — Character Cast</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;touch-action:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#fill{position:fixed;inset:-8%;background:url('./dragon-concept.jpg') center/cover no-repeat;filter:blur(24px) brightness(.35) saturate(1.1);transform:scale(1.1)}#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0c1830 0%,#040915 56%,#02040a 100%)}.plate{position:absolute;will-change:transform,filter,opacity;user-select:none;pointer-events:none}.base{z-index:1;filter:saturate(1.02) contrast(1.03) brightness(.78)}.dragon{z-index:3;clip-path:polygon(25% 0,100% 0,100% 84%,57% 88%,35% 72%,22% 43%);opacity:.16;filter:saturate(1.25) brightness(1.12) drop-shadow(0 0 8px rgba(90,215,255,.35));transform-origin:64% 43%}.character{z-index:4;clip-path:polygon(0 34%,39% 31%,43% 100%,0 100%);transform-origin:25% 74%;filter:saturate(1.08) brightness(1.03) drop-shadow(0 9px 16px rgba(0,0,0,.35))}.darken{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 59% 43%,transparent 18%,rgba(1,4,10,.08) 42%,rgba(0,0,0,.28) 100%);transition:background .25s}#fx{position:fixed;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}.flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--ix,70%) var(--iy,43%),rgba(229,250,255,.48),rgba(72,194,255,.12) 18%,transparent 42%);mix-blend-mode:screen}.ui{position:fixed;z-index:7;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(15px,env(safe-area-inset-top)) 15px max(17px,env(safe-area-inset-bottom))}.ey{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(216,236,250,.56);margin-bottom:7px}h1{margin:0;color:rgba(248,252,255,.96);font-size:clamp(27px,6.5vw,57px);line-height:.91;letter-spacing:-.05em;text-shadow:0 0 26px rgba(81,193,255,.18)}.sub{margin-top:9px;max-width:330px;color:rgba(222,236,247,.56);font-size:11px;line-height:1.45}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}.hint{max-width:135px;color:rgba(216,231,241,.43);font-size:10px;line-height:1.45}.ctrl{pointer-events:auto}#cast{position:relative;border:1px solid rgba(173,230,255,.29);background:linear-gradient(180deg,rgba(14,34,56,.79),rgba(3,9,16,.88));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f8fcff;border-radius:999px;padding:14px 20px 14px 16px;display:flex;align-items:center;gap:10px;font:750 11px/1 system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;box-shadow:0 14px 44px rgba(0,0,0,.47),inset 0 0 28px rgba(91,203,255,.07);touch-action:manipulation}#cast:before{content:"";width:10px;height:10px;border-radius:50%;background:#e1fcff;box-shadow:0 0 10px #e1fcff,0 0 27px #68e8ff}#cast:active{transform:scale(.97)}#meter{position:absolute;left:15px;right:15px;bottom:5px;height:1px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}#meter i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#6fe9ff,#fff2b7,#6fe9ff);box-shadow:0 0 8px #67ddff}.phase{position:absolute;right:16px;top:max(17px,env(safe-area-inset-top));font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(214,235,248,.42)}@media(max-width:680px){.sub{max-width:270px}.hint{max-width:120px}}
</style></head><body><div id="fill"></div><div id="stage"><img id="base" class="plate base" src="./dragon-concept.jpg" alt=""><img id="dragon" class="plate dragon" src="./dragon-concept.jpg" alt=""><img id="char" class="plate character" src="./dragon-concept.jpg" alt=""></div><div class="darken" id="darken"></div><canvas id="fx"></canvas><div class="flash" id="flash"></div><div class="ui"><div><div class="ey">Character-first wuxia VFX</div><h1>DRAGON<br>STRIKE</h1><div class="sub">Idle → gather qi → body commits forward → dragon erupts from the hand → impact → recovery.</div></div><div class="bottom"><div class="hint">Tap the scene to move the impact. CAST can be restarted at any point.</div><div class="ctrl"><button id="cast">Cast dragon<div id="meter"><i></i></div></button></div></div><div class="phase" id="phase">idle</div></div><script>
(()=>{const base=document.getElementById('base'),dragon=document.getElementById('dragon'),ch=document.getElementById('char'),c=document.getElementById('fx'),x=c.getContext('2d'),btn=document.getElementById('cast'),meter=document.querySelector('#meter i'),phase=document.getElementById('phase'),flash=document.getElementById('flash'),darken=document.getElementById('darken');let W=0,H=0,dpr=1,last=0,start=-99,impactDone=false,rect={x:0,y:0,w:0,h:0};let aim={x:.76,y:.46};const parts=[],waves=[];const coarse=matchMedia('(pointer:coarse)').matches;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),smooth=t=>t*t*(3-2*t),out=t=>1-Math.pow(1-t,3);function layout(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,coarse?1.55:2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);const ar=1672/941;if(W/H>ar){rect.w=W;rect.h=W/ar;rect.x=0;rect.y=(H-rect.h)/2}else{rect.h=H;rect.w=H*ar;rect.x=(W-rect.w)/2;rect.y=0}for(const el of[base,dragon,ch]){el.style.width=rect.w+'px';el.style.height=rect.h+'px';el.style.left=rect.x+'px';el.style.top=rect.y+'px'}}function P(nx,ny){return{x:rect.x+rect.w*nx,y:rect.y+rect.h*ny}}function emit(px,py,n=36,pow=190){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(pow*.3,pow);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.45,1.05),r:rnd(1.2,4.1),g:Math.random()>.68})}}function wave(px,py,g=false){waves.push({x:px,y:py,r:5,a:1,g})}function cast(){start=performance.now()*.001;impactDone=false;const hand=P(.285,.615);emit(hand.x,hand.y,32,170);wave(hand.x,hand.y,true);wave(hand.x,hand.y,false);navigator.vibrate?.(18)}function aimAt(px,py){aim.x=clamp((px-rect.x)/rect.w,.5,.9);aim.y=clamp((py-rect.y)/rect.h,.2,.72)}function pathPoint(t){const a=P(.285,.615),b=P(.48,.25),d=P(aim.x,aim.y),mt=1-t;return{x:mt*mt*a.x+2*mt*t*b.x+t*t*d.x,y:mt*mt*a.y+2*mt*t*b.y+t*t*d.y}}function drawPath(progress,alpha){const seg=46;x.save();x.globalCompositeOperation='screen';x.lineCap='round';const pts=[];for(let i=0;i<=Math.floor(seg*progress);i++){const t=i/seg,p=pathPoint(t);pts.push(p)}if(pts.length<2){x.restore();return}for(const pass of[{w:34,a:.08,c:'84,178,255'},{w:17,a:.18,c:'79,221,255'},{w:4,a:.82,c:'241,253,255'}]){x.strokeStyle=`rgba(${pass.c},${pass.a*alpha})`;x.lineWidth=pass.w;x.shadowBlur=pass.w*.65;x.shadowColor='rgba(91,222,255,.65)';x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x,pts[i].y);x.stroke()}x.shadowBlur=0;x.strokeStyle=`rgba(255,219,151,${.35*alpha})`;x.lineWidth=2;x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++){const p=pts[i],q=pts[i-1];const nx=-(p.y-q.y),ny=p.x-q.x,len=Math.hypot(nx,ny)||1,off=Math.sin(i*.8+performance.now()*.008)*8;x.lineTo(p.x+nx/len*off,p.y+ny/len*off)}x.stroke();x.restore()}function orb(px,py,r,a){x.save();x.globalCompositeOperation='screen';const g=x.createRadialGradient(px,py,0,px,py,r*2.8);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.16,`rgba(188,243,255,${a*.95})`);g.addColorStop(.48,`rgba(74,201,255,${a*.34})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r*2.8,0,7);x.fill();x.restore()}function updateFX(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+8*dt;if(p.l<=0)parts.splice(i,1)}for(let i=waves.length-1;i>=0;i--){const r=waves[i];r.r+=dt*(r.g?315:255);r.a-=dt*1.12;if(r.a<=0)waves.splice(i,1)}}function drawFX(){x.save();x.globalCompositeOperation='screen';for(const p of parts){const a=clamp(p.l,0,1),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,p.g?`rgba(255,224,163,${a*.82})`:`rgba(122,232,255,${a*.78})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,7);x.fill()}for(const r of waves){x.strokeStyle=r.g?`rgba(255,225,168,${r.a*.65})`:`rgba(137,230,255,${r.a*.62})`;x.lineWidth=r.g?2:4;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()}x.restore()}function animateCharacter(t,age){const idleY=Math.sin(t*1.7)*1.3;if(age<0||age>2.55){ch.style.transform=`translate3d(0,${idleY}px,0) rotate(-.12deg) scale(1.002)`;dragon.style.transform='scale(1.003)';dragon.style.opacity='.16';dragon.style.filter='saturate(1.25) brightness(1.12) drop-shadow(0 0 8px rgba(90,215,255,.35))';phase.textContent='idle';darken.style.background='radial-gradient(circle at 59% 43%,transparent 18%,rgba(1,4,10,.08) 42%,rgba(0,0,0,.28) 100%)';return}if(age<.48){const p=smooth(age/.48);phase.textContent='gather qi';ch.style.transform=`translate3d(${-3*p}px,${4*p+idleY}px,0) rotate(${-1.15*p}deg) scale(${1-.008*p})`;dragon.style.opacity=`${.16+.08*p}`;dragon.style.transform=`scale(${1.003+.008*p})`;darken.style.background=`radial-gradient(circle at 29% 62%,rgba(29,126,170,${.06+.08*p}),rgba(0,0,0,.33) 54%,rgba(0,0,0,.48) 100%)`}else if(age<.72){const p=out((age-.48)/.24);phase.textContent='release';ch.style.transform=`translate3d(${9*p}px,${-3*p}px,0) rotate(${1.5*p}deg) scale(${1+.015*p})`;dragon.style.opacity=`${.24+.52*p}`;dragon.style.transform=`translate3d(${5*p}px,${-3*p}px,0) scale(${1.01+.035*p})`;dragon.style.filter=`saturate(${1.35+.25*p}) brightness(${1.2+.35*p}) drop-shadow(0 0 ${10+18*p}px rgba(87,224,255,.75))`}else if(age<1.5){const p=clamp((age-.72)/.78,0,1);phase.textContent='dragon surge';ch.style.transform=`translate3d(${9-5*p}px,${-3+2*p}px,0) rotate(${1.5-1.0*p}deg) scale(${1.015-.008*p})`;dragon.style.opacity=`${.76-.18*p}`;dragon.style.transform=`translate3d(${5+8*p}px,${-3-5*Math.sin(p*Math.PI)}px,0) scale(${1.045+.035*Math.sin(p*Math.PI)})`;dragon.style.filter=`saturate(1.62) brightness(${1.55-.18*p}) drop-shadow(0 0 ${28-8*p}px rgba(87,224,255,.8))`}else{const p=smooth(clamp((age-1.5)/1.05,0,1));phase.textContent='recover';ch.style.transform=`translate3d(${4*(1-p)}px,${1-p}px,0) rotate(${.5*(1-p)}deg) scale(${1.007-.005*p})`;dragon.style.opacity=`${.58-(.42*p)}`;dragon.style.transform=`translate3d(${13*(1-p)}px,0,0) scale(${1.04-.037*p})`;dragon.style.filter=`saturate(${1.55-.3*p}) brightness(${1.35-.23*p}) drop-shadow(0 0 ${20-12*p}px rgba(87,224,255,.65))`}}function frame(ms){const t=ms*.001,dt=Math.min(.033,t-(last||t));last=t;const age=t-start;x.clearRect(0,0,W,H);updateFX(dt);animateCharacter(t,age);const hand=P(.285,.615),imp=P(aim.x,aim.y);if(age>=0&&age<.48){const p=smooth(age/.48);orb(hand.x,hand.y,16+16*p,.7+.25*p);for(let i=0;i<3;i++){x.save();x.globalCompositeOperation='screen';x.strokeStyle=`rgba(${i? '100,218,255':'255,220,151'},${.14+.08*p})`;x.lineWidth=i?1.4:2;x.beginPath();x.arc(hand.x,hand.y,28+i*13+t%1*4,t*(1+i*.17)+i,t*(1+i*.17)+i+Math.PI*1.25);x.stroke();x.restore()}}if(age>=.48&&age<1.5){const p=clamp((age-.48)/.75,0,1);drawPath(out(p),1-clamp((age-1.28)/.3,0,1)*.35);orb(hand.x,hand.y,22,.86);if(age>.98&&!impactDone){impactDone=true;wave(imp.x,imp.y,true);wave(imp.x,imp.y,false);emit(imp.x,imp.y,60,250);flash.style.setProperty('--ix',(imp.x/W*100)+'%');flash.style.setProperty('--iy',(imp.y/H*100)+'%');flash.animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:330,easing:'ease-out'});navigator.vibrate?.([20,18,24])}}drawFX();meter.style.transform=`scaleX(${age<0||age>2.55?0:clamp(age/1.45,0,1)})`;requestAnimationFrame(frame)}function pointer(e){if(btn.contains(e.target))return;aimAt(e.clientX,e.clientY)}addEventListener('pointerdown',pointer,{passive:true});addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)},{passive:true});btn.addEventListener('pointerdown',e=>{e.preventDefault();cast()});addEventListener('resize',layout);base.addEventListener('load',layout,{once:true});layout();requestAnimationFrame(frame)})();
</script></body></html>
