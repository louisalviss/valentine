<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030713"><title>Dragon Strike — HD Character Cast</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;touch-action:none;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#fill{position:fixed;inset:-5%;background:url('./dragon-concept-hd.webp') center/cover no-repeat;filter:blur(28px) brightness(.3) saturate(1.05);transform:scale(1.08)}#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#0b172c,#030711 70%)}#plate{position:absolute;display:block;max-width:none;will-change:transform,filter;filter:saturate(1.06) contrast(1.035) brightness(.9);transform-origin:32% 61%;pointer-events:none;user-select:none}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 53% 45%,transparent 43%,rgba(0,0,0,.34) 100%)}#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at var(--ix,72%) var(--iy,45%),rgba(240,253,255,.7),rgba(86,212,255,.18) 17%,transparent 43%)}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 14px max(17px,env(safe-area-inset-bottom));pointer-events:none}.ey{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(220,238,250,.54);margin-bottom:7px}h1{margin:0;font-size:clamp(26px,6.3vw,55px);line-height:.91;letter-spacing:-.05em;color:rgba(248,252,255,.96);text-shadow:0 0 28px rgba(77,200,255,.18)}.sub{margin-top:9px;max-width:315px;font-size:11px;line-height:1.44;color:rgba(224,237,247,.55)}.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.hint{max-width:130px;font-size:10px;line-height:1.42;color:rgba(216,231,241,.42)}.ctrl{pointer-events:auto}#cast{position:relative;border:1px solid rgba(173,230,255,.29);background:li </style></head><body><div id="fill"></div><div id="stage"><img id="plate" src="./dragon-concept-hd.webp" alt=""></div><div class="shade"></div><canvas id="fx"></canvas><div class="flash" id="flash"></div><div class="ui"><div><div class="ey">HD cinematic character cast</div><h1>DRAGON<br>STRIKE</h1><div class="sub">One intact HD plate. The cast is driven from the character’s hand with qi charge, camera recoil, dragon surge and impact — no sliced image layers.</div></div><div class="bottom"><div class="hint">Tap the scene to move the impact. CAST can restart instantly.</div><div class="ctrl"><button id="cast">Cast dragon<div id="meter"><i></i></div></button></div></div><div id="phase">idle</div></div><script>
(()=>{const plate=document.getElementById('plate'),c=document.getElementById('fx'),x=c.getContext('2d'),btn=document.getElementById('cast'),meter=document.querySelector('#meter i'),phase=document.getElementById('phase'),flash=document.getElementById('flash');let W=0,H=0,dpr=1,last=0,start=-99,impactDone=false,rect={x:0,y:0,w:0,h:0},aim={x:.77,y:.46};const coarse=matchMedia('(pointer:coarse)').matches,parts=[],waves=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),smooth=t=>t*t*(3-2*t),out=t=>1-Math.pow(1-t,3);function layout(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,coarse?1.6:2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);const ar=1672/941,portrait=W/H<.95;if(portrait){rect.w=W;rect.h=W/ar;rect.x=0;rect.y=(H-rect.h)/2}else if(W/H>ar){rect.w=W;rect.h=W/ar;rect.x=0;rect.y=(H-rect.h)/2}else{rect.h=H;rect.w=H*ar;rect.x=(W-rect.w)/2;rect.y=0}plate.style.width=rect.w+'px';plate.style.height=rect.h+'px';plate.style.left=rect.x+'px';plate.style.top=rect.y+'px'}function P(nx,ny){return{x:rect.x+rect.w*nx,y:rect.y+rect.h*ny}}function emit(px,py,n=40,pow=200){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(pow*.25,pow);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.45,1.05),r:rnd(1.1,4.2),g:Math.random()>.7})}}function wave(px,py,g=false){waves.push({x:px,y:py,r:5,a:1,g})}function cast(){start=performance.now()*.001;impactDone=false;const h=P(.285,.615);emit(h.x,h.y,34,175);wave(h.x,h.y,true);wave(h.x,h.y,false);navigator.vibrate?.(18)}function aimAt(px,py){aim.x=clamp((px-rect.x)/rect.w,.48,.9);aim.y=clamp((py-rect.y)/rect.h,.18,.75)}function pathPoint(t){const a=P(.285,.615),b=P(.48,.25),d=P(aim.x,aim.y),m=1-t;return{x:m*m*a.x+2*m*t*b.x+t*t*d.x,y:m*m*a.y+2*m*t*b.y+t*t*d.y}}function orb(px,py,r,a){x.save();x.globalCompositeOperation='screen';const g=x.createRadialGradient(px,py,0,px,py,r*2.8);g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(.16,`rgba(190,244,255,${a*.94})`);g.addColorStop(.48,`rgba(70,205,255,${a*.36})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r*2.8,0,7);x.fill();x.restore()}function drawPath(p,a){const seg=54,n=Math.max(2,Math.floor(seg*p)),pts=[];for(let i=0;i<=n;i++)pts.push(pathPoint(i/seg));x.save();x.globalCompositeOperation='screen';x.lineCap='round';for(const pass of[{w:38,a:.07,c:'64,164,255'},{w:19,a:.18,c:'73,220,255'},{w:4,a:.86,c:'244,254,255'}]){x.strokeStyle=`rgba(${pass.c},${pass.a*a})`;x.lineWidth=pass.w;x.shadowBlur=pass.w*.65;x.shadowColor='rgba(82,220,255,.7)';x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)x.lineTo(pts[i].x,pts[i].y);x.stroke()}x.shadowBlur=0;x.strokeStyle=`rgba(255,221,157,${.36*a})`;x.lineWidth=2;x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++){const q=pts[i-1],r=pts[i],dx=r.x-q.x,dy=r.y-q.y,len=Math.hypot(dx,dy)||1,o=Math.sin(i*.72+performance.now()*.008)*7;x.lineTo(r.x-dy/len*o,r.y+dx/len*o)}x.stroke();x.restore()}function update(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+8*dt;if(p.l<=0)parts.splice(i,1)}for(let i=waves.length-1;i>=0;i--){const r=waves[i];r.r+=dt*(r.g?315:255);r.a-=dt*1.12;if(r.a<=0)waves.splice(i,1)}}function drawFX(){x.save();x.globalCompositeOperation='screen';for(const p of parts){const a=clamp(p.l,0,1),g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,p.g?`rgba(255,224,163,${a*.82})`:`rgba(122,232,255,${a*.78})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,7);x.fill()}for(const r of waves){x.strokeStyle=r.g?`rgba(255,225,168,${r.a*.66})`:`rgba(137,230,255,${r.a*.63})`;x.lineWidth=r.g?2:4;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke()}x.restore()}function animatePlate(t,age){const idle=Math.sin(t*1.4)*.8;if(age<0||age>2.5){plate.style.transform=`translate3d(0,${idle}px,0) scale(1)`;plate.style.filter='saturate(1.06) contrast(1.035) brightness(.9)';phase.textContent='idle';return}if(age<.48){const p=smooth(age/.48);phase.textContent='gather qi';plate.style.transform=`translate3d(${-1.5*p}px,${1.2*p}px,0) scale(${1+.006*p})`;plate.style.filter=`saturate(${1.06+.1*p}) contrast(${1.035+.04*p}) brightness(${.9-.05*p})`}else if(age<.72){const p=out((age-.48)/.24);phase.textContent='release';plate.style.transform=`translate3d(${3.5*p}px,${-1.8*p}px,0) scale(${1.006+.008*p})`;plate.style.filter=`saturate(${1.16+.16*p}) contrast(${1.075+.05*p}) brightness(${.85+.18*p})`}else if(age<1.5){const p=clamp((age-.72)/.78,0,1);phase.textContent='dragon surge';const kick=(1-p)*Math.sin(p*30)*2.5;plate.style.transform=`translate3d(${kick}px,${-kick*.45}px,0) scale(${1.014+.006*Math.sin(p*Math.PI)})`;plate.style.filter=`saturate(${1.32-.12*p}) contrast(${1.125-.04*p}) brightness(${1.03-.08*p})`}else{const p=smooth(clamp((age-1.5)/1,0,1));phase.textContent='recover';plate.style.transform=`translate3d(${1.2*(1-p)}px,0,0) scale(${1.01-.01*p})`;plate.style.filter=`saturate(${1.2-.14*p}) contrast(${1.085-.05*p}) brightness(${.95-.05*p})`}}function frame(ms){const t=ms*.001,dt=Math.min(.033,t-(last||t));last=t;const age=t-start;x.clearRect(0,0,W,H);update(dt);animatePlate(t,age);const hand=P(.285,.615),imp=P(aim.x,aim.y);if(age>=0&&age<.48){const p=smooth(age/.48);orb(hand.x,hand.y,15+18*p,.7+.26*p);for(let i=0;i<3;i++){x.save();x.globalCompositeOperation='screen';x.strokeStyle=i?`rgba(100,218,255,${.14+.08*p})`:`rgba(255,220,151,${.16+.08*p})`;x.lineWidth=i?1.3:2;x.beginPath();x.arc(hand.x,hand.y,28+i*13,t*(1+i*.17)+i,t*(1+i*.17)+i+Math.PI*1.25);x.stroke();x.restore()}}if(age>=.48&&age<1.5){const p=clamp((age-.48)/.75,0,1);drawPath(out(p),1-clamp((age-1.28)/.3,0,1)*.35);orb(hand.x,hand.y,21,.84);if(age>.98&&!impactDone){impactDone=true;wave(imp.x,imp.y,true);wave(imp.x,imp.y,false);emit(imp.x,imp.y,60,250);flash.style.setProperty('--ix',(imp.x/W*100)+'%');flash.style.setProperty('--iy',(imp.y/H*100)+'%');flash.animate([{opacity:0},{opacity:.92},{opacity:0}],{duration:330,easing:'ease-out'});navigator.vibrate?.([20,18,24])}}drawFX();meter.style.transform=`scaleX(${age<0||age>2.5?0:clamp(age/1.45,0,1)})`;requestAnimationFrame(frame)}function pointer(e){if(btn.contains(e.target))return;aimAt(e.clientX,e.clientY)}addEventListener('pointerdown',pointer,{passive:true});addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)},{passive:true});btn.addEventListener('pointerdown',e=>{e.preventDefault();cast()});addEventListener('resize',layout);plate.addEventListener('load',layout,{once:true});layout();requestAnimationFrame(frame)})();
</script></body></html>
