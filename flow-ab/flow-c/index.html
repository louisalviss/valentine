<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SiteOps AI — C / Terminal App</title><meta name="description" content="Interactive terminal-app interpretation of SiteOps AI."><style>:root{--bg:#020403;--panel:#07100b;--line:#163021;--green:#82ff63;--amber:#ffd15c;--text:#d8e3dc;--muted:#6f8076}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{padding-bottom:62px}a{color:inherit}.app{min-height:calc(100dvh - 62px);display:grid;grid-template-rows:42px 1fr 30px}.top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#030705}.lights{display:flex;gap:6px}.lights i{width:8px;height:8px;border-radius:50%;background:#203329}.lights i:first-child{background:var(--green)}.title{font-weight:800;color:#fff}.top .meta{margin-left:auto;color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--line);background:#040906;padding:14px}.section-label{color:var(--muted);font-size:10px;letter-spacing:.12em;margin:10px 0 8px}.navbtn{width:100%;text-align:left;border:0;background:transparent;color:#8fa196;padding:8px 9px;font:inherit;cursor:pointer}.navbtn:hover,.navbtn.active{background:#0a150e;color:var(--green)}.navbtn.active:before{content:'> ';color:var(--green)}.lock{margin-top:24px;border:1px solid var(--line);padding:10px;color:var(--muted);font-size:11px}.lock b{color:var(--green)}.pane{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.promptbar{border-bottom:1px solid var(--line);padding:10px 14px;color:var(--green);white-space:nowrap;overflow:auto}.terminal{padding:20px 22px;overflow:auto}.terminal h1{font-size:clamp(28px,4vw,56px);line-height:1.02;letter-spacing:-.04em;color:#fff;margin:0 0 18px;font-weight:700}.terminal p{max-width:860px;color:#9ca9a1;font-size:14px}.terminal pre{white-space:pre-wrap;color:#8fa196;margin:22px 0 0}.ok{color:var(--green)}.warn{color:var(--amber)}.jobs{margin-top:24px;border:1px solid var(--line);max-width:900px}.job{display:grid;grid-template-columns:110px 1fr 90px;gap:14px;padding:12px;border-bottom:1px solid var(--line)}.job:last-child{border-bottom:0}.job small{color:var(--muted)}.job b{color:#fff}.job em{font-style:normal;text-align:right;color:var(--amber)}.commandline{border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:8px;align-items:center}.commandline span{color:var(--green)}.commandline input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit}.run{border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;padding:7px 10px;cursor:pointer}.status{display:flex;align-items:center;gap:22px;padding:0 12px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.status b{color:var(--green)}@media(max-width:700px){.workspace{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow:auto;padding:8px}.section-label,.lock{display:none}.navbtn{width:auto;white-space:nowrap}.pane{min-height:680px}.job{grid-template-columns:1fr}.job em{text-align:left}.top .meta{display:none}.status{gap:10px;overflow:auto;white-space:nowrap}}</style><link rel="stylesheet" href="../switch.css"><script src="../switch.js" defer></script></head><body><div class="app"><header class="top"><span class="lights"><i></i><i></i><i></i></span><span class="title">siteops.app</span><span class="meta">demo.wordpress-site.example · read-only</span></header><div class="workspace"><aside class="side"><div class="section-label">COMMANDS</div><button class="navbtn active" data-view="overview">overview</button><button class="navbtn" data-view="performance">performance</button><button class="navbtn" data-view="seo">technical-seo</button><button class="navbtn" data-view="content">content-care</button><button class="navbtn" data-view="pipeline">pipeline</button><div class="lock">production writes: <b>LOCKED</b><br>review gate: <b>ON</b></div></aside><main class="pane"><div class="promptbar" id="prompt">$ siteops overview --mode=read-only</div><section class="terminal" id="terminal"></section><form class="commandline" id="cmdform"><span>$</span><input id="cmd" aria-label="Terminal command" placeholder="type: audit"><button class="run" type="submit">RUN</button></form></main></div><footer class="status"><span>SCAN <b>READY</b></span><span>WRITES <b>LOCKED</b></span><span>REVIEW <b>ON</b></span><span>VERIFY <b>ON</b></span></footer></div><nav class="experiment" aria-label="Design variants"></nav><script>const data={overview:{cmd:'siteops overview --mode=read-only',html:`<h1>Website drift detected.</h1><p>SiteOps AI audits performance, technical SEO, content gaps and maintenance issues, then returns one reviewable action plan before anything changes.</p><pre><span class="ok">✓</span> stack detected\n<span class="ok">✓</span> pages mapped\n<span class="ok">✓</span> plugins inventoried\n<span class="warn">!</span> 4 issue groups need review</pre><div class="jobs"><div class="job"><small>PERFORMANCE</small><b>Hero asset heavier than needed</b><em>HIGH</em></div><div class="job"><small>SEO</small><b>Internal links miss main service page</b><em>MED</em></div><div class="job"><small>CONTENT</small><b>Commercial positioning is stale</b><em>MED</em></div><div class="job"><small>MAINTENANCE</small><b>Plugin update has compatibility risk</b><em>REVIEW</em></div></div>`},performance:{cmd:'siteops performance --explain',html:`<h1>Performance audits</h1><p>Find slow templates, heavy assets, caching gaps and page-level bottlenecks before they become chronic Core Web Vitals problems.</p><pre><span class="warn">!</span> hero asset > required render size\n→ inspect delivery format\n→ inspect dimensions\n→ inspect cache path\n→ propose fix before write</pre>`},seo:{cmd:'siteops technical-seo --explain',html:`<h1>Technical SEO</h1><p>Surface crawlability, indexing, metadata, internal linking and structural issues with a prioritized plan instead of a raw error dump.</p><pre>crawlability ........ <span class="ok">OK</span>\nmetadata ............ REVIEW\ninternal links ...... <span class="warn">WEAK</span>\nindex intent ........ <span class="ok">OK</span></pre>`},content:{cmd:'siteops content-care --explain',html:`<h1>Content & maintenance</h1><p>Spot outdated pages, broken links, plugin maintenance risk and content gaps so the site keeps improving instead of slowly decaying.</p><pre>stale positioning ... 2 pages\nplugin change risk .. 1 review\nrollback path ....... required\nproduction write .... <span class="ok">LOCKED</span></pre>`},pipeline:{cmd:'siteops pipeline',html:`<h1>Inspect → Prioritize → Review → Verify</h1><pre>01 inspect     read site, stack, current state\n02 prioritize  rank by impact / risk / effort\n03 review      show proposed change before execution\n04 verify      check live result after approved change</pre><p>No marketing section needed: the operating model is the interface.</p>`}};function show(v){const d=data[v];document.getElementById('prompt').textContent='$ '+d.cmd;document.getElementById('terminal').innerHTML=d.html;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('cmdform').onsubmit=e=>{e.preventDefault();const q=document.getElementById('cmd').value.trim().toLowerCase();show(q.includes('seo')?'seo':q.includes('performance')?'performance':q.includes('content')?'content':q.includes('pipeline')?'pipeline':'overview');document.getElementById('cmd').value=''};show('overview');</script></body></html>
