<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171713" />
  <title>SiteOps AI — Design Library</title>
  <meta name="description" content="Live library and pair comparator for SiteOps AI variants A through H." />
  <style>
    :root{--bg:#ecece6;--ink:#171713;--paper:#f8f7f2;--line:#c9cac3;--muted:#77786f;--acid:#d9ff56;--bar:60px;color-scheme:light}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,a{font:inherit}.top{position:sticky;top:0;z-index:1000;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 14px;background:rgba(23,23,19,.97);color:#f5f4ee;border-bottom:1px solid #34342f;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand b{font-size:13px}.brand span{font-size:10px;color:#96978f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs,.viewport-switch{display:flex;gap:3px;padding:3px;border:1px solid #474840;border-radius:9px;background:#0f100d}.tabs button,.viewport-switch button,.toolbar-btn{appearance:none;border:0;background:transparent;color:#a1a29a;border-radius:6px;padding:7px 10px;font-size:10px;font-weight:850;cursor:pointer}.tabs button[aria-pressed="true"],.viewport-switch button[aria-pressed="true"]{background:var(--acid);color:#111}.right-tools{justify-self:end;display:flex;align-items:center;gap:6px}.toolbar-btn{border:1px solid #474840}.toolbar-btn:disabled{opacity:.4;cursor:not-allowed}.main{padding:18px}.library{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1800px;margin:0 auto}.card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.06);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.09)}.card.selected{border-color:#171713;box-shadow:0 0 0 2px #171713,0 12px 34px rgba(0,0,0,.09)}.preview{position:relative;width:100%;aspect-ratio:16/10;background:repeating-conic-gradient(#d3d3cd 0 25%,#cbcbc5 0 50%) 50%/18px 18px;overflow:hidden}.preview-shell{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:center;background:white;box-shadow:0 10px 26px rgba(0,0,0,.14);overflow:hidden}.preview iframe{display:block;border:0;background:white;pointer-events:none;transform-origin:0 0}.badge{position:absolute;left:9px;top:9px;z-index:5;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#171713;color:white;font-size:11px;font-weight:950}.card[data-full="true"] .badge{background:#164ee8}.card[data-letter="H"] .badge{background:#9a642f}.viewport-badge{position:absolute;right:8px;bottom:8px;z-index:5;background:rgba(17,17,15,.78);color:#e7e6df;border-radius:6px;padding:5px 6px;font-size:8px;letter-spacing:.06em}.card-body{padding:12px}.card-title{display:flex;align-items:start;justify-content:space-between;gap:10px}.card-title div{min-width:0}.card-title b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-title span{display:block;margin-top:3px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.actions{display:flex;gap:6px;margin-top:11px}.actions button,.actions a{flex:1;appearance:none;border:1px solid #c2c3bc;background:#f0efe9;color:#282823;border-radius:8px;padding:8px 9px;text-align:center;text-decoration:none;font-size:9px;font-weight:900;cursor:pointer}.actions button.active{background:#171713;color:#fff;border-color:#171713}.compare-bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1200;display:none;align-items:center;gap:10px;padding:8px 9px 8px 12px;border-radius:12px;background:#171713;color:#f5f4ee;box-shadow:0 14px 40px rgba(0,0,0,.28)}.compare-bar.show{display:flex}.compare-bar span{font-size:10px;color:#b6b7b0}.compare-bar b{color:#fff}.compare-bar button{appearance:none;border:0;background:var(--acid);color:#111;padding:9px 11px;border-radius:8px;font-size:10px;font-weight:950;cursor:pointer}.pair{display:none;height:calc(100dvh - var(--bar));background:#aaaBA4}.pair.active{display:grid;grid-template-columns:1fr 1fr;gap:1px}.pane{min-width:0;height:100%;display:flex;flex-direction:column;background:#d3d3cd}.pane-head{height:76px;flex:none;background:#f5f4ee;border-bottom:1px solid var(--line);padding:8px 10px}.pane-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pane-top .side{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.pane-top .current{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pane-top a{font-size:9px;font-weight:900;color:var(--ink);text-decoration:none;border-bottom:1px solid}.rail{display:flex;gap:4px;margin-top:7px;overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail button{flex:0 0 28px;height:28px;border:1px solid #c5c6bf;background:#ecebe5;border-radius:7px;font-size:9px;font-weight:950;color:#66675f;cursor:pointer}.rail button.on{background:#171713;color:#fff;border-color:#171713}.pane-preview{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:8px;background:repeating-conic-gradient(#d3d3cd 0 25%,#cbcbc5 0 50%) 50%/18px 18px}.viewport{position:relative;background:white;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.14)}.viewport iframe{display:block;border:0;background:white;transform-origin:0 0}.size{position:absolute;right:7px;bottom:7px;z-index:4;background:rgba(17,17,15,.82);color:#dddcd6;padding:5px 6px;border-radius:5px;font-size:8px}.mobile-side{display:none}
    @media(max-width:1200px){.library{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:900px){.library{grid-template-columns:repeat(2,minmax(0,1fr))}.brand span{display:none}}
    @media(max-width:700px){:root{--bar:56px}.top{grid-template-columns:1fr auto;padding:7px 8px}.right-tools .viewport-switch{display:none}.main{padding:10px 0 18px}.library{display:flex;overflow-x:auto;gap:10px;padding:0 10px 16px;scroll-snap-type:x mandatory;scroll-padding:10px}.card{flex:0 0 82vw;scroll-snap-align:start}.card:hover{transform:none}.preview{aspect-ratio:390/844}.pair.active{display:block;position:relative}.pane{display:none;height:100%}.pane.mobile-active{display:flex}.mobile-side{display:flex}.right-tools{display:none}.tabs button{padding:7px 9px}.compare-bar{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 20px);justify-content:space-between}.compare-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pane-head{height:74px}.pane-preview{padding:5px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><b>SiteOps Library</b><span>A–H live design collection</span></div>
    <div class="tabs" role="group" aria-label="View mode"><button data-tab="library" aria-pressed="true">Library</button><button data-tab="pair" aria-pressed="false">Pair Compare</button></div>
    <div class="right-tools"><div class="viewport-switch" role="group" aria-label="Preview viewport"><button data-view="mobile" aria-pressed="false">390</button><button data-view="desktop" aria-pressed="true">1280</button></div></div>
  </header>

  <main class="main" id="libraryMain"><section class="library" id="library"></section></main>
  <section class="pair" id="pair"><section class="pane mobile-active" id="leftPane"></section><section class="pane" id="rightPane"></section></section>
  <div class="compare-bar" id="compareBar"><span>Selected: <b id="selectionText"></b></span><button id="compareNow">Compare</button></div>

  <script>
    const variants={A:{slug:'no-flow',name:'Baseline AI SaaS',type:'baseline'},B:{slug:'with-flow',name:'Editorial Dossier',type:'guided'},C:{slug:'flow-c',name:'Interactive Terminal App',type:'guided'},D:{slug:'flow-d',name:'Quiet Minimal Gallery',type:'guided'},E:{slug:'flow-e',name:'Interactive Spatial Topology',type:'guided'},F:{slug:'flow-f',name:'Horizontal Brutalist Poster',type:'guided'},G:{slug:'full-flow-g',name:'Operating Manual',type:'full flow'},H:{slug:'full-flow-h',name:'Spatial Control Surface',type:'full flow'}};
    const library=document.getElementById('library'),libraryMain=document.getElementById('libraryMain'),pair=document.getElementById('pair'),compareBar=document.getElementById('compareBar'),selectionText=document.getElementById('selectionText');
    const panes={left:document.getElementById('leftPane'),right:document.getElementById('rightPane')};
    let libraryView=matchMedia('(max-width:700px)').matches?'mobile':'desktop',selected=[],pairSelected={left:'G',right:'H'},mobileSide='left';
    function source(key){return `./${variants[key].slug}/?library=1&v=11`}
    function hideDock(frame){try{const d=frame.contentDocument;if(!d||d.querySelector('[data-library-hide]'))return;const s=d.createElement('style');s.dataset.libraryHide='1';s.textContent='.experiment{display:none!important}';d.head.appendChild(s)}catch(e){}}
    function spec(view){return view==='mobile'?{w:390,h:844}:{w:1280,h:900}}
    function fitLibraryCard(card){const frame=card.querySelector('iframe'),shell=card.querySelector('.preview-shell'),preview=card.querySelector('.preview'),badge=card.querySelector('.viewport-badge');if(!frame||!shell)return;const s=spec(libraryView),pw=preview.clientWidth,ph=preview.clientHeight,scale=Math.min(pw/s.w,ph/s.h);frame.style.width=s.w+'px';frame.style.height=s.h+'px';frame.style.transform=`scale(${scale})`;shell.style.width=Math.round(s.w*scale)+'px';shell.style.height=Math.round(s.h*scale)+'px';badge.textContent=`${s.w}×${s.h}`;try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}
    function renderLibrary(){library.innerHTML='';for(const [key,v] of Object.entries(variants)){const card=document.createElement('article');card.className='card'+(selected.includes(key)?' selected':'');card.dataset.letter=key;card.dataset.full=String(v.type==='full flow');card.innerHTML=`<div class="preview"><span class="badge">${key}</span><div class="preview-shell"><iframe title="${key} · ${v.name}" loading="eager" src="${source(key)}"></iframe></div><span class="viewport-badge"></span></div><div class="card-body"><div class="card-title"><div><b>${v.name}</b><span>${v.type}</span></div></div><div class="actions"><button class="select ${selected.includes(key)?'active':''}" data-select="${key}">${selected.includes(key)?'Selected':'Select'}</button><a href="./${v.slug}/" target="_blank" rel="noopener">Open ↗</a></div></div>`;library.appendChild(card);const frame=card.querySelector('iframe');frame.addEventListener('load',()=>{hideDock(frame);fitLibraryCard(card);setTimeout(()=>fitLibraryCard(card),250)});card.querySelector('[data-select]').onclick=()=>toggleSelect(key);requestAnimationFrame(()=>fitLibraryCard(card))}}
    function toggleSelect(key){if(selected.includes(key))selected=selected.filter(x=>x!==key);else{if(selected.length>=2)selected.shift();selected.push(key)}renderLibrary();updateCompareBar()}
    function updateCompareBar(){compareBar.classList.toggle('show',selected.length===2);selectionText.textContent=selected.join(' ↔ ')}
    function setTab(tab){const isLibrary=tab==='library';libraryMain.style.display=isLibrary?'block':'none';pair.classList.toggle('active',!isLibrary);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));if(!isLibrary){renderPair('left');renderPair('right')}}
    function pairRail(side){return Object.keys(variants).map(k=>`<button data-pair-pick="${k}" class="${pairSelected[side]===k?'on':''}">${k}</button>`).join('')}
    function fitPane(side){const pane=panes[side],area=pane.querySelector('.pane-preview'),vp=pane.querySelector('.viewport'),frame=pane.querySelector('iframe');if(!area||!vp||!frame)return;const s=spec(libraryView),aw=Math.max(220,area.clientWidth-8),ah=Math.max(300,area.clientHeight-8),scale=Math.min(1,aw/s.w,ah/s.h);frame.style.width=s.w+'px';frame.style.height=s.h+'px';frame.style.transform=`scale(${scale})`;vp.style.width=Math.round(s.w*scale)+'px';vp.style.height=Math.round(s.h*scale)+'px';pane.querySelector('.size').textContent=`${s.w} × ${s.h} · ${Math.round(scale*100)}%`;try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}
    function renderPair(side){const key=pairSelected[side],v=variants[key],pane=panes[side];pane.innerHTML=`<header class="pane-head"><div class="pane-top"><span class="side">${side}</span><div class="current">${key} · ${v.name}</div><a href="./${v.slug}/" target="_blank" rel="noopener">OPEN ↗</a></div><div class="rail">${pairRail(side)}</div></header><div class="pane-preview"><div class="viewport"><iframe title="${key} · ${v.name}" src="${source(key)}"></iframe><span class="size"></span></div></div>`;pane.querySelectorAll('[data-pair-pick]').forEach(b=>b.onclick=()=>{pairSelected[side]=b.dataset.pairPick;renderPair(side)});const frame=pane.querySelector('iframe');frame.addEventListener('load',()=>{hideDock(frame);fitPane(side);setTimeout(()=>fitPane(side),250)});requestAnimationFrame(()=>fitPane(side))}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{libraryView=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.view===libraryView)));renderLibrary();if(pair.classList.contains('active')){renderPair('left');renderPair('right')}});document.getElementById('compareNow').onclick=()=>{if(selected.length!==2)return;pairSelected={left:selected[0],right:selected[1]};setTab('pair');compareBar.classList.remove('show')};
    let sx=0,sy=0;pair.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});pair.addEventListener('touchend',e=>{if(innerWidth>700)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3){mobileSide=dx<0?'right':'left';panes.left.classList.toggle('mobile-active',mobileSide==='left');panes.right.classList.toggle('mobile-active',mobileSide==='right');requestAnimationFrame(()=>fitPane(mobileSide))}},{passive:true});
    addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(()=>{document.querySelectorAll('.card').forEach(fitLibraryCard);fitPane('left');fitPane('right')},120)},{passive:true});renderLibrary();updateCompareBar();
  </script>
</body>
</html>
