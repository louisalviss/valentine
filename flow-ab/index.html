<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171713" />
  <title>SiteOps AI — Design Library</title>
  <meta name="description" content="Live vertical design library and pair comparator for SiteOps AI variants A through H." />
  <style>
    :root{--bg:#ecece6;--ink:#171713;--paper:#f8f7f2;--line:#c9cac3;--muted:#77786f;--acid:#d9ff56;--bar:60px;--cols:3;color-scheme:light}
    *{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}body{background:var(--bg)}button,a{font:inherit}
    .top{position:sticky;top:0;z-index:1000;min-height:var(--bar);display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);align-items:center;gap:10px;padding:8px 14px;background:rgba(23,23,19,.97);color:#f5f4ee;border-bottom:1px solid #34342f;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}.brand b{font-size:13px;white-space:nowrap}.brand span{font-size:10px;color:#96978f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .center-tools,.right-tools{display:flex;align-items:center;gap:6px}.center-tools{justify-content:center}.right-tools{justify-self:end}.group{display:flex;gap:3px;padding:3px;border:1px solid #474840;border-radius:9px;background:#0f100d;overflow:auto;scrollbar-width:none}.group::-webkit-scrollbar{display:none}.group button,.tool-btn{appearance:none;border:0;background:transparent;color:#a1a29a;border-radius:6px;padding:7px 10px;font-size:10px;font-weight:850;cursor:pointer;white-space:nowrap}.group button[aria-pressed="true"],.tool-btn[aria-pressed="true"]{background:var(--acid);color:#111}.tool-btn{border:1px solid #474840}.tool-btn:hover{color:#fff}
    .main{padding:16px 16px 86px}.library{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;max-width:1800px;margin:0 auto;align-items:start}.library.layout-1{--cols:1;max-width:1320px}.library.layout-2{--cols:2}.library.layout-3{--cols:3}.library.layout-4{--cols:4}
    .card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.055);cursor:pointer;position:relative;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}.card:hover{border-color:#8d8e86;transform:translateY(-1px)}.card.selected{border:3px solid var(--ink);box-shadow:0 10px 34px rgba(0,0,0,.13);transform:none}.card.selected:after{content:'SELECTED';position:absolute;right:9px;top:9px;z-index:8;background:var(--acid);color:#111;border-radius:7px;padding:6px 7px;font-size:8px;font-weight:950;letter-spacing:.08em}.card:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
    .preview{position:relative;width:100%;aspect-ratio:1280/900;background:repeating-conic-gradient(#d3d3cd 0 25%,#cbcbc5 0 50%) 50%/18px 18px;overflow:hidden}.library.view-mobile .preview{aspect-ratio:390/844}.preview-shell{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.preview iframe{display:block;border:0;background:white;pointer-events:none;transform-origin:0 0}.badge{position:absolute;left:9px;top:9px;z-index:7;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#171713;color:white;font-size:11px;font-weight:950}.card[data-full="true"] .badge{background:#164ee8}.card[data-letter="H"] .badge{background:#9a642f}.viewport-badge{position:absolute;right:8px;bottom:8px;z-index:7;background:rgba(17,17,15,.78);color:#e7e6df;border-radius:6px;padding:5px 6px;font-size:8px;letter-spacing:.06em}
    .card-body{padding:11px 12px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.card-title{min-width:0}.card-title b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-title span{display:block;margin-top:3px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.open{border:1px solid #c2c3bc;background:#f0efe9;color:#282823;border-radius:8px;padding:8px 10px;text-decoration:none;font-size:9px;font-weight:900;white-space:nowrap}.open:hover{border-color:#77786f}
    .compare-bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1200;display:none;align-items:center;gap:10px;padding:8px 9px 8px 12px;border-radius:12px;background:#171713;color:#f5f4ee;box-shadow:0 14px 40px rgba(0,0,0,.28)}.compare-bar.show{display:flex}.compare-bar span{font-size:10px;color:#b6b7b0}.compare-bar b{color:#fff}.compare-bar button{appearance:none;border:0;background:var(--acid);color:#111;padding:9px 11px;border-radius:8px;font-size:10px;font-weight:950;cursor:pointer}
    .pair{display:none;height:calc(100dvh - var(--bar));background:#aaaba4;overflow:hidden}.pair.active{display:grid;grid-template-columns:1fr 1fr;gap:1px}.pane{min-width:0;height:100%;display:flex;flex-direction:column;background:#d3d3cd}.pane-head{height:76px;flex:none;background:#f5f4ee;border-bottom:1px solid var(--line);padding:8px 10px}.pane-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pane-top .side{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.pane-top .current{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pane-top a{font-size:9px;font-weight:900;color:var(--ink);text-decoration:none;border-bottom:1px solid}.rail{display:flex;gap:4px;margin-top:7px;overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail button{flex:0 0 28px;height:28px;border:1px solid #c5c6bf;background:#ecebe5;border-radius:7px;font-size:9px;font-weight:950;color:#66675f;cursor:pointer}.rail button.on{background:#171713;color:#fff;border-color:#171713}.pane-preview{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:8px;background:repeating-conic-gradient(#d3d3cd 0 25%,#cbcbc5 0 50%) 50%/18px 18px}.viewport{position:relative;background:white;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.14)}.viewport iframe{display:block;border:0;background:white;transform-origin:0 0}.size{position:absolute;right:7px;bottom:7px;z-index:4;background:rgba(17,17,15,.82);color:#dddcd6;padding:5px 6px;border-radius:5px;font-size:8px}.mobile-side{display:none}
    @media(max-width:900px){.top{grid-template-columns:1fr auto}.brand span{display:none}.right-tools{display:none}.center-tools{justify-self:end}.main{padding:10px 10px 84px}.library{gap:10px}.card-body{padding:9px}.open{padding:7px 8px}}
    @media(max-width:700px){:root{--bar:96px}.top{grid-template-columns:1fr;align-items:stretch;gap:6px;padding:7px 8px}.brand{display:none}.center-tools{justify-content:space-between;width:100%}.center-tools>.group:first-child{flex:1}.center-tools>.group:first-child button{flex:1}.library.layout-1,.library.layout-2,.library.layout-3,.library.layout-4{max-width:none}.main{padding:8px 8px 86px}.library{gap:8px}.card{border-radius:10px}.card.selected{border-width:3px}.card-body{grid-template-columns:1fr}.open{text-align:center}.pair{height:calc(100dvh - var(--bar))}.pair.active{display:block;position:relative}.pane{display:none;height:100%}.pane.mobile-active{display:flex}.mobile-side{display:flex}.compare-bar{bottom:max(9px,env(safe-area-inset-bottom));width:calc(100% - 16px);justify-content:space-between}.compare-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pane-head{height:74px}.pane-preview{padding:5px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><b>SiteOps Library</b><span>A–H live design collection</span></div>
    <div class="center-tools">
      <div class="group" role="group" aria-label="View mode"><button data-tab="library" aria-pressed="true">Library</button><button data-tab="pair" aria-pressed="false">Pair</button></div>
      <div class="group" id="layoutGroup" role="group" aria-label="Library columns"><button data-layout="1" aria-pressed="false">Full</button><button data-layout="2" aria-pressed="false">2</button><button data-layout="3" aria-pressed="true">3</button><button data-layout="4" aria-pressed="false">4</button></div>
      <div class="group mobile-side" role="group" aria-label="Visible pair pane"><button data-side="left" aria-pressed="true">Left</button><button data-side="right" aria-pressed="false">Right</button></div>
    </div>
    <div class="right-tools"><div class="group" role="group" aria-label="Preview viewport"><button data-view="mobile" aria-pressed="false">390</button><button data-view="desktop" aria-pressed="true">1280</button></div></div>
  </header>

  <main class="main" id="libraryMain"><section class="library layout-3 view-desktop" id="library"></section></main>
  <section class="pair" id="pair"><section class="pane mobile-active" id="leftPane"></section><section class="pane" id="rightPane"></section></section>
  <div class="compare-bar" id="compareBar"><span>Selected <b id="selectionText"></b></span><button id="compareNow">Compare</button></div>

  <script>
    const variants={A:{slug:'no-flow',name:'Baseline AI SaaS',type:'baseline'},B:{slug:'with-flow',name:'Editorial Dossier',type:'guided'},C:{slug:'flow-c',name:'Interactive Terminal App',type:'guided'},D:{slug:'flow-d',name:'Quiet Minimal Gallery',type:'guided'},E:{slug:'flow-e',name:'Interactive Spatial Topology',type:'guided'},F:{slug:'flow-f',name:'Horizontal Brutalist Poster',type:'guided'},G:{slug:'full-flow-g',name:'Operating Manual',type:'full flow'},H:{slug:'full-flow-h',name:'Spatial Control Surface',type:'full flow'}};
    const library=document.getElementById('library'),libraryMain=document.getElementById('libraryMain'),pair=document.getElementById('pair'),compareBar=document.getElementById('compareBar'),selectionText=document.getElementById('selectionText'),layoutGroup=document.getElementById('layoutGroup');
    const panes={left:document.getElementById('leftPane'),right:document.getElementById('rightPane')};
    let libraryView=matchMedia('(max-width:700px)').matches?'mobile':'desktop';let layout=matchMedia('(max-width:700px)').matches?1:3;let selected=[];let pairSelected={left:'G',right:'H'};let mobileSide='left';let syncOn=true,syncing=false;
    function source(key){return `./${variants[key].slug}/?library=1&v=12`}
    function spec(view){return view==='mobile'?{w:390,h:844}:{w:1280,h:900}}
    function hideDock(frame){try{const d=frame.contentDocument;if(!d||d.querySelector('[data-library-hide]'))return;const s=d.createElement('style');s.dataset.libraryHide='1';s.textContent='.experiment{display:none!important}';d.head.appendChild(s)}catch(e){}}
    function fitLibraryCard(card){const frame=card.querySelector('iframe'),preview=card.querySelector('.preview'),badge=card.querySelector('.viewport-badge');if(!frame||!preview)return;const s=spec(libraryView),scale=Math.min(preview.clientWidth/s.w,preview.clientHeight/s.h);frame.style.width=s.w+'px';frame.style.height=s.h+'px';frame.style.transform=`scale(${scale})`;badge.textContent=`${s.w}×${s.h}`;try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}
    function renderLibrary(){library.className=`library layout-${layout} view-${libraryView}`;library.innerHTML='';for(const [key,v] of Object.entries(variants)){const card=document.createElement('article');card.className='card'+(selected.includes(key)?' selected':'');card.dataset.letter=key;card.dataset.full=String(v.type==='full flow');card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-pressed',String(selected.includes(key)));card.setAttribute('aria-label',`${key} · ${v.name}. ${selected.includes(key)?'Selected for compare':'Click to select for compare'}`);card.innerHTML=`<div class="preview"><span class="badge">${key}</span><div class="preview-shell"><iframe title="${key} · ${v.name}" loading="eager" src="${source(key)}"></iframe></div><span class="viewport-badge"></span></div><div class="card-body"><div class="card-title"><b>${v.name}</b><span>${v.type}</span></div><a class="open" href="./${v.slug}/" target="_blank" rel="noopener">Open ↗</a></div>`;library.appendChild(card);const frame=card.querySelector('iframe');frame.addEventListener('load',()=>{hideDock(frame);fitLibraryCard(card);setTimeout(()=>fitLibraryCard(card),220)});card.addEventListener('click',e=>{if(e.target.closest('.open'))return;toggleSelect(key)});card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.open')){e.preventDefault();toggleSelect(key)}});card.querySelector('.open').addEventListener('click',e=>e.stopPropagation());requestAnimationFrame(()=>fitLibraryCard(card))}}
    function toggleSelect(key){if(selected.includes(key))selected=selected.filter(x=>x!==key);else{if(selected.length>=2)selected.shift();selected.push(key)}renderLibrary();updateCompareBar()}
    function updateCompareBar(){compareBar.classList.toggle('show',selected.length===2);selectionText.textContent=selected.join(' ↔ ')}
    function setLayout(n){layout=Number(n);library.className=`library layout-${layout} view-${libraryView}`;document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.layout)===layout)));requestAnimationFrame(()=>document.querySelectorAll('.card').forEach(fitLibraryCard))}
    function setTab(tab){const isLibrary=tab==='library';libraryMain.style.display=isLibrary?'block':'none';pair.classList.toggle('active',!isLibrary);layoutGroup.style.display=isLibrary?'flex':'none';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));if(!isLibrary){renderPair('left');renderPair('right');setMobileSide(mobileSide)}else{document.body.style.overflow='';requestAnimationFrame(()=>document.querySelectorAll('.card').forEach(fitLibraryCard))}}
    function pairRail(side){return Object.keys(variants).map(k=>`<button data-pair-pick="${k}" class="${pairSelected[side]===k?'on':''}">${k}</button>`).join('')}
    function scrollRatio(frame){try{const w=frame.contentWindow,d=frame.contentDocument.documentElement,max=Math.max(0,d.scrollHeight-w.innerHeight);return max?Math.max(0,Math.min(1,w.scrollY/max)):0}catch(e){return 0}}
    function applyRatio(frame,r){try{const w=frame.contentWindow,d=frame.contentDocument.documentElement,max=Math.max(0,d.scrollHeight-w.innerHeight);w.scrollTo(0,max*r)}catch(e){}}
    function bindSync(side,frame){try{frame.contentWindow.addEventListener('scroll',()=>{if(!syncOn||syncing)return;const other=panes[side==='left'?'right':'left'].querySelector('iframe');if(!other)return;syncing=true;applyRatio(other,scrollRatio(frame));requestAnimationFrame(()=>syncing=false)},{passive:true})}catch(e){}}
    function fitPane(side){const pane=panes[side],area=pane.querySelector('.pane-preview'),vp=pane.querySelector('.viewport'),frame=pane.querySelector('iframe');if(!area||!vp||!frame)return;const s=spec(libraryView),aw=Math.max(220,area.clientWidth-8),ah=Math.max(300,area.clientHeight-8),scale=Math.min(1,aw/s.w,ah/s.h);frame.style.width=s.w+'px';frame.style.height=s.h+'px';frame.style.transform=`scale(${scale})`;vp.style.width=Math.round(s.w*scale)+'px';vp.style.height=Math.round(s.h*scale)+'px';pane.querySelector('.size').textContent=`${s.w}×${s.h} · ${Math.round(scale*100)}%`;try{frame.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}
    function renderPair(side,preserve=0){const key=pairSelected[side],v=variants[key],pane=panes[side];pane.innerHTML=`<header class="pane-head"><div class="pane-top"><span class="side">${side}</span><div class="current">${key} · ${v.name}</div><a href="./${v.slug}/" target="_blank" rel="noopener">OPEN ↗</a></div><div class="rail">${pairRail(side)}</div></header><div class="pane-preview"><div class="viewport"><iframe title="${key} · ${v.name}" src="${source(key)}"></iframe><span class="size"></span></div></div>`;pane.querySelectorAll('[data-pair-pick]').forEach(b=>b.onclick=()=>{const old=pane.querySelector('iframe'),r=old?scrollRatio(old):0;pairSelected[side]=b.dataset.pairPick;renderPair(side,r)});const frame=pane.querySelector('iframe');frame.addEventListener('load',()=>{hideDock(frame);fitPane(side);applyRatio(frame,preserve);bindSync(side,frame);setTimeout(()=>{fitPane(side);applyRatio(frame,preserve)},220)});requestAnimationFrame(()=>fitPane(side))}
    function setMobileSide(side){mobileSide=side;panes.left.classList.toggle('mobile-active',side==='left');panes.right.classList.toggle('mobile-active',side==='right');document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.side===side)));requestAnimationFrame(()=>fitPane(side))}
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(b.dataset.layout));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{libraryView=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.view===libraryView)));renderLibrary();if(pair.classList.contains('active')){renderPair('left');renderPair('right')}});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>setMobileSide(b.dataset.side));document.getElementById('compareNow').onclick=()=>{if(selected.length!==2)return;pairSelected={left:selected[0],right:selected[1]};compareBar.classList.remove('show');setTab('pair')};
    addEventListener('resize',()=>{clearTimeout(window.__fit);window.__fit=setTimeout(()=>{document.querySelectorAll('.card').forEach(fitLibraryCard);if(pair.classList.contains('active')){fitPane('left');fitPane('right')}},100)},{passive:true});
    setLayout(layout);document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.view===libraryView)));renderLibrary();updateCompareBar();
  </script>
</body>
</html>
