<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171713"><meta name="description" content="Reference-first A-H SiteOps design library with vertical density controls and pair comparison."><title>SiteOps AI — Reference-First Design Library</title><style>:root{--bg:#ecece6;--ink:#171713;--paper:#f8f7f2;--line:#c9cac3;--muted:#77786f;--acid:#d9ff56;--bar:62px;--cols:3}*{box-sizing:border-box}html{background:var(--bg)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,a{font:inherit}.top{position:sticky;top:0;z-index:1000;min-height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 14px;background:rgba(23,23,19,.97);color:#f5f4ee;border-bottom:1px solid #34342f;backdrop-filter:blur(16px)}.brand{min-width:0}.brand b{display:block;font-size:13px}.brand span{display:block;color:#96978f;font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools,.right{display:flex;align-items:center;gap:6px}.tools{justify-content:center}.right{justify-self:end}.group{display:flex;gap:3px;padding:3px;border:1px solid #474840;border-radius:9px;background:#0f100d;overflow:auto;scrollbar-width:none}.group::-webkit-scrollbar{display:none}.group button{appearance:none;border:0;background:transparent;color:#a1a29a;border-radius:6px;padding:7px 10px;font-size:10px;font-weight:850;cursor:pointer;white-space:nowrap}.group button[aria-pressed="true"]{background:var(--acid);color:#111}.main{padding:16px 16px 88px}.library{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;max-width:1800px;margin:auto;align-items:start}.library.layout-1{--cols:1;max-width:1320px}.library.layout-2{--cols:2}.library.layout-3{--cols:3}.library.layout-4{--cols:4}.card{min-width:0;background:var(--paper);border:1px solid pan{font-size:10px;color:#b7b8b0}.comparebar b{color:white}.comparebar button{border:0;background:var(--acid);color:#111;border-radius:8px;padding:9px 11px;font-size:10px;font-weight:950}.pair{display:none;height:calc(100dvh - var(--bar));background:#aaaBA4;overflow:hidden}.pair.active{display:grid;grid-template-columns:1fr 1fr;gap:1px}.pane{min-width:0;height:100%;display:flex;flex-direction:column;background:#d3d3cd}.pane-head{height:76px;flex:none;background:#f5f4ee;border-bottom:1px solid var(--line);padding:8px 10px}.pane-top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.pane-top small{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.1em}.pane-top b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pane-top a{font-size:9px;font-weight:900;text-decoration:none;border-bottom:1px solid;color:var(--ink)}.rail{display:flex;gap:4px;overflow:auto;margin-top:7px;scrollbar-width:none}.rail button{flex:0 0 28px;height:28px;border:1px solid #c5c6bf;background:#ecebe5;border-radius:7px;font-size:9px;font-weight:950;color:#66675f}.rail button.on{background:#171713;color:#fff;border-color:#171713}.pane-preview{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;padding:7px;background:#c8c9c2}.viewport{position:relative;background:#fff;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.14)}.viewport iframe{display:block;border:0;background:#fff;transform-origin:0 0}.size{position:absolute;right:6px;bottom:6px;z-index:4;background:rgba(17,17,15,.82);color:#dddcd6;padding:4px 5px;border-radius:5px;font-size:8px}.mobile-side{display:none}@media(max-width:900px){.top{grid-template-columns:1fr auto}.brand span,.right{display:none}.tools{justify-self:end}.main{padding:10px 10px 84px}}@media(max-width:700px){:root{--bar:98px}.top{grid-template-columns:1fr;align-items:stretch;padding:7px 8px;gap:6px}.brand{display:none}.tools{justify-self:stretch;justify-content:space-between}.tools>.group:first-child{flex:1}.tools>.group:first-child button{flex:1}.main{padding:8px 8px 84px}.library{gap:8px}.card-body{grid-template-columns:1fr}.open{text-align:center}.pair.active{display:block}.pane{display:none;height:100%}.pane.mobile-active{display:flex}.mobile-side{display:flex}.comparebar{width:calc(100% - 16px);justify-content:space-between}.comparebar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header class="top"><div class="brand"><b>SiteOps Reference Library</b><span>8 different media · same locked product truth</span></div><div class="tools"><div class="group"><button data-tab="library" aria-pressed="true">Library</button><button data-tab="pair" aria-pressed="false">Pair</button></div><div class="group" id="layouts"><button data-layout="1">Full</button><button data-layout="2">2</button><button data-layout="3" aria-pressed="true">3</button><button data-layout="4">4</button></div><div class="group mobile-side"><button data-side="left" aria-pressed="true">Left</button><button data-side="right" aria-pressed="false">Right</button></div></div><div class="right"><div class="group"><button data-view="mobile">390</button><button data-view="desktop" aria-pressed="true">1280</button></div></div></header><main class="main" id="libraryMain"><section class="library layout-3 desktop" id="library"></section></main><section class="pair" id="pair"><section class="pane mobile-active" id="left"></section><section class="pane" id="right"></section></section><div class="comparebar" id="comparebar"><span>Selected <b id="selectedText"></b></span><button id="compare">Compare</button></div><script>const variants={A:{slug:'no-flow',name:'Commercial SaaS Control',type:'commercial / familiar / conversion-first'},B:{slug:'with-flow',name:'Brutalist Architecture Journal',type:'editorial brutalism / strict grid / giant type'},C:{slug:'flow-c',name:'Immersive 3D Archive',type:'fullscreen scenes / 3D field / sparse navigation'},D:{slug:'flow-d',name:'Analog Field Notebook',type:'paper / tape / checklist / anti-digital UI'},E:{slug:'flow-e',name:'Desktop OS Workspace',type:'windowed application / inspector / dock'},F:{slug:'flow-f',name:'Neo-Brutalist Sticker Lab',type:'playful / stickers / thick borders / loud color'},G:{slug:'full-flow-g',name:'Swiss Technical Spec',type:'12-column discipline / monochrome / specification'},H:{slug:'full-flow-h',name:'Spatial Network Canvas',type:'pannable map / node graph / canvas navigation'}};const lib=document.getElementById('library'),main=document.getElementById('libraryMain'),pair=document.getElementById('pair'),bar=document.getElementById('comparebar'),selectedText=document.getElementById('selectedText'),layouts=document.getElementById('layouts'),panes={left:document.getElementById('left'),right:document.getElementById('right')};let view=matchMedia('(max-width:700px)').matches?'mobile':'desktop',layout=matchMedia('(max-width:700px)').matches?1:3,selected=[],pairSel={left:'G',right:'H'},mobileSide='left',sync=true,locking=false;function spec(){return view==='mobile'?{w:390,h:844}:{w:1280,h:900}}function src(k){return`./${variants[k].slug}/?library=1&v=13`}function hideDock(f){try{const d=f.contentDocument;if(!d||d.querySelector('[data-lib]'))return;const s=d.createElement('style');s.dataset.lib='1';s.textContent='.experiment{display:none!important}';d.head.appendChild(s)}catch(e){}}function fitPreview(card){const f=card.querySelector('iframe'),p=card.querySelector('.preview'),s=spec();if(!f||!p)return;const z=Math.min(p.clientWidth/s.w,p.clientHeight/s.h);f.style.width=s.w+'px';f.style.height=s.h+'px';f.style.transform=`scale(${z})`;card.querySelector('.viewport-badge').textContent=`${s.w}×${s.h}`;try{f.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}function renderLibrary(){lib.className=`library layout-${layout} ${view}`;lib.innerHTML='';Object.entries(variants).forEach(([k,v])=>{const c=document.createElement('article');c.className='card'+(selected.includes(k)?' selected':'');c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-pressed',String(selected.includes(k)));c.innerHTML=`<div class="preview"><span class="badge">${k}</span><iframe title="${k} · ${v.name}" loading="eager" src="${src(k)}"></iframe><span class="viewport-badge"></span></div><div class="card-body"><div class="title"><b>${v.name}</b><span>${v.type}</span></div><a class="open" href="./${v.slug}/" target="_blank" rel="noopener">Open ↗</a></div>`;lib.appendChild(c);const f=c.querySelector('iframe');f.onload=()=>{hideDock(f);fitPreview(c);setTimeout(()=>fitPreview(c),250)};c.onclick=e=>{if(e.target.closest('.open'))return;toggle(k)};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(k)}};requestAnimationFrame(()=>fitPreview(c))})}function toggle(k){if(selected.includes(k))selected=selected.filter(x=>x!==k);else{if(selected.length===2)selected.shift();selected.push(k)}renderLibrary();bar.classList.toggle('show',selected.length===2);selectedText.textContent=selected.join(' ↔ ')}function setLayout(n){layout=+n;document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layout===layout)));renderLibrary()}function ratio(f){try{const w=f.contentWindow,d=f.contentDocument.documentElement,m=Math.max(0,d.scrollHeight-w.innerHeight);return m?w.scrollY/m:0}catch(e){return 0}}function apply(f,r){try{const w=f.contentWindow,d=f.contentDocument.documentElement,m=Math.max(0,d.scrollHeight-w.innerHeight);w.scrollTo(0,m*r)}catch(e){}}function bind(side,f){try{f.contentWindow.addEventListener('scroll',()=>{if(!sync||locking)return;const other=panes[side==='left'?'right':'left'].querySelector('iframe');if(!other)return;locking=true;apply(other,ratio(f));requestAnimationFrame(()=>locking=false)},{passive:true})}catch(e){}}function fitPane(side){const p=panes[side],area=p.querySelector('.pane-preview'),vp=p.querySelector('.viewport'),f=p.querySelector('iframe'),s=spec();if(!area||!f)return;const z=Math.min(1,(area.clientWidth-8)/s.w,(area.clientHeight-8)/s.h);f.style.width=s.w+'px';f.style.height=s.h+'px';f.style.transform=`scale(${z})`;vp.style.width=Math.round(s.w*z)+'px';vp.style.height=Math.round(s.h*z)+'px';p.querySelector('.size').textContent=`${s.w}×${s.h} · ${Math.round(z*100)}%`;try{f.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}function rail(side){return Object.keys(variants).map(k=>`<button data-pick="${k}" class="${pairSel[side]===k?'on':''}">${k}</button>`).join('')}function renderPane(side){const k=pairSel[side],v=variants[k],p=panes[side];p.innerHTML=`<header class="pane-head"><div class="pane-top"><small>${side}</small><b>${k} · ${v.name}</b><a href="./${v.slug}/" target="_blank">OPEN ↗</a></div><div class="rail">${rail(side)}</div></header><div class="pane-preview"><div class="viewport"><iframe title="${k} · ${v.name}" src="${src(k)}"></iframe><span class="size"></span></div></div>`;p.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{pairSel[side]=b.dataset.pick;renderPane(side)});const f=p.querySelector('iframe');f.onload=()=>{hideDock(f);fitPane(side);bind(side,f);setTimeout(()=>fitPane(side),250)};requestAnimationFrame(()=>fitPane(side))}function setTab(t){const library=t==='library';main.style.display=library?'block':'none';pair.classList.toggle('active',!library);layouts.style.display=library?'flex':'none';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));if(!library){renderPane('left');renderPane('right');setSide(mobileSide)}}function setSide(s){mobileSide=s;panes.left.classList.toggle('mobile-active',s==='left');panes.right.classList.toggle('mobile-active',s==='right');document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.side===s)));requestAnimationFrame(()=>fitPane(s))}document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(b.dataset.layout));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>setSide(b.dataset.side));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.view===view)));renderLibrary();if(pair.classList.contains('active')){renderPane('left');renderPane('right')}});document.getElementById('compare').onclick=()=>{if(selected.length!==2)return;pairSel={left:selected[0],right:selected[1]};bar.classList.remove('show');setTab('pair')};addEventListener('resize',()=>{clearTimeout(window.__r);window.__r=setTimeout(()=>{document.querySelectorAll('.card').forEach(fitPreview);fitPane('left');fitPane('right')},120)},{passive:true});document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.layout===layout)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));renderLibrary();</script></body></html>
