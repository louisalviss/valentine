<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
function createCastle(THREE, RoundedBoxGeometry) {
  const root = new THREE.Group();
  root.name = 'ModularFantasyCastle';

  const mats = {
    stone: new THREE.MeshPhysicalMaterial({ color: 0x6e7782, roughness: 0.78, metalness: 0.02, clearcoat: 0.05 }),
    stoneDark: new THREE.MeshPhysicalMaterial({ color: 0x39414b, roughness: 0.88, metalness: 0.01 }),
    roof: new THREE.MeshPhysicalMaterial({ color: 0x243c65, roughness: 0.42, metalness: 0.28, clearcoat: 0.45 }),
    gold: new THREE.MeshPhysicalMaterial({ color: 0xd7a74a, roughness: 0.25, metalness: 0.92, clearcoat: 0.55 }),
    wood: new THREE.MeshPhysicalMaterial({ color: 0x56351f, roughness: 0.8, metalness: 0.02 }),
    magic: new THREE.MeshPhysicalMaterial({ color: 0x7ce7ff, emissive: 0x1b8cae, emissiveIntensity: 1.7, roughness: 0.1, metalness: 0.05, transmission: 0.18, thickness: 0.4, clearcoat: 1 }),
    magic2: new THREE.MeshBasicMaterial({ color: 0xa3f0ff, transparent: true, opacity: 0.7 }),
    banner: new THREE.MeshStandardMaterial({ color: 0x8f2f46, roughness: 0.62, metalness: 0.04, side: THREE.DoubleSide }),
  };

  const parts = [];
  const floaters = [];
  const battlements = [];

  function shadow(mesh) {
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }
  function addPart(obj, home, explode, delay = 0) {
    obj.position.copy(home).add(explode);
    root.add(obj);
    parts.push({ obj, home: home.clone(), explode: explode.clone(), delay });
    return obj;
  }

  const base = shadow(new THREE.Mesh(new THREE.CylinderGeometry(3.35, 3.8, 0.72, 8), mats.stoneDark));
  addPart(base, new THREE.Vector3(0,-0.55,0), new THREE.Vector3(0,-2.8,0), 0);

  const courtyard = shadow(new THREE.Mesh(new THREE.CylinderGeometry(2.8, 3.05, 0.42, 8), mats.stone));
  addPart(courtyard, new THREE.Vector3(0,-0.12,0), new THREE.Vector3(0,-2.2,0), 0.03);

  const keep = shadow(new THREE.Mesh(new RoundedBoxGeometry(2.1, 2.45, 1.8, 5, 0.11), mats.stone));
  addPart(keep, new THREE.Vector3(0,1.18,0), new THREE.Vector3(0,5.6,-1.8), 0.12);

  const keepRoof = shadow(new THREE.Mesh(new THREE.ConeGeometry(1.42,1.35,4), mats.roof));
  keepRoof.rotation.y = Math.PI/4;
  addPart(keepRoof, new THREE.Vector3(0,3.05,0), new THREE.Vector3(0,6.8,-2.5), 0.17);

  const crystal = shadow(new THREE.Mesh(new THREE.OctahedronGeometry(0.44,1), mats.magic));
  addPart(crystal, new THREE.Vector3(0,4.0,0), new THREE.Vector3(0,8.2,0), 0.27);

  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.78,0.028,8,64), mats.magic2);
  ring1.rotation.x = Math.PI/2.4;
  addPart(ring1, new THREE.Vector3(0,4.0,0), new THREE.Vector3(-5,7,0), 0.32);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.58,0.02,8,64), mats.magic2);
  ring2.rotation.x = Math.PI/2;
  ring2.rotation.z = Math.PI/4;
  addPart(ring2, new THREE.Vector3(0,4.0,0), new THREE.Vector3(5,7,0), 0.34);

  const towerHomes = [
    [-2.25,0.75,-2.0], [2.25,0.75,-2.0], [-2.25,0.75,2.0], [2.25,0.75,2.0]
  ];
  const towerGroups = [];
  towerHomes.forEach(([x,y,z], i) => {
    const g = new THREE.Group();
    const body = shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.82,2.45,8), mats.stone));
    body.position.y = 0;
    g.add(body);
    const collar = shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.86,0.86,0.18,8), mats.gold));
    collar.position.y = 1.02;
    g.add(collar);
    const roof = shadow(new THREE.Mesh(new THREE.ConeGeometry(0.98,1.35,8), mats.roof));
    roof.position.y = 1.84;
    g.add(roof);
    const spire = shadow(new THREE.Mesh(new THREE.ConeGeometry(0.08,0.7,8), mats.gold));
    spire.position.y = 2.75;
    g.add(spire);

    for (let b=0;b<8;b++) {
      const merlon = shadow(new THREE.Mesh(new RoundedBoxGeometry(0.2,0.28,0.18,2,0.025), mats.stoneDark));
      const a = b/8*Math.PI*2;
      merlon.position.set(Math.cos(a)*0.69,1.24,Math.sin(a)*0.69);
      merlon.rotation.y = -a;
      g.add(merlon);
      battlements.push(merlon);
    }

    const ex = new THREE.Vector3((i%2?1:-1)*5.8, 3.8 + i*0.6, (i<2?-1:1)*5.5);
    addPart(g, new THREE.Vector3(x,y,z), ex, 0.08 + i*0.035);
    towerGroups.push(g);
  });

  // perimeter walls
  const wallSpecs = [
    [0,0.47,-2.55,3.4,1.15,0.36,0],
    [0,0.47, 2.55,3.4,1.15,0.36,0],
    [-2.75,0.47,0,3.6,1.15,0.36,Math.PI/2],
    [ 2.75,0.47,0,3.6,1.15,0.36,Math.PI/2],
  ];
  wallSpecs.forEach((s,i)=>{
    const [x,y,zw,h,d,ry]=s;
    const g=new THREE.Group();
    const wall=shadow(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,0.045),mats.stone));
    g.add(wall);
    for(let j=-2;j<=2;j++){
      const merlon=shadow(new THREE.Mesh(new RoundedBoxGeometry(0.38,0.33,0.42,2,0.03),mats.stoneDark));
      merlon.position.set((w/5)*l,0.7,0);
      g.add(merlon);
    }
    g.rotation.y=ry;
    const ex = new THREE.Vector3((i===2?-6:i===3?6:0), 2.7+i*0.3, (i===0?-6:i===1?6:0));
    addPart(g,new THREE.Vector3(x,y,z),ex,0.04+i*0.025);
  });

  // front gate and drawbridge
  const gateGroup = new THREE.Group();
  const gateFrame = shadow(new THREE.Mesh(new RoundedBoxGeometry(1.25,1.45,0.5,4,0.06),mats.stoneDark));
  gateGroup.add(gateFrame);
  const gate = shadow(new THREE.Mesh(new RoundedBoxGeometry(0.78,1.1,0.14,3,0.025),mats.gold));
  gate.position.z=0.30;
  gateGroup.add(gate);
  addPart(gateGroup,new THREE.Vector3(0,0.36,2.67),new THREE.Vector3(0,4.2,7),0.16);

  const bridgePivot = new THREE.Group();
  bridgePivot.position.set(0,-0.08,2.85);
  const bridge = shadow(new THREE.Mesh(new RoundedBoxGeometry(1.4,0.16,2.0,3,0.05),mats.wood));
  bridge.position.z=0.9;
  bridgePivot.add(bridge);
  root.add(bridgePivot);

  // four floating rune stones around keep
  for (let i=0;i<8;i++) {
    const rock = shadow(new THREE.Mesh(new THREE.DodecahedronGeometry(0.18+0.06*(i%3),0), i%2?mats.stone:mats.stoneDark));
    const a=i/8*Math.PI*2;
    rock.position.set(Math.cos(a)*1.7,3.5+(i%3)*0.35,Math.sin(a)*1.7);
    root.add(rock);
    floaters.push({rock,a,r:1.7+(i%2)*0.25,h:rock.position.y,s:0.5+0.12*i});
  }

  // banners
  [-0.72,0.72].forEach((x)=>{
    const banner = new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.9,1,4),mats.banner);
    banner.position.set(x,1.7,0.93);
    root.add(banner);
  });

  const state = { progress:0, elapsed:0, battle:0 };

  function ease(t){ return t*t*(3-2*t); }
  function clamp01(v){ return Math.max(0,Math.min(1,v)); }

  function setProgress(p){
    state.progress = clamp01(p);
    parts.forEach(({obj,home,explode,delay})=>{
      const local = ease(clamp01((state.progress-delay)/(0.44-delay)));
      obj.position.lerpVectors(home.clone().add(explode),home,local);
      obj.scale.setScalar(0.72+0.28*local);
    });

    const gatePhase = ease(clamp01((p-0.33)/0.18));
    gate.position.y = gatePhase*0.78;
    bridgePivot.rotation.x = -gatePhase*1.05;

    const battle = ease(clamp01((p-0.72)/0.24));
    state.battle = battle;
    towerGroups.forEach((g,i)=>{
      const sx = i%2?1:-1;
      const sz = i<2?-1:1;
      g.position.x += sx * battle * 0.75;
      g.position.z += sz * battle * 0.55;
      g.rotation.y = sx*sz*battle*0.28;
    });
    keep.scale.y = 1 + battle*0.22;
    keepRoof.position.y = 3.05 + battle*0.55;
    crystal.scale.setScalar(1 + battle*0.45);
  }

  function animate(dt,elapsed){
    state.elapsed=elapsed;
    crystal.rotation.y += dt*1.2;
    crystal.rotation.x += dt*0.35;
    ring1.rotation.z += dt*0.55;
    ring2.rotation.y -= dt*0.8;
    mats.magic.emissiveIntensity = 1.5 + Math.sin(elapsed*3.2)*0.45 + state.battle*0.7;
    floaters.forEach((f,i)=>{
      const a=f.a+elapsed*f.s*0.25;
      f.rock.position.x=Math.cos(a)*f.r;
      f.rock.position.z=Math.sin(a)*f.r;
      f.rock.position.y=f.h+Math.sin(elapsed*f.s+i)*0.18;
      f.rock.rotation.x+=dt*(0.4+i*0.03);
      f.rock.rotation.y+=dt*(0.6+i*0.02);
    });
    root.position.y = Math.sin(elapsed*0.8)*0.025;
  }

  setProgress(0);
  root.userData.setProgress=setProgress;
  root.userData.animate=animate;
  root.userData.materials=mats;
  return root;
}


const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.querySelector('.stage').prepend(renderer.domElement);
renderer.domElement.style.position='absolute';renderer.domElement.style.inset='0';renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b13);
scene.fog=new THREE.FogExp2(0x070b13,0.032);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(8.4,6.0,9.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,1.1,0);controls.minDistance=6;controls.maxDistance=16;controls.maxPolarAngle=Math.PI*.49;

scene.add(new THREE.HemisphereLight(0xbcdcff,0x161006,1.8));
const key=new THREE.DirectionalLight(0xffeed2,3.4);key.position.set(7,11,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=9;key.shadow.camera.bottom=-9;scene.add(key);
const rim=new THREE.DirectionalLight(0x6aa8ff,2.0);rim.position.set(-8,5,-7);scene.add(rim);
const magicLight=new THREE.PointLight(0x6adfff,26,18,2);magicLight.position.set(0,4,0);scene.add(magicLight);

const platform=new THREE.Mesh(new THREE.CylinderGeometry(4.8,5.3,.55,64),new THREE.MeshStandardMaterial({color:0x111824,roughness:.94,metalness:.08}));platform.position.y=-1.22;platform.receiveShadow=true;platform.castShadow=true;scene.add(platform);
const floor=new THREE.Mesh(new THREE.CircleGeometry(14,96),new THREE.MeshStandardMaterial({color:0x070b13,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.52;floor.receiveShadow=true;scene.add(floor);

// star particles
const starGeo=new THREE.BufferGeometry();const count=500;const pos=new Float32Array(count*3);for(let i=0;i<count;i++){const r=8+Math.random()*18,a=Math.random()*Math.PI*2,h=-1+Math.random()*13;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=h;pos[i*3+2]=Math.sin(a)*r}starGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x8fb8ff,size:.035,transparent:true,opacity:.55})));

const castle=createCastle(THREE,RoundedBoxGeometry);castle.rotation.y=-.35;scene.add(castle);

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.52,.7,.72);composer.addPass(bloom);
