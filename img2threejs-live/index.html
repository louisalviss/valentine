<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Fantasy Castle — Compatibility Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#07101d;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif}body{min-height:420vh}.stage{position:sticky;top:0;height:100svh;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 40%,#172640 0,#07101d 70%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;z-index:10;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.card,.mode{background:rgba(5,10,20,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.title{font-weight:800;font-size:13px}.sub{font-size:11px;opacity:.68;margin-top:3px}.mode{font-size:11px;font-weight:800;color:#8eeaff}.label{position:absolute;z-index:10;left:16px;bottom:62px;max-width:min(82vw,380px);pointer-events:none}.label h2{margin:0 0 5px;font-size:22px}.label p{margin:0;font-size:12px;line-height:1.45;opacity:.72}.progress{position:absolute;z-index:10;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#76e8ff,#f0c363)}.error{display:none;position:absolute;z-index:20;inset:20% 10%;padding:18px;border-radius:14px;background:#2a0d15;border:1px solid #ff7c9b;color:#ffe9ee;font-size:13px;line-height:1.5}.hint{position:absolute;z-index:10;right:16px;bottom:58px;font-size:10px;opacity:.5}@media(max-width:600px){.mode{display:none}.label h2{font-size:20px}.hint{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hud"><div class="card"><div class="title">MODULAR FANTASY CASTLE</div><div class="sub">Scroll to assemble → awaken → battle mode</div></div><div class="mode" id="mode">ASSEMBLE</div></div>
  <div class="label" id="label"><h2>Pieces in the void</h2><p>Scroll down. Towers and walls fly together into a fortress.</p></div>
  <div class="hint">Drag to orbit · pinch to zoom</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="error" id="error"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const err=document.getElementById('error');
  function fail(msg){err.style.display='block';err.textContent='3D load error: '+msg;}
  if(!window.THREE){fail('Three.js CDN did not load. Try opening in Safari.');return;}
  try{
    const T=THREE, stage=document.getElementById('stage');
    const renderer=new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;stage.insertBefore(renderer.domElement,stage.firstChild);
    const scene=new T.Scene();scene.background=new T.Color(0x07101d);scene.fog=new T.Fog(0x07101d,14,34);
    const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);let yaw=.72,pitch=.45,dist=13;const target=new T.Vector3(0,1,0);
    function cameraUpdate(){const cp=Math.cos(pitch);camera.position.set(target.x+dist*Math.sin(yaw)*cp,target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*cp);camera.lookAt(target)}cameraUpdate();
    scene.add(new T.HemisphereLight(0xb8dcff,0x171009,1.7));const key=new T.DirectionalLight(0xffefd3,2.4);key.position.set(7,11,6);key.castShadow=true;key.shadow.mapSize.width=1024;key.shadow.mapSize.height=1024;scene.add(key);const rim=new T.DirectionalLight(0x6e9fff,1.2);rim.position.set(-7,5,-7);scene.add(rim);const glow=new T.PointLight(0x55dfff,2.0,18);glow.position.set(0,4,0);scene.add(glow);
    const stone=new T.MeshStandardMaterial({color:0x707985,roughness:.82,metalness:.02}),dark=new T.MeshStandardMaterial({color:0x353d48,roughness:.92}),roof=new T.MeshStandardMaterial({color:0x263f69,roughness:.45,metalness:.25}),gold=new T.MeshStandardMaterial({color:0xd9aa4b,roughness:.3,metalness:.8}),wood=new T.MeshStandardMaterial({color:0x57351f,roughness:.8}),magic=new T.MeshStandardMaterial({color:0x70e8ff,emissive:0x198fac,emissiveIntensity:1.5,roughness:.18});
    const root=new T.Group();root.rotation.y=-.35;scene.add(root);const parts=[];
    function mesh(g,m){const x=new T.Mesh(g,m);x.castShadow=true;x.receiveShadow=true;return x}
    function add(obj,home,off,delay){obj.position.copy(home).add(off);root.add(obj);parts.push({obj,home,off,delay:delay||0});return obj}
    add(mesh(new T.CylinderGeometry(3.5,4,.75,8),dark),new T.Vector3(0,-.55,0),new T.Vector3(0,-3,0),0);
    add(mesh(new T.CylinderGeometry(2.9,3.2,.42,8),stone),new T.Vector3(0,-.12,0),new T.Vector3(0,-2.4,0),.02);
    const keep=add(mesh(new T.BoxGeometry(2.2,2.5,1.9),stone),new T.Vector3(0,1.2,0),new T.Vector3(0,6,-2),.14);
    const keepRoof=mesh(new T.ConeGeometry(1.5,1.5,4),roof);keepRoof.rotation.y=Math.PI/4;add(keepRoof,new T.Vector3(0,3.2,0),new T.Vector3(0,7,-2.4),.18);
    const crystal=add(mesh(new T.OctahedronGeometry(.48,1),magic),new T.Vector3(0,4.3,0),new T.Vector3(0,8,0),.28);
    const towers=[];[[-2.3,.8,-2],[2.3,.8,-2],[-2.3,.8,2],[2.3,.8,2]].forEach((p,i)=>{const g=new T.Group();const body=mesh(new T.CylinderGeometry(.72,.84,2.5,8),stone);g.add(body);const collar=mesh(new T.CylinderGeometry(.9,.9,.18,8),gold);collar.position.y=1.02;g.add(collar);const r=mesh(new T.ConeGeometry(1,1.45,8),roof);r.position.y=1.9;g.add(r);const s=mesh(new T.ConeGeometry(.09,.75,8),gold);s.position.y=2.85;g.add(s);for(let k=0;k<8;k++){const b=mesh(new T.BoxGeometry(.2,.3,.2),dark),a=k/8*Math.PI*2;b.position.set(Math.cos(a)*.7,1.28,Math.sin(a)*.7);g.add(b)}const off=new T.Vector3((i%2?1:-1)*6,4+i*.5,(i<2?-1:1)*5.5);add(g,new T.Vector3(p[0],p[1],p[2]),off,.08+i*.035);towers.push(g)});
    [[0,.5,-2.6,3.5,0],[0,.5,2.6,3.5,0],[-2.8,.5,0,3.8,Math.PI/2],[2.8,.5,0,3.8,Math.PI/2]].forEach((s,i)=>{const g=new T.Group(),w=mesh(new T.BoxGeometry(s[3],1.15,.38),stone);g.add(w);for(let j=-2;j<=2;j++){const b=mesh(new T.BoxGeometry(.4,.35,.45),dark);b.position.set(j*s[3]/5,.74,0);g.add(b)}g.rotation.y=s[4];let off=new T.Vector3(i===2?-6:i===3?6:0,3+i*.3,i===0?-6:i===1?6:0);add(g,new T.Vector3(s[0],s[1],s[2]),off,.04+i*.025)});
    const gateG=new T.Group(),frame=mesh(new T.BoxGeometry(1.3,1.5,.5),dark),gate=mesh(new T.BoxGeometry(.8,1.12,.16),gold);gate.position.z=.31;gateG.add(frame,gate);add(gateG,new T.Vector3(0,.37,2.72),new T.Vector3(0,4,7),.17);
    const bridgePivot=new T.Group();bridgePivot.position.set(0,-.08,2.85);const bridge=mesh(new T.BoxGeometry(1.45,.17,2),wood);bridge.position.z=.9;bridgePivot.add(bridge);root.add(bridgePivot);
    const floaters=[];for(let i=0;i<8;i++){const r=mesh(new T.DodecahedronGeometry(.18+.04*(i%3),0),i%2?stone:dark),a=i/8*Math.PI*2;r.position.set(Math.cos(a)*1.8,3.4+(i%3)*.35,Math.sin(a)*1.8);root.add(r);floaters.push({r,a,h:r.position.y,rr:1.8+(i%2)*.22,s:.45+i*.07})}
    const platform=mesh(new T.CylinderGeometry(4.8,5.4,.55,48),new T.MeshStandardMaterial({color:0x111927,roughness:.95,metalness:.05}));platform.position.y=-1.25;scene.add(platform);const floor=mesh(new T.CircleGeometry(14,64),new T.MeshStandardMaterial({color:0x07101d,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.53;scene.add(floor);
    function clamp(v){return Math.max(0,Math.min(1,v))}function ease(t){return t*t*(3-2*t)}let battle=0;
    function setProgress(p){parts.forEach(x=>{const l=ease(clamp((p-x.delay)/(Math.max(.46-x.delay,.05))));x.obj.position.copy(x.home).addScaledVector(x.off,1-l);x.obj.scale.setScalar(.74+.26*l)});const gp=ease(clamp((p-.34)/.18));gate.position.y=gp*.78;bridgePivot.rotation.x=-gp*1.05;battle=ease(clamp((p-.72)/.24));towers.forEach((g,i)=>{const sx=i%2?1:-1,sz=i<2?-1:1;const base=[[-2.3,.8,-2],[2.3,.8,-2],[-2.3,.8,2],[2.3,.8,2]][i];g.position.x=base[0]+sx*battle*.8;g.position.z=base[2]+sz*battle*.6;g.rotation.y=sx*sz*battle*.28});keep.scale.y=1+battle*.2;crystal.scale.setScalar(1+battle*.5)}
    let targetP=0,p=.001,last=performance.now(),elapsed=0;const bar=document.getElementById('bar'),mode=document.getElementById('mode'),label=document.getElementById('label');const copy=[['ASSEMBLE','Pieces in the void','Scroll down. Towers and walls fly together into a fortress.'],['FORTIFY','Fortress locked','The walls align and the drawbridge opens.'],['AWAKEN','Arcane core online','The central crystal wakes and rune stones begin to orbit.'],['BATTLE MODE','Fortress transformation','Corner towers spread outward and the castle shifts into battle form.']];
    function scrollP(){const m=document.documentElement.scrollHeight-innerHeight;return m>0?scrollY/m:0}addEventListener('scroll',()=>targetP=scrollP(),{passive:true});
    function ui(v){const i=Math.min(3,Math.floor(v*4)),c=copy[i];mode.textContent=c[0];label.innerHTML='<h2>'+c[1]+'</h2><p>'+c[2]+'</p>';bar.style.width=(v*100).toFixed(1)+'%';glow.intensity=1.5+v*3}
    function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;p+=(targetP-p)*Math.min(1,dt*6);setProgress(p);crystal.rotation.y+=dt*1.2;crystal.rotation.x+=dt*.35;magic.emissiveIntensity=1.2+Math.sin(elapsed*3)*.45+battle*.8;floaters.forEach((f,i)=>{const a=f.a+elapsed*f.s*.25;f.r.position.set(Math.cos(a)*f.rr,f.h+Math.sin(elapsed*f.s+i)*.18,Math.sin(a)*f.rr);f.r.rotation.x+=dt*.5;f.r.rotation.y+=dt*.7});root.rotation.y+=dt*(.018+.025*p);ui(p);cameraUpdate();renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
    let drag=false,lx=0,ly=0,pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture&&renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.006;pitch=clamp((pitch-dy*.004+.2)/1.4)*1.4-.2;cameraUpdate()});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(18,dist+e.deltaY*.01));cameraUpdate()},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=Math.max(6,Math.min(18,dist+(pinch-d)*.015));pinch=d;cameraUpdate()}},{passive:true});renderer.domElement.addEventListener('touchend',()=>pinch=0,{passive:true});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  }catch(e){fail(e&&e.message?e.message:String(e));}
})();
</script>
</body></html>
