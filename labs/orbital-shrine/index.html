<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orbital Shrine V16</title>
<style>
:root{--p:0;--mx:0;--my:0;--gold:#c9a25f;--bg:#08090d;--ink:#f0e6d5}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:400vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
.scene{position:fixed;inset:0;overflow:hidden;background:#08090d}
.bg{position:absolute;inset:0;background:url('./concept-3.webp') center/cover no-repeat;filter:saturate(.92) brightness(.78) contrast(1.05);transform:translate3d(calc(var(--mx)*-8px),calc(var(--my)*-6px + var(--p)*-30px),0) scale(calc(1.06 + var(--p)*.05));will-change:transform}
.veil{position:absolute;inset:0;background:linear-gradient(90deg,#08090d 0 28%,rgba(8,9,13,.95) 39%,rgba(8,9,13,.18) 64%,rgba(8,9,13,.14) 84%,rgba(8,9,13,.78) 100%),linear-gradient(180deg,rgba(8,9,13,.25),transparent 18%,transparent 78%,rgba(8,9,13,.65));pointer-events:none}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(36% 14% at 66% 68%,rgba(233,219,191,.07),transparent 68%),radial-gradient(26% 12% at 62% 56%,rgba(217,202,180,.06),transparent 70%);filter:blur(30px);animation:fog 10s ease-in-out infinite alternate}
@keyframes fog{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
#gl{position:absolute;right:0;top:0;width:62vw;height:100%;z-index:2}
.beam{position:absolute;left:66.2%;top:8%;width:4px;height:64%;background:linear-gradient(180deg,transparent,rgba(255,230,182,.72) 18%,rgba(255,248,231,.98) 50%,rgba(255,209,124,.12));box-shadow:0 0 12px rgba(255,228,174,.65),0 0 42px rgba(255,197,104,.22);opacity:.9;animation:beam 2.6s ease-in-out infinite;z-index:2;pointer-events:none}@keyframes beam{0%,100%{opacity:.5}50%{opacity:1}}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none}
.nav{position:absolute;z-index:8;left:0;right:0;top:0;height:84px;display:grid;grid-template-columns:250px 1fr 190px;align-items:center;padding:0 5vw;border-bottom:1px solid rgba(218,188,133,.08)}
.brand{display:flex;align-items:center;gap:12px;font:400 12px/1 Georgia,serif;letter-spacing:.22em;text-transform:uppercase}.sigil{width:29px;height:29px;border:1px solid var(--gold);border-radius:50%;position:relative}.sigil:before,.sigil:after{content:"";position:absolute;background:var(--gold);opacity:.75}.sigil:before{width:1px;height:41px;left:13px;top:-7px}.sigil:after{height:1px;width:41px;left:-7px;top:13px}
.links{display:flex;justify-content:center;gap:clamp(16px,3vw,48px)}.links button,.index button{border:0;background:none;color:rgba(235,228,214,.48);font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.links button.active,.index button.active{color:var(--gold)}
.enter{justify-self:end;border:1px solid rgba(199,164,101,.42);border-radius:999px;background:rgba(8,9,12,.24);color:#eee7d9;padding:12px 17px;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.hero{position:absolute;z-index:7;left:6.2vw;top:18vh;width:min(47vw,720px);transform:translate3d(calc(var(--mx)*3px),calc(var(--my)*2px + var(--p)*-14px),0)}
.eyebrow{margin-bottom:18px;color:rgba(220,196,157,.52);font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.27em;text-transform:uppercase}.title{margin:0;font-family:"Iowan Old Style",Baskerville,Georgia,serif;font-size:clamp(68px,8.4vw,134px);font-weight:400;line-height:.78;letter-spacing:-.064em}.title span{display:block}.tag{margin-top:24px;color:var(--gold);font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.29em;text-transform:uppercase}.copy{margin-top:16px;max-width:430px;color:rgba(234,228,216,.62);font-size:14px;line-height:1.7}.actions{display:flex;gap:12px;margin-top:27px}.actions button{border-radius:999px;padding:13px 21px;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}.primary{border:1px solid #c19a5d;background:linear-gradient(#bc914f,#8e6a39);color:#0b0b0d}.secondary{border:1px solid rgba(221,203,171,.22);background:rgba(8,9,12,.22);color:#eae2d5}
.index{position:absolute;z-index:7;right:2.5vw;top:29vh;display:grid;gap:48px}.index button{display:flex;align-items:center;gap:10px}.index button:after{content:"";width:18px;height:1px;background:rgba(207,174,111,.22)}.index button.active:after{width:30px;background:var(--gold)}
.card{position:absolute;z-index:7;left:6.3vw;bottom:5.7vh;width:330px;display:grid;grid-template-columns:86px 1fr;gap:15px;align-items:center}.thumb{height:72px;background:url('./concept-3.webp') 74% 78%/cover no-repeat;border:1px solid rgba(218,192,145,.14)}.meta small{display:block;margin-bottom:6px;color:var(--gold);font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase}.meta strong{font:400 21px/1.05 Georgia,serif}.meta p{margin:6px 0 0;color:rgba(235,227,212,.44);font-size:11px;line-height:1.4}
.dock{position:absolute;z-index:7;left:50%;bottom:3.7vh;transform:translateX(-50%);width:min(44vw,620px);display:grid;grid-template-columns:115px 1fr 160px;align-items:center;gap:16px;color:rgba(232,223,206,.45);font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}.rail{height:1px;background:rgba(217,191,145,.15);position:relative}.rail i{position:absolute;left:0;top:-1px;height:3px;width:calc(var(--p)*100%);background:linear-gradient(90deg,#8c6a3d,#d1ad6c);box-shadow:0 0 14px rgba(210,174,108,.25)}
.scroll section{height:100vh}
@media(max-width:900px){.scene:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,9,12,.56),rgba(8,9,12,.1) 38%,rgba(8,9,12,.62) 100%),linear-gradient(90deg,rgba(8,9,12,.62),transparent 44%,transparent 78%,rgba(8,9,12,.28))}.bg{background-position:69% 50%;transform:translate3d(0,calc(var(--p)*-8px),0) scale(calc(1.07 + var(--p)*.03))}#gl{width:100vw;right:-10vw;opacity:.98}.beam{left:56%;top:8%;height:58%}.nav{height:70px;grid-template-columns:1fr auto;padding:0 18px}.brand{font-size:10px;letter-spacing:.18em}.links{display:none}.enter{font-size:8px;padding:10px 12px}.hero{left:18px;right:16px;top:13vh;width:auto;transform:translate3d(0,calc(var(--p)*-8px),0)}.eyebrow{font-size:8px;margin-bottom:11px}.title{font-size:clamp(56px,17vw,80px);line-height:.82}.tag{margin-top:17px;font-size:8px;letter-spacing:.21em}.copy{max-width:310px;font-size:12px;line-height:1.58}.actions{margin-top:19px;gap:8px}.actions button{font-size:8px;padding:11px 13px}.index{right:13px;top:36vh;gap:29px}.index button{font-size:8px}.index button:after{width:10px}.index button.active:after{width:17px}.card{left:18px;bottom:7.8vh;width:248px;grid-template-columns:66px 1fr;gap:11px}.thumb{height:56px}.meta strong{font-size:17px}.meta p{display:none}.dock{left:18px;right:18px;bottom:2.6vh;transform:none;width:auto;grid-template-columns:72px 1fr 100px;gap:7px;font-size:6px}}
</style></head>
<body>
<main class="scene">
<div class="bg"></div><div class="veil"></div><canvas id="gl"></canvas><div class="beam"></div><div class="fog"></div><canvas id="fx"></canvas>
<nav class="nav"><div class="brand"><span class="sigil"></span><span>Orbital Shrine</span></div><div class="links" id="links"></div><button class="enter" id="enter">Enter Orbit</button></nav>
<section class="hero"><div class="eyebrow" id="eye"></div><h1 class="title"><span>ORBITAL</span><span>SHRINE</span></h1><div class="tag" id="tag"></div><p class="copy" id="copy"></p><div class="actions"><button class="primary" id="explore">Explore Shrine</button><button class="secondary" id="signal">Activate Signal</button></div></section>
<div class="index" id="index"></div>
<div class="card"><div class="thumb"></div><div class="meta"><small id="small"></small><strong id="ct"></strong><p id="desc"></p></div></div>
<div class="dock"><span>Chapters <b id="pct">00%</b></span><div class="rail"><i></i></div><span id="next"></span></div>
</main>
<div class="scroll"><section id="c1"></section><section id="c2"></section><section id="c3"></section><section id="c4"></section></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const chapters=[['Chapters','Archive 01 · Ascension Protocol','A Sanctuary Beyond The Stars.','A monument suspended between dead worlds — built to preserve memory, ritual and the last human signal across the orbital dark.','Chapter I','The Ascent','Approach the shrine through the silent ring-field.','Next: The Shrine'],['The Shrine','Archive 02 · Inner Architecture','Built Around A Living Axis.','The central beam is both beacon and spine. Every chamber is aligned to it, turning the tower into a machine for memory and light.','Chapter II','The Shrine','Read the architecture as a vertical cosmology.','Next: The Keepers'],['Keepers','Archive 03 · Custodian Order','Those Who Stay When Worlds Move On.','The Keepers maintain the rings, decode transmissions, and guard the chambers that should never be opened.','Chapter III','The Keepers','Meet the custodians of the silent archive.','Next: The Last Signal'],['Lore','Archive 04 · Terminal Transmission','Every Orbit Ends In A Signal.','At the highest chamber, the shrine listens outward. What returns is older than its builders — and still repeating.','Chapter IV','The Last Signal','Follow the transmission beyond the mapped system.','Return: The Ascent']];
const ids=['eye','tag','copy','small','ct','desc','next']; const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)])); const links=document.getElementById('links'), index=document.getElementById('index');
chapters.forEach((c,i)=>{ const b=document.createElement('button'); b.textContent=c[0]; b.onclick=()=>document.getElementById('c'+(i+1)).scrollIntoView({behavior:'smooth'}); links.appendChild(b); const q=document.createElement('button'); q.textContent='0'+(i+1); q.onclick=b.onclick; index.appendChild(q); });
let tp=0,p=0,cur=-1,tx=0,ty=0,mx=0,my=0,signalPulse=0;
function setChapter(i){ if(i===cur) return; cur=i; [...links.children].forEach((e,n)=>e.classList.toggle('active',n===i)); [...index.children].forEach((e,n)=>e.classList.toggle('active',n===i)); const c=chapters[i]; ids.forEach((id,n)=>{ const el=els[id]; el.animate([{opacity:.2, transform:'translateY(7px)'},{opacity:1, transform:'none'}],{duration:360}); el.textContent=c[n+1]; }); }
function onScroll(){const max=document.documentElement.scrollHeight-innerHeight; tp=max?scrollY/max:0; setChapter(Math.min(3,Math.floor(tp*4)));} addEventListener('scroll',onScroll,{passive:true}); onScroll();
function pt(x,y){tx=(x/innerWidth-.5)*2; ty=(y/innerHeight-.5)*2;} addEventListener('pointermove',e=>pt(e.clientX,e.clientY),{passive:true}); addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) pt(t.clientX,t.clientY)},{passive:true});
(function uiLoop(){mx+=(tx-mx)*.06; my+=(ty-my)*.06; p+=(tp-p)*.06; document.documentElement.style.setProperty('--mx', mx.toFixed(3)); document.documentElement.style.setProperty('--my', my.toFixed(3)); document.documentElement.style.setProperty('--p', p.toFixed(4)); document.getElementById('pct').textContent=String(Math.round(p*100)).padStart(2,'0')+'%'; requestAnimationFrame(uiLoop); })();
const fx=document.getElementById('fx'), ctx=fx.getContext('2d'); let particles=[]; function resizeFX(){fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio; fx.style.width=innerWidth+'px'; fx.style.height=innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); particles=Array.from({length:innerWidth<900?20:44},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.18,vy:-(.15+Math.random()*.3),r:Math.random()*1.4+.35,a:Math.random()*.4+.08}));} addEventListener('resize',resizeFX); resizeFX(); (function drawFX(){ctx.clearRect(0,0,innerWidth,innerHeight); for(const o of particles){o.x+=o.vx+mx*.1; o.y+=o.vy-p*.7; if(o.y<-20){o.y=innerHeight+10;o.x=Math.random()*innerWidth;} if(o.x<-20) o.x=innerWidth+10; if(o.x>innerWidth+20) o.x=-10; ctx.beginPath(); ctx.fillStyle='rgba(238,211,160,'+(o.a*(.7+p*.3))+')'; ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();} requestAnimationFrame(drawFX);})();
const canvas=document.getElementById('gl'); const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.8)); const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(34,1,.1,100);
const root=new THREE.Group(); scene.add(root); const shrine=new THREE.Group(); root.add(shrine);
const matStone=new THREE.MeshPhysicalMaterial({color:0xddd4c3,metalness:.08,roughness:.55,clearcoat:.3,clearcoatRoughness:.35}); const matGold=new THREE.MeshPhysicalMaterial({color:0xd2ab68,metalness:.95,roughness:.22,clearcoat:.8,clearcoatRoughness:.18}); const matDark=new THREE.MeshPhysicalMaterial({color:0x161a24,metalness:.45,roughness:.58}); const matGlow=new THREE.MeshPhysicalMaterial({color:0xa7dbff,emissive:0x68ceff,emissiveIntensity:1.8,metalness:.8,roughness:.14,transparent:true,opacity:.92});
const modules=[]; function mod(mesh,basePos,baseRot=[0,0,0],offset=[0,0,0]){mesh.position.set(...basePos); mesh.rotation.set(...baseRot); mesh.userData.basePos=new THREE.Vector3(...basePos); mesh.userData.baseRot=new THREE.Euler(...baseRot); mesh.userData.offset=new THREE.Vector3(...offset); shrine.add(mesh); modules.push(mesh); return mesh;}
function box(w,h,d,mat,pos,rot,off){return mod(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),pos,rot,off)} function cyl(r1,r2,h,mat,pos,rot,off,s=16,open=false){return mod(new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s,1,open),mat),pos,rot,off)}
box(2.9,.18,2.9,matDark,[0,-3.25,0],[0,0,0],[0,0,0]); box(2.55,.17,2.55,matStone,[0,-2.98,0],[0,0,0],[0,0,0]); box(2.2,.14,2.2,matGold,[0,-2.72,0],[0,0,0],[0,0,0]);
const shellOffsets=[[-.9,0,0],[.9,0,0],[-.55,0,.48],[.55,0,-.48],[-.05,.15,0]];
box(.24,2.6,.24,matStone,[-1.02,-1.42,-1.02],[0,0,0],shellOffsets[0]); box(.24,2.6,.24,matStone,[1.02,-1.42,1.02],[0,0,0],shellOffsets[1]); box(.24,2.6,.24,matStone,[1.02,-1.42,-1.02],[0,0,0],shellOffsets[2]); box(.24,2.6,.24,matStone,[-1.02,-1.42,1.02],[0,0,0],shellOffsets[3]); box(1.72,2.95,1.72,matDark,[0,-1.08,0],[0,0,0],shellOffsets[4]);
box(1.38,2.6,1.38,matStone,[0,-.98,0],[0,0,0],[0,.35,0]); box(1.65,.14,1.65,matGold,[0,.82,0],[0,0,0],[0,.22,0]);
for(let i=0;i<8;i++){let a=i/8*Math.PI*2; box(.12,.95,.12,matGold,[Math.cos(a)*.62,1.42,Math.sin(a)*.62],[0,-a,0],[Math.cos(a)*.16,.2,Math.sin(a)*.16]);}
box(.62,.95,.62,matDark,[0,1.65,0],[0,0,0],[0,.34,0]); cyl(.23,.34,1.36,matGold,[0,2.52,0],[0,0,0],[0,.4,0],10,false);
const core=mod(new THREE.Mesh(new THREE.SphereGeometry(.23,22,22),matGlow),[0,3.45,0],[0,0,0],[0,.45,0]); const cap=mod(new THREE.Mesh(new THREE.OctahedronGeometry(.26,0),matGlow),[0,4.02,0],[0,Math.PI/4,0],[0,.48,0]);
const ring1=mod(new THREE.Mesh(new THREE.TorusGeometry(2.58,.038,12,100),matGold),[.08,.15,.08],[1.06,0,0],[0,0,0]); const ring2=mod(new THREE.Mesh(new THREE.TorusGeometry(1.8,.034,12,100),matStone),[0,.82,0],[0,.64,1.18],[0,0,0]); const ring3=mod(new THREE.Mesh(new THREE.TorusGeometry(3.22,.03,10,100),new THREE.MeshPhysicalMaterial({color:0xf2d3a0,metalness:.9,roughness:.22,transparent:true,opacity:.58})),[0,.35,0],[0,1.0,.52],[0,0,0]);
shrine.position.set(2.18,.88,0); scene.add(new THREE.HemisphereLight(0xbfc9ff,0x12141a,.9)); const key=new THREE.DirectionalLight(0xffe0af,2.2); key.position.set(4,7,9); scene.add(key); const rim=new THREE.DirectionalLight(0x87b5ff,1.7); rim.position.set(-6,4,-4); scene.add(rim); const pLight=new THREE.PointLight(0xffd38f,4.4,30,2); pLight.position.set(0,3.8,2.6); scene.add(pLight);
let tOrbX=0,tOrbY=0,orbX=0,orbY=0,drag=false,lastX=0,lastY=0; function resize3D(){const w=canvas.clientWidth||innerWidth*.6,h=canvas.clientHeight||innerHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);} addEventListener('resize',resize3D); resize3D();
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY}); addEventListener('pointerup',()=>drag=false); addEventListener('pointermove',e=>{if(!drag) return; tOrbY += (e.clientX-lastX)*.005; tOrbX += (e.clientY-lastY)*.003; lastX=e.clientX; lastY=e.clientY;});
const clock=new THREE.Clock(); function range(v,a,b){return Math.max(0, Math.min(1, (v-a)/(b-a)));} function smoother(x){return x*x*(3-2*x);} document.getElementById('signal').onclick=()=>signalPulse=1.5; document.getElementById('enter').onclick=()=>document.getElementById('c2').scrollIntoView({behavior:'smooth'}); document.getElementById('explore').onclick=()=>document.getElementById('c3').scrollIntoView({behavior:'smooth'});
(function render(){requestAnimationFrame(render); const t=clock.getElapsedTime(); const open1=smoother(range(p,.18,.45)); const hold=smoother(range(p,.45,.62)); const close=smoother(range(p,.72,.92)); const openAmt=(open1+hold*(1-close))*0.95; orbX += (tOrbX-orbX)*.05; orbY += (tOrbY-orbY)*.05; root.rotation.y = orbY + mx*.15 + Math.sin(t*.18)*.03; root.rotation.x = orbX + my*.07; modules.forEach((m,i)=>{const b=m.userData.basePos,o=m.userData.offset; let k=openAmt; if(i<3) k*=.15; m.position.copy(b).addScaledVector(o,k); if(m!==ring1&&m!==ring2&&m!==ring3&&m!==core&&m!==cap){m.rotation.y = m.userData.baseRot.y + (o.x*0.16+o.z*0.12)*k; m.rotation.z = m.userData.baseRot.z + (o.x*0.03)*k;}}); ring1.rotation.y += .012; ring2.rotation.x += .013; ring3.rotation.z -= .009; core.scale.setScalar(1+Math.sin(t*3.6)*.08+signalPulse*.18); cap.rotation.y += .02; matGlow.emissiveIntensity = 1.7 + Math.sin(t*2.1)*.22 + signalPulse*1.5; pLight.intensity = 4 + Math.sin(t*1.8)*.24 + signalPulse*2.5; signalPulse *= .93; shrine.position.x = 2.18 + Math.sin(p*Math.PI)*.14; shrine.position.y = .88 + p*.22; camera.position.set(0,2.85 + p*.55,11.8 - p*1.6); camera.lookAt(1.35,.45+p*.28,0); renderer.render(scene,camera);})();
</script></body></html>
