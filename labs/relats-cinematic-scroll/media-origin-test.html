<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare media origin test</title><style>body{margin:0;background:#10151d;color:white;font:16px system-ui}main{max-width:800px;margin:auto;padding:24px}video,img{display:block;width:100%;height:auto}input{width:100%}small{color:#b5bdc7}</style><main><h1>Static media origin</h1><p>GitHub Pages HTML. Original synthetic test assets hosted on Cloudflare Pages.</p><video id="v" muted playsinline preload="auto" poster="https://valentine-site-media.pages.dev/canary/poster.svg" src="https://valentine-site-media.pages.dev/canary/scrub.mp4"></video><label>Scrub video <input id="seek" type="range" min="0" max="100" value="0"></label><p id="status" aria-live="polite">Loading…</p><small>Infrastructure test only; not the approved Relats study.</small></main><script>const v=document.querySelector("#v"),s=document.querySelector("#seek"),t=document.querySelector("#status");v.addEventListener("loadeddata",()=>t.textContent="Video ready");s.addEventListener("input",()=>{if(Number.isFinite(v.duration))v.currentTime=Math.min(v.duration-.05,v.duration*s.value/100)});v.addEventListener("seeked",()=>t.textContent="Frame "+v.currentTime.toFixed(2)+" s");v.addEventListener("error",()=>t.textContent="Video unavailable; poster remains");</script></html>
