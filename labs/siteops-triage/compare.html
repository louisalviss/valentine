*{box-sizing:border-box}html{background:#161616;color:white}body{font:14px system-ui,-apple-system,sans-serif;margin:0}header{position:sticky;top:0;background:#171717;z-index:10;border-bottom:2px solid #ff6841;padding:11px 15px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
