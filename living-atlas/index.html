const D={roman:{n:'Roman Domus',m:'Pompeii · c. 100 CE',lead:'A wealthy Roman home turned inward. Light, water and social life gathered around the atrium and garden.',s:[['Atrium','social core'],['Impluvium','rain basin'],['Peristyle','garden court'],['Stucco','wall finish']],f:['The atrium doubled as reception room and status display.','Rainwater fell through a roof opening into a shallow basin.','Rooms followed access and hierarchy rather than modern privacy.'],life:'Morning clients could wait near the entrance while household activity moved deeper into the house. Meals, business, worship and family life overlapped.',build:'Masonry, timber roofs and terracotta tiles created shade and controlled daylight. Courtyards worked as environmental infrastructure.',h:[['Atrium',[0,.65,.05],'The formal heart of the house, open to the sky and used to receive visitors.'],['Basin',[0,.15,.05],'A shallow basin collected rainwater beneath the roof opening.'],['Garden',[0,.55,-1.25],'A columned garden formed a cooler, quieter second center.']]},han:{n:'Han Courtyard',m:'Central Plain · c. 150 CE',lead:'A timber courtyard compound expressed family hierarchy through gates, orientation and repeated halls.',s:[['Court','shared room'],['Timber','primary frame'],['Tile roof','weather skin'],['Axis','social order']],f:['Timber posts carried the roof while walls often acted as infill.','Courtyard orientation structured family and ceremonial movement.','Deep eaves moderated sun and rain.'],life:'Work spread between halls, covered edges and the court. The compound behaved as a family of rooms linked by one outdoor room.',build:'Post-and-beam construction allowed modular bays and broad roof overhangs.',h:[['Hall',[0,.75,-1.15],'The most prominent hall sits on the primary axis.'],['Court',[0,.08,0],'An outdoor room for movement, work, light and seasonal change.'],['Gate',[0,.55,1.3],'The threshold controls transition from lane to family compound.']]},egypt:{n:'Egyptian Villa',m:'Thebes · c. 1 Mesh){if(!o.userData.cl){o.material=o.material.clone();o.material.transparent=true;o.userData.cl=1}o.material.opacity=v}})}function swap(k){if(k===key)return;let n=F[k]();S.add(n);opacity(n,0);let o=G,st=performance.now();G=n;key=k;ui();(function a(t){let p=Math.min(1,(t-st)/350);opacity(n,p);if(o)opacity(o,1-p);if(p<1)requestAnimationFrame(a);else if(o)S.remove(o)})(st);reset(false)}function reset(anim=true){let a=C.position.clone(),z=new THREE.Vector3(4.5,3.2,5.5),st=performance.now(),d=anim?450:1;(function f(t){let p=Math.min(1,(t-st)/d),e=1-(1-p)**3;C.position.lerpVectors(a,z,e);O.target.lerp(new THREE.Vector3(0,.55,0),e);if(p<1)requestAnimationFrame(f)})(st)}function content(t='overview'){let d=D[key],e=document.querySelector('#content');if(t==='overview')e.innerHTML=`<p class=lead>${d.lead}</p><div class=stats>${d.s.map(x=>`<div class=stat><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>${d.f.map(x=>`<div class=fact>${x}</div>`).join('')}<div class=card id=card></div>`;else e.innerHTML=`<p class=lead>${t==='life'?d.life:d.build}</p><div class=fact>Rotate and zoom the model to read the relationship between roof, court and enclosed rooms. This is a simplified teaching model, not an archaeological reconstruction.</div><div class=card id=card></div>`}function ui(){let d=D[key];nameEl.textContent=d.n;metaEl.textContent=d.m;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.k===key));document.querySelectorAll('.tabs button').forEach((x,i)=>x.classList.toggle('on',i===0));content();hots()}function hots(){hotsEl.innerHTML='';H=D[key].h.map(x=>{let e=document.createElement('button');e.className='hot';e.title=x[0];e.onclick=()=>{side.classList.add('open');let q=document.querySelector('#card');q.innerHTML=`<h3>${x[0]}</h3><p>${x[2]}</p>`;q.classList.add('show')};hotsEl.appendChild(e);return{e,p:new THREE.Vector3(...x[1])}})}function project(){let r=stage.getBoundingClientRect();H.forEach(h=>{let p=h.p.clone().project(C);h.e.st
