<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020805">
<title>Wildcare — 1:1 Motion Reference</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020805;overflow:hidden}body{display:grid;place-items:center}.frame{position:relative;width:100vw;height:100vh;height:100svh;background:#020805;overflow:hidden}.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#020805;display:block}.tap{position:absolute;inset:0;z-index:2;cursor:pointer;background:transparent;border:0;padding:0}@media(min-aspect-ratio:16/9){.frame video{object-fit:cover}}@media(prefers-reduced-motion:reduce){.frame video{animation:none}}
</style>
</head>
<body>
<main class="frame">
<video id="reference" autoplay muted loop playsinline preload="auto" poster="https://pbs.twimg.com/amplify_video_thumb/2090685286162501632/img/TncRk7yS5sGZMgdJ.jpg">
<source src="https://video.twimg.com/amplify_video/2090685286162501632/vid/avc1/1920x1080/rzvA3-jWeYTTi1JP.mp4?tag=29" type="video/mp4">
</video>
<button class="tap" id="tap" aria-label="Pause or resume animation"></button>
</main>
<script>
const v=document.getElementById('reference');const tap=document.getElementById('tap');
function play(){const p=v.play();if(p&&p.catch)p.catch(()=>{})}
addEventListener('pageshow',play,{once:true});
tap.addEventListener('click',()=>{v.paused?play():v.pause()});
</script>
</body>
</html>
