<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Orbital Shrine — V10 Exact Concept</title>
<style>
:root{--p:0;--mx:0;--my:0}*{box-sizing:border-box}html,body{margin:0;background:#07090c;color:#eee8dc}body{min-height:260svh;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:#07090c}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:translate3d(calc(var(--mx)*-5px),calc(var(--my)*-3px - var(--p)*8px),0) scale(calc(1.005 + var(--p)*.035));transform-origin:62% 48%;will-change:transform}.shade,.beam,.halo,.mist,.sweep,.grain,.hint{position:absolute;pointer-events:none}.shade{inset:0;background:radial-gradient(circle at 66% 45%,transparent 0 28%,rgba(7,9,12,.04) 52%,rgba(7,9,12,.34) 100%),linear-gradient(180deg,rgba(7,9,12,.04),transparent 18%,transparent 78%,rgba(7,9,12,.32))}.beam{left:66.3%;top:7%;width:2px;height:61%;background:linear-gradient(180deg,transparent,rgba(255,231,177,.82) 22%,rgba(255,247,222,.94) 52%,rgba(255,209,125,.08));box-shadow:0 0 10px rgba(255,226,164,.55),0 0 30px rgba(255,194,99,.18);animation:beam 2.7s ease-in-out infinite}@keyframes beam{0%,100%{opacity:.35}50%{opacity:.9}}.halo{left:61%;top:15%;width:10%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,233,191,.24),rgba(255,197,103,.06) 42%,transparent 70%);filter:blur(8px);animation:halo 4s ease-in-out infinite}@keyframes halo{0%,100%{transform:scale(.93);opacity:.38}50%{transform:scale(1.1);opacity:.72}}.mist{inset:-8%;background:radial-gradient(44% 18% at 70% 63%,rgba(231,218,191,.08),transparent 70%),radial-gradient(32% 16% at 60% 54%,rgba(205,198,183,.045),transparent 72%);filter:blur(28px);animation:mist 10s ease-in-out infinite alternate}@keyframes mist{from{transform:translateX(-1.2%);opacity:.28}to{transform:translateX(1.2%);opacity:.58}}.sweep{inset:-25%;background:linear-gradient(108deg,transparent 42%,rgba(255,238,207,.035) 48%,rgba(255,247,225,.11) 50%,rgba(255,230,190,.03) 52%,transparent 58%);transform:translateX(calc(-62% + var(--p)*124%));mix-blend-mode:screen}.grain{inset:-30%;opacity:.025;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:grain 8s steps(8) infinite}@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-1.5%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(1.5%,1.2%)}100%{transform:translate(0)}}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.hint{left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 12px;border:1px solid rgba(216,185,129,.18);border-radius:999px;background:rgba(7,9,12,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:rgba(238,226,205,.72);white-space:nowrap;text-transform:uppercase}
@media(max-width:900px) and (orientation:portrait){body{min-height:220svh}.stage{display:flex;align-items:center;justify-content:center}.art{inset:auto;width:100%;height:auto;max-width:none;object-fit:contain;object-position:center;transform:translate3d(0,calc(var(--p)*-5px),0) scale(calc(1 + var(--p)*.025));filter:none}.shade{background:linear-gradient(180deg,rgba(7,9,12,.28),transparent 22%,transparent 78%,rgba(7,9,12,.38))}.beam,.halo{display:none}.mist{opacity:.42}.grain{opacity:.018}.hint{font-size:7px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){.beam,.halo,.mist,.grain{animation:none}.art,.sweep{transform:none}}
</style>
</head>
<body>
<div class="stage"><img class="art" src="./concept-3.webp" alt="Orbital Shrine concept artwork"><div class="shade"></div><div class="beam"></div><div class="halo"></div><div class="mist"></div><canvas id="fx"></canvas><div class="sweep"></div><div class="grain"></div><div class="hint">V10 · exact concept asset · scroll / touch</div></div>
<script>
const r=document.documentElement,c=document.getElementById('fx'),x=c.getContext('2d');let p=0,tp=0,mx=0,my=0,tx=0,ty=0,pts=[];function size(){const d=Math.min(devicePixelRatio||1,1.5);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);pts=Array.from({length:innerWidth<900?18:38},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.06,vy:-(.06+Math.random()*.15),s:.4+Math.random()*1.2,a:.05+Math.random()*.24}))}size();addEventListener('resize',size);function sc(){const m=document.documentElement.scrollHeight-innerHeight;tp=m?scrollY/m:0}addEventListener('scroll',sc,{passive:true});sc();function pt(a,b){tx=(a/innerWidth-.5)*2;ty=(b/innerHeight-.5)*2}addEventListener('pointermove',e=>pt(e.clientX,e.clientY),{passive:true});addEventListener('touchmove',e=>{const t=e.touches[0];if(t)pt(t.clientX,t.clientY)},{passive:true});function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const o of pts){o.x+=o.vx+mx*.02;o.y+=o.vy-p*.05;if(o.y<-8){o.y=innerHeight+8;o.x=Math.random()*innerWidth}x.beginPath();x.fillStyle='rgba(242,216,168,'+o.a+')';x.arc(o.x,o.y,o.s,0,Math.PI*2);x.fill()}}function tick(){mx+=(tx-mx)*.05;my+=(ty-my)*.05;p+=(tp-p)*.06;r.style.setProperty('--mx',mx.toFixed(3));r.style.setProperty('--my',my.toFixed(3));r.style.setProperty('--p',p.toFixed(4));draw();requestAnimationFrame(tick)}tick();
</script>
</body></html>
