<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090c"><title>Orbital Shrine — V9 iOS First</title><style>
:root{--p:0;--mx:0;--my:0;--v:0}*{box-sizing:border-box}html,body{margin:0;background:#07090c;color:#eee8dc}body{min-height:300svh;overflow-x:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:#07090c}.heroArt{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:57% center;transform:translate3d(calc(var(--mx)*-5px),calc(var(--my)*-3px - var(--p)*9px),0) scale(calc(1.03 + var(--p)*.055));transform-origin:62% 48%;will-change:transform;filter:saturate(.98) contrast(1.025) brightness(.97)}.shade,.aurora,.mist,.beam,.halo,.ring,.sweep,.grain,.progress,.hint{position:absolute;pointer-events:none}.shade{inset:0;background:radial-gradient(circle at 66% 45%,transparent 0 25%,rgba(7,9,12,.05) 48%,rgba(7,9,12,.42) 100%),linear-gradient(180deg,rgba(7,9,12,.08),transparent 22%,transparent 75%,rgba(7,9,12,.45))}.aurora{inset:-8%;background:radial-gradient(45% 24% at 68% 23%,rgba(88,177,160,.13),transparent 66%),radial-gradient(36% 19% at 78% 31%,rgba(100,214,183,.08),transparent 70%);filter:blur(22px);mix-blend-mode:screen;animation:aurora 8s ease-in-out infinite alternate}@keyframes aurora{from{transform:translate3d(-1.5%,1%,0) scale(1);opacity:.42}to{transform:translate3d(1.5%,-1%,0) scale(1.04);opacity:.78}}.mist{inset:0;background:radial-gradient(42% 18% at 69% 66%,rgba(230,218,192,.08),transparent 70%),radial-gradient(35% 16% at 56% 58%,rgba(215,207,188,.05),transparent 72%);filter:blur(34px);animation:mist 11s ease-in-out infinite alternate}@keyframes mist{from{transform:translateX(-1.5%);opacity:.32}to{transform:translateX(1.5%);opacity:.62}}.beam{left:66.4%;top:5%;width:3px;height:68%;background:linear-gradient(180deg,transparent,rgba(255,232,178,.8) 18%,rgba(255,247,223,.98) 52%,rgba(255,214,136,.15) 100%);box-shadow:0 0 10px rgba(255,227,165,.65),0 0 32px rgba(255,199,112,.28);filter:blur(.35px);transform:translateX(-50%) scaleY(calc(.94 + var(--p)*.08));transform-origin:50% 55%;animation:beam 2.8s ease-in-out infinite}@keyframes beam{0%,100%{opacity:.45}50%{opacity:1}}.halo{left:60.8%;top:13%;width:11%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,236,196,.28),rgba(255,204,120,.08) 38%,transparent 68%);filter:blur(9px);animation:halo 4.2s ease-in-out infinite}@keyframes halo{0%,100%{transform:scale(.92);opacity:.42}50%{transform:scale(1.12);opacity:.78}}.ring{left:54.9%;top:21.2%;width:23.8%;aspect-ratio:1.82;border:1px solid rgba(218,183,116,.26);border-radius:50%;box-shadow:0 0 24px rgba(218,177,102,.1),inset 0 0 22px rgba(218,177,102,.07);transform:rotate(calc(var(--p)*18deg)) translate3d(calc(var(--mx)*2px),calc(var(--my)*1px),0);animation:ring 15s linear infinite}@keyframes ring{to{filter:hue-rotate(10deg)}}.sweep{inset:-25%;background:linear-gradient(110deg,transparent 40%,rgba(255,237,207,.04) 47%,rgba(255,246,224,.12) 50%,rgba(255,230,190,.035) 53%,transparent 60%);transform:translateX(calc(-62% + var(--p)*124%));mix-blend-mode:screen}.grain{inset:-35%;opacity:.035;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:grain 7s steps(7) infinite}@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(2%,1.5%)}100%{transform:translate(0)}}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.progress{right:16px;top:18%;bottom:18%;width:1px;background:rgba(215,183,124,.16)}.progress i{display:block;width:3px;height:16%;margin-left:-1px;background:#dab774;box-shadow:0 0 15px rgba(218,183,116,.42);transform:translateY(calc(var(--p)*68vh));border-radius:999px}.hint{left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(216,185,129,.2);border-radius:999px;background:rgba(7,9,12,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:rgba(235,225,207,.66);text-transform:uppercase;white-space:nowrap}.touchGlow{position:absolute;width:180px;height:180px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,225,172,.12),transparent 68%);filter:blur(10px);transform:translate(-50%,-50%);opacity:0;transition:opacity .25s}
@media(max-width:900px){body{min-height:240svh}.heroArt{inset:-1%;width:102%;height:102%;object-position:64% center;transform:translate3d(0,calc(var(--p)*-6px),0) scale(calc(1.055 + var(--p)*.035))}.beam{left:70.2%;top:7%;height:58%}.halo{left:65.5%;top:17%;width:15%}.ring{left:55.5%;top:22.5%;width:32%}.progress{display:none}.hint{font-size:7px;padding:8px 11px}.grain{opacity:.025}.aurora{filter:blur(18px)} }

</style></head><body><div class="stage"><img class="heroArt" src="./bg.webp" alt="Orbital Shrine"><div class="shade"></div><div class="aurora"></div><div class="ring"></div><div class="beam"></div><div class="halo"></div><div class="mist"></div><canvas id="fx"></canvas><div class="sweep"></div><div class="grain"></div><div class="progress"><i></i></div><div class="touchGlow" id="touchGlow"></div><div class="hint">V9 · scroll / drag / touch</div></div><script>
const r=document.documentElement,c=document.getElementById('fx'),x=c.getContext('2d'),g=document.getElementById('touchGlow');let p=0,tp=0,mx=0,my=0,tx=0,ty=0,parts=[];function size(){const d=Math.min(devicePixelRatio||1,1.5);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);parts=Array.from({length:innerWidth<900?22:42},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.08,vy:-(.08+Math.random()*.18),s:.5+Math.random()*1.4,a:.08+Math.random()*.34}))}size();addEventListener('resize',size);function scroll(){const m=document.documentElement.scrollHeight-innerHeight;tp=m?scrollY/m:0}addEventListener('scroll',scroll,{passive:true});scroll();function point(clientX,clientY){tx=(clientX/innerWidth-.5)*2;ty=(clientY/innerHeight-.5)*2;g.style.left=clientX+'px';g.style.top=clientY+'px';g.style.opacity='.8'}addEventListener('pointermove',e=>point(e.clientX,e.clientY),{passive:true});addEventListener('pointerleave',()=>g.style.opacity='0',{passive:true});addEventListener('touchmove',e=>{const t=e.touches[0];if(t)point(t.clientX,t.clientY)},{passive:true});addEventListener('touchend',()=>g.style.opacity='0',{passive:true});function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const o of parts){o.x+=o.vx+mx*.025;o.y+=o.vy-p*.08;if(o.y<-8){o.y=innerHeight+8;o.x=Math.random()*innerWidth}if(o.x<-8)o.x=innerWidth+8;if(o.x>innerWidth+8)o.x=-8;x.beginPath();x.fillStyle='rgba(242,216,168,'+o.a+')';x.arc(o.x,o.y,o.s,0,Math.PI*2);x.fill()}}function tick(){mx+=(tx-mx)*.05;my+=(ty-my)*.05;p+=(tp-p)*.06;r.style.setProperty('--mx',mx.toFixed(3));r.style.setProperty('--my',my.toFixed(3));r.style.setProperty('--p',p.toFixed(4));draw();requestAnimationFrame(tick)}tick();
</script></body></html>
