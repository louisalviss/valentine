<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08131c" />
<title>Road to Elsewhere — v10</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-kicker">ROAD TO ELSEWHERE / V10</div>
    <div class="loader-title">LOW POLY<br>GRAND TOUR</div>
    <div class="loader-bar"><i id="loadBar"></i></div>
    <div class="loader-status" id="loadStatus">Assembling worlds</div>
  </div>
</div>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="film"></div><div class="vignette"></div><div class="speed-wash"></div>
<header>
  <div class="brand"><i></i><span>Road to Elsewhere</span></div>
  <div class="micro">OCEAN / FOREST / DESERT / CITY / SUMMIT</div>
</header>
<div class="world-hud">
  <span id="worldIndex">01</span>
  <div><b id="worldName">Ocean Causeway</b><small id="worldMeta">Concrete bridge · open sea</small></div>
</div>
<div class="camera-hud" id="cameraHud">WIDE ROAD CHASE</div>
<div class="progress"><i></i></div>
<main>
  <section class="chapter" data-name="Ocean Causeway" data-meta="Concrete bridge · open sea"></section>
  <section class="chapter" data-name="Mist Forest" data-meta="Narrow asphalt · dense pines"></section>
  <section class="chapter" data-name="Desert Pass" data-meta="Dust road · canyon sweep"></section>
  <section class="chapter" data-name="Neon City" data-meta="Elevated highway · rain"></section>
  <section class="chapter" data-name="Aurora Summit" data-meta="Cliff pass · snow · aurora"></section>
</main>
<div class="hint">SCROLL TO DRIVE</div>
<script type="importmap">{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}</script>
<script type="module" src="./app.js"></script>
<script type="module" src="./safe-camera.js"></script>
</body>
</html>
