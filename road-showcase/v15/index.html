function tramHuong({back,hero}){const plaza=new THREE.Mesh(new THREE.PlaneGeometry(8.5,4.5),new THREE.MeshBasicMaterial({color:0xe6ddd1,side:THREE.DoubleSide}));plaza.rotation.x=-Math.PI/2;plaza.position.y=.01;hero.add(plaza);const base=new THREE.Mesh(new THREE.CylinderGeometry(1.45,1.68,.42,10),pmat(0xe4d7c4));base.position.y=.22;hero.add(base);const core=new THREE.Mesh(new THREE.CylinderGeometry(.57,.75,3.6,10),mat(C.blueGlass,.25,.22));core.position.y=2.02;hero.add(core);const petalShape=new THREE.Shape();petalShape.moveTo(-.34,0);petalShape.bezierCurveTo(-.72,.8,-.62,2.0,0,3.35);petalShape.bezierCurveTo(.62,2.0,.72,.8,.34,0);petalShape.closePath();const pg=new THREE.ExtrudeGeometry(petalShape,{depth:.12,bevelEnabled:true,bevelSize:.035,bevelThickness:.03,bevelSegments:2});for(let i=0;i<6;i++){const p=new THREE.Mesh(pg,pmat(i%2?0xf3e7d5:0xf7f1e7));const a=i*Math.PI/3;p.position.set(Math.cos(a)*.78,.48,Math.sin(a)*.78);p.rotation.y=-a;hero.add(p)}const tip=new THREE.Mesh(new THREE.ConeGeometry(.26,.9,8),pmat(0xf4eadb));tip.position.y=4.55;hero.add(tip)}

function longSon({back,hero}){const mountain=new THREE.Group();for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(1.8+(i%2)*.55,3.0+(i%3)*.7,8),pmat(i%2?0x66856b:0x789778));m.position.set(-3.8+i*1.9,1.45,1.7+(i%2)*.35);m.scale.z=.62;mountain.add(m)}back.add(mountain);const hill=new THREE.Mesh(new THREE.CylinderGeometry(4.0,4.8,.75,14),pmat(0x78916c));hill.scale.z=.72;hill.position.y=.37;hero.add(hill);const lotus=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.7,.55,14),pmat(0xece9df));lotus.position.set(1.15,1.1,0);hero.add(lotus);const body=new THREE.Mesh(new THREE.SphereGeometry(1.02,16,10),pmat(0xf8f7f1));body.scale.set(1,.9,.72);body.position.set(1.15,2.15,0);hero.add(body);const chest=new THREE.Mesh(new THREE.SphereGeometry(.78,14,9),pmat(0xf8f7f1));chest.scale.set(.88,1.05,.62);chest.position.set(1.15,2.62,-.03);hero.add(chest);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,14,9),pmat(0xf9f8f2));head.position.set(1.15,3.45,-.03);hero.add(head);const halo=new THREE.Mesh(new THREE.TorusGeometry(.62,.055,8,32),new THREE.MeshBasicMaterial({color:0xf4d99b}));halo.position.set(1.15,3.46,.22);halo.rotation.x=Math.PI/2;hero.add(halo)}

let target=.004,progress=.004,velocity=0,lastY=scrollY,first=true;const carQ=new THREE.Quaternion(),camQ=new THREE.Quaternion(),camPos=new THREE.Vector3(),lookM=new THREE.Matrix4(),clock=new THREE.Clock();
function onScroll(){const total=Math.max(document.documentElement.scrollHeight-innerHeight,1);target=.004+(scrollY/total)*.992;velocity=Math.min(1,velocity+Math.abs(scrollY-lastY)/650);lastY=scrollY}addEventListener('scroll',onScroll,{passive:true});onScroll();
function syncHud(){const total=Math.max(document.documentElement.scrollHeight-innerHeight,1),p=scrollY/total,idx=clamp(Math.floor(p*sections.length),0,sections.length-1),s=sections[idx];step.textContent=String(idx+1).padStart(2,'0');place.textContent=s.dataset.place;meta.textContent=s.dataset.meta;rail.forEach((r,i)=>r.classList.toggle('active',i===idx));document.documentElement.style.setProperty('--progress',(p*100)+'%')}
function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.04);progress=damp(progress,target,reduceMotion?14:3.25,dt);velocity=damp(velocity,0,3.0,dt);syncHud();const {p,tangent,side,normal}=basis(progress);car.position.copy(p).addScaledVector(normal,.035);carQ.setFromUnitVectors(FORWARD,tangent);car.quaternion.slerp(carQ,1-Math.exp(-dt*9));for(const w of car.userData.wheels)w.rotation.x-=dt*(7+velocity*22);popups.forEach(updatePopup);const back=portrait()?13.2:10.8,height=portrait()?5.8:4.6,sideOffset=portrait()?-.25:.65;const desired=p.clone().addScaledVector(tangent,-back).addScaledVector(normal,height).addScaledVector(side,sideOffset);if(first)camPos.copy(desired);else camPos.lerp(desired,1-Math.exp(-dt*3.45));camera.position.copy(camPos);const focus=curve.getPointAt(clamp(progress+(portrait()?.058:.07),0,1)).addScaledVector(UP,.55);lookM.lookAt(camera.position,focus,UP);camQ.setFromRotationMatrix(lookM);camera.quaternion.slerp(camQ,first?1:1-Math.exp(-dt*4.1));first=false;const baseFov=portrait()?64:50;camera.fov=damp(camera.fov,baseFov+velocity*1.6,3,dt);camera.updateProjectionMatrix();sun.target.position.copy(p);sun.target.updateMatrixWorld();composer.render()}
render();setTimeout(()=>loader.classList.add('done'),650);
