<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9e3ec"><title>Nha Trang Road Book v15.1</title><style>
:root{--p:0%;--ink:#20343b;--coral:#e46c53}*{box-sizing:border-box}html,body{margin:0;background:#b9e3ec;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}header,.hud,.dots,.bar{position:fixed;z-index:3;pointer-events:none}header{top:0;left:0;right:0;padding:calc(13px + env(safe-area-inset-top)) 14px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#eaf7f4aa,transparent)}header b{font-size:10px;letter-spacing:.13em}header span{font-size:7px;letter-spacing:.12em;color:#61777d}.hud{left:11px;bottom:calc(12px + env(safe-area-inset-bottom));padding:9px 12px;border:1px solid #ffffffa8;border-radius:16px;background:#fbf6ebd9;backdrop-filter:blur(14px);box-shadow:0 16px 38px #20343b24;min-width:min(315px,calc(100vw - 54px))}.hud small{display:block;font-size:7px;letter-spacing:.17em;color:#8a9695}.hud b{display:block;font-size:14px;margin-top:2px}.hud em{display:block;font-style:normal;font-size:8px;color:#708084;margin-top:2px}.dots{right:8px;top:50%;transform:translateY(-50%);padding:9px 6px;border-radius:99px;background:#fff9;border:1px solid #fff;display:flex;flex-direction:column;gap:8px}.dots i{width:4px;height:4px;border-radius:50%;background:#60777b44}.dots i.on{background:var(--coral);transform:scale(1.65)}.bar{left:0;right:0;bottom:0;height:2px;background:#263b4114}.bar i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,#e46c53,#2ca5c6)}main{position:relative;z-index:2;pointer-events:none}section{height:145vh}@media(min-width:760px){.hud{left:28px;bottom:22px}.dots{right:20px}section{height:155vh}}</style></head><body>
<canvas id="c"></canvas><header><b>NHA TRANG / POP-UP ROAD BOOK</b><span>TRẦN PHÚ → HÒN CHỒNG → PO NAGAR → XÓM BÓNG → LONG SƠN</span></header><div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div><div class="hud"><small>NOW PASSING</small><b id="name">Trần Phú · Trầm Hương</b><em id="meta">Biển bên phải · Quảng trường 2/4 · tháp ven biển</em></div><div class="bar"><i></i></div><main>
<section data-n="Trần Phú · Trầm Hương" data-m="Biển bên phải · Quảng trường 2/4 · tháp ven biển"></section><section data-n="Hòn Chồng" data-m="Biển bên phải · ghềnh đá granit"></section><section data-n="Phố Bắc Nha Trang" data-m="Quẹo trái · phố hai bên"></section><section data-n="Tháp Bà Po Nagar" data-m="Tháp Chăm bên phải · đồi Cù Lao"></section><section data-n="Sông Cái · Cầu Xóm Bóng" data-m="Ngay cạnh Tháp Bà · phố hai bờ"></section><section data-n="Long Sơn · Phật Trắng" data-m="Quẹo phải · Phật Trắng trên núi bên phải"></section></main>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),secs=[...document.querySelectorAll('section')],dots=[...document.querySelectorAll('.dots i')],name=document.getElementById('name'),meta=document.getElementById('meta');let W=0,H=0,D=1,p=0,target=0;
const C={sky:'#a8dce8',sky2:'#edf0df',paper:'#eadfc9',road:'#414b50',lane:'#f9eed6',sea:'#2c9fc4',sand:'#e8c98b',city:'#d9d8cf',city2:'#bcc9c7',glass:'#76a9b6',green:'#39795a',green2:'#6c956d',brick:'#a95132',brick2:'#753827',rock:'#ad896c',rock2:'#756052',white:'#fbf7ed',coral:'#e46c53',river:'#3d93aa'};
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}function sm(a,b,v){v=clamp((v-a)/(b-a));return v*v*(3-2*v)}function poly(a,fill){g.beginPath();g.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)g.lineTo(a[i][0],a[i][1]);g.closePath();g.fillStyle=fill;g.fill()}function rr(x,y,w,h,r,fill){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);g.fillStyle=fill;g.fill()}function line(x1,y1,x2,y2,w,col){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function mountain(){poly([[0,H*.42],[W*.15,H*.29],[W*.28,H*.42],[W*.45,H*.24],[W*.62,H*.42],[W*.79,H*.31],[W,H*.43],[W,H*.52],[0,H*.52]],C.green2);poly([[0,H*.43],[W*.22,H*.34],[W*.36,H*.43],[W*.58,H*.31],[W*.78,H*.44],[W,H*.37],[W,H*.49],[0,H*.49]],'#77978a')}function sea(){g.fillStyle=C.sea;g.fillRect(W*.56,H*.39,W*.44,H*.61);for(let i=0;i<12;i++){g.strokeStyle='#eaffff99';g.lineWidth=1.6;g.beginPath();g.moveTo(W*.59,H*.42+i*24);g.quadraticCurveTo(W*.77,H*.405+i*24,W*.99,H*.425+i*24);g.stroke()}}
function building(x,base,w,h,col=C.city){rr(x,base-h,w,h,3,col);for(let yy=base-h+8;yy<base-8;yy+=10){g.fillStyle=C.glass;for(let xx=x+4;xx<x+w-4;xx+=7)g.fillRect(xx,yy,3,5)}}function city(base,right=true,left=true){if(left)for(let i=0;i<8;i++){let w=17+(i%3)*6,h=45+(i%5)*16;building(5+i*22,base,w,h,i%2?C.city:C.city2)}if(right)for(let i=0;i<7;i++){let w=18+(i%2)*7,h=40+(i%4)*19;building(W-25-i*24,base,w,h,i%2?C.city2:C.city)}}function palm(x,y,s=1){line(x,y,x+2*s,y-42*s,5*s,'#8d6648');g.fillStyle=C.green;for(let i=0;i<6;i++){g.save();g.translate(x+2*s,y-42*s);g.rotate(i*Math.PI/3);g.beginPath();g.ellipse(12*s,0,16*s,4*s,0,0,Math.PI*2);g.fill();g.restore()}}
function pop(anchorX,base,k,draw){g.save();g.translate(anchorX,base);g.scale(1,.08+.92*k);g.fillStyle='#20343b22';g.beginPath();g.ellipse(0,4,70,12,0,0,Math.PI*2);g.fill();draw();g.restore()}function tram(k){pop(W*.76,H*.66,k,()=>{g.fillStyle='#d88778';g.beginPath();g.ellipse(0,2,27,8,0,0,Math.PI*2);g.fill();rr(-8,-62,16,55,5,'#267ea2');for(let i=0;i<6;i++){g.save();g.rotate((i-2.5)*.12);poly([[-9,0],[-13,-42],[0,-82],[13,-42],[9,0]],i%2?'#eee3d4':'#fff9ed');g.restore()}poly([[-5,-77],[0,-92],[5,-77]],'#f8eddc')})}function rocks(k){pop(W*.76,H*.68,k,()=>{for(let i=0;i<9;i++){g.fillStyle=i%2?C.rock:C.rock2;g.beginPath();g.ellipse((i-4)*13,-Math.abs(i-4)*3,20,13,(i%3-.8)*.18,0,Math.PI*2);g.fill()}g.fillStyle='#bd9676';g.beginPath();g.ellipse(15,-34,32,19,-.13,0,Math.PI*2);g.fill()})}function po(k){pop(W*.76,H*.68,k,()=>{function t(x,h,s){rr(x-13*s,-h,26*s,h,2,C.brick);poly([[x-16*s,-h],[x,-h-28*s],[x+16*s,-h]],C.brick2);poly([[x-9*s,-h-25*s],[x,-h-40*s],[x+9*s,-h-25*s]],'#663023')}t(0,78,1);t(-36,58,.76);t(36,52,.7)})}
function bridge(k){g.save();g.globalAlpha=k;g.fillStyle=C.river;g.fillRect(0,H*.43,W,H*.29);poly([[W*.18,H*.60],[W*.24,H*.49],[W*.76,H*.49],[W*.83,H*.60],[W*.79,H*.64],[W*.21,H*.64]],'#9aa3a3');line(W*.27,H*.55,W*.73,H*.55,5,'#e7c165');line(W*.3,H*.55,W*.34,H*.46,3,'#d69f46');line(W*.7,H*.55,W*.66,H*.46,3,'#d69f46');for(let i=0;i<5;i++){g.fillStyle=i%2?'#c86549':'#76523e';g.beginPath();g.ellipse(W*.18+i*W*.16,H*.7+(i%2)*15,18,5,0,0,Math.PI*2);g.fill()}g.restore()}function buddha(k){pop(W*.79,H*.68,k,()=>{poly([[-80,0],[-35,-72],[10,-59],[78,0]],'#6f8e6b');g.fillStyle=C.white;g.beginPath();g.arc(8,-88,15,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(8,-61,29,33,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(8,-34,43,14,0,0,Math.PI*2);g.fill();g.strokeStyle='#f0d69d';g.lineWidth=4;g.beginPath();g.arc(8,-87,24,0,Math.PI*2);g.stroke()})}
function road(vanishX,bridgeMode=false){let hy=H*.39,b=H*1.03,tw=W*.07,bw=W*.72;if(bridgeMode){tw=W*.09;bw=W*.62}poly([[vanishX-tw/2,hy],[vanishX+tw/2,hy],[W*.5+bw/2,b],[W*.5-bw/2,b]],bridgeMode?'#677276':C.road);g.strokeStyle=C.lane;g.lineWidth=3;g.setLineDash([12,14]);g.beginPath();g.moveTo(vanishX,hy);g.lineTo(W*.5,b);g.stroke();g.setLineDash([])}function car(){let y=H*.79,w=Math.min(112,W*.29),h=w*.48;g.fillStyle='#20343b26';g.beginPath();g.ellipse(W*.5,y+h*.38,w*.56,h*.18,0,0,Math.PI*2);g.fill();rr(W*.5-w*.48,y-h*.18,w*.96,h*.49,11,C.coral);rr(W*.5-w*.28,y-h*.42,w*.56,h*.34,8,'#577f8b');g.fillStyle='#182126';g.beginPath();g.arc(W*.5-w*.36,y+h*.27,h*.18,0,Math.PI*2);g.arc(W*.5+w*.36,y+h*.27,h*.18,0,Math.PI*2);g.fill()}
function render(){requestAnimationFrame(render);target=clamp(scrollY/Math.max(document.documentElement.scrollHeight-innerHeight,1));p+=(target-p)*.075;let f=p*6,stage=Math.min(5,Math.floor(f)),local=f-stage,k=sm(.02,.28,local);let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,C.sky);grad.addColorStop(.62,C.sky2);grad.addColorStop(1,'#d8cba7');g.fillStyle=grad;g.fillRect(0,0,W,H);mountain();let ground=stage===4?'#d8cfbd':C.paper;g.fillStyle=ground;g.fillRect(0,H*.39,W,H*.61);if(stage<=1)sea();let vanish=W*.5;if(stage===2)vanish=W*(.5-.18*sm(.15,.85,local));if(stage===5)vanish=W*(.5+.17*sm(.12,.85,local));if(stage===4)bridge(k);road(vanish,stage===4);if(stage!==4)city(H*.68,stage>=2,true);if(stage<=1){for(let i=0;i<6;i++)palm(W*.59+i*W*.067,H*.68,.65)}if(stage===0){g.fillStyle='#d9b987';g.fillRect(W*.60,H*.62,W*.27,8);tram(k)}if(stage===1)rocks(k);if(stage===3)po(k);if(stage===5)buddha(k);car();let s=secs[stage];name.textContent=s.dataset.n;meta.textContent=s.dataset.m;dots.forEach((d,i)=>d.classList.toggle('on',i===stage));document.documentElement.style.setProperty('--p',(p*100)+'%')}
resize();addEventListener('resize',resize);render()})();
</script></body></html>
