<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#bfe8f3" />
<title>Nha Trang — Road Journey Recover</title>
<style>
:root{--ink:#213744;--glass:rgba(250,246,237,.82);--accent:#e77658}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#bfe8f3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y}
.ui{position:fixed;inset:0;z-index:3;pointer-events:none}.top{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.brand b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 4px rgba(231,118,88,.12)}.coords{font-size:8px;letter-spacing:.13em;color:rgba(33,55,68,.46)}
.hud{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));min-width:235px;padding:10px 13px;border-radius:15px;background:var(--glass);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 48px rgba(32,55,67,.13)}.hud small{display:block;font-size:7px;font-weight:800;letter-spacing:.18em;color:#879797}.hud strong{display:block;margin-top:3px;font-size:15px;letter-spacing:-.025em}.hud span{display:block;margin-top:2px;font-size:8px;color:#68797d}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;padding:9px 6px;border-radius:99px;background:rgba(248,244,236,.52);border:1px solid rgba(255,255,255,.58)}.rail i{width:5px;height:5px;border-radius:50%;background:rgba(33,55,68,.18)}.rail i.active{background:var(--accent);transform:scale(1.6);box-shadow:0 0 0 3px rgba(231,118,88,.12)}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(33,55,68,.08)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e77658,#38a9c8)}
#error{position:absolute;left:12px;right:12px;top:calc(54px + env(safe-area-inset-top));padding:10px 12px;border-radius:12px;background:#fff3e7;color:#8b3d25;font-size:11px;display:none;border:1px solid rgba(139,61,37,.16)}
main{position:relative;z-index:1;pointer-events:none}section{height:145vh}
@media(min-width:820px){.top{padding:calc(16px + env(safe-area-inset-top)) 28px 0}.hud{left:28px;bottom:calc(22px + env(safe-area-inset-bottom));min-width:285px}.rail{right:22px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui">
  <div class="top"><div class="brand"><b></b>Nha Trang / Pop-up Road Journey</div><div class="coords">12.2388° N · 109.1967° E</div></div>
  <div id="error">Render error — fallback mode active.</div>
  <div class="hud"><small>NOW PASSING</small><strong id="place">Trần Phú · Trầm Hương</strong><span id="meta">Biển bên phải · Quảng trường 2/4</span></div>
  <div class="rail" id="rail"></div><div class="progress"><i id="bar"></i></div>
</div>
<main><section></section><section></section><section></section><section></section><section></section><section></section></main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const place=document.getElementById('place'),meta=document.getElementById('meta'),bar=document.getElementById('bar'),railEl=document.getElementById('rail'),errorEl=document.getElementById('error');
const chapters=[['Trần Phú · Trầm Hương','Biển bên phải · Quảng trường 2/4'],['Hòn Chồng','Ghềnh đá bên phải · biển mở'],['Phố Bắc Nha Trang','Quẹo trái · phố hai bên'],['Tháp Bà Po Nagar','Tháp Chăm bên phải · đồi Cù Lao'],['Sông Cái · Cầu Xóm Bóng','Ngay sau Tháp Bà · phố hai bờ'],['Long Sơn · Phật Trắng','Quẹo phải · núi và Phật Trắng bên phải']];
chapters.forEach(()=>{const i=document.createElement('i');railEl.appendChild(i)});const rails=[...railEl.children];
let W=0,H=0,DPR=1,smooth=0,cam=null,faces=[];
const C={sky:'#bfe8f3',sky2:'#eef7f0',paper:'#f4ecdc',paper2:'#e4d8c5',road:'#424d53',edge:'#858278',lane:'#f9efd5',sea:'#36a8ce',sand:'#e5c88f',leaf:'#3b7858',leaf2:'#65956a',wood:'#8b6748',brick:'#a65738',brick2:'#733d2d',cream:'#f4eadb',white:'#f7f4ed',rock:'#aa8666',rock2:'#775f51',hill:'#789473',city:'#d7d8d1',city2:'#bcc9c5',glass:'#5aa8c0',car:'#e97759',car2:'#f0a083',dark:'#29363c',river:'#4a9db4'};
const U={x:0,y:1,z:0};
const route=[P(0,.12,15),P(0,.12,-20),P(.6,.14,-54),P(.2,.16,-88),P(.4,.18,-122),P(-3,.22,-148),P(-14,.28,-168),P(-31,.34,-184),P(-45,.38,-203),P(-49,.42,-225),P(-44,.34,-248),P(-34,.28,-270),P(-22,.24,-294),P(-10,.22,-320)];
function P(x=0,y=0,z=0){return{x,y,z}} function add(a,b){return P(a.x+b.x,a.y+b.y,a.z+b.z)} function sub(a,b){return P(a.x-b.x,a.y-b.y,a.z-b.z)} function mul(a,s){return P(a.x*s,a.y*s,a.z*s)} function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z} function cross(a,b){return P(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x)} function norm(a){const l=Math.hypot(a.x,a.y,a.z)||1;return mul(a,1/l)}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
function curve(t){const n=route.length-1,s=clamp(t,0,.999999)*n,i=Math.floor(s),f=s-i,f2=f*f,f3=f2*f,a=route[Math.max(0,i-1)],b=route[i],c=route[Math.min(n,i+1)],d=route[Math.min(n,i+2)];const k=q=>.5*((2*b[q])+(-a[q]+c[q])*f+(2*a[q]-5*b[q]+4*c[q]-d[q])*f2+(-a[q]+3*b[q]-3*c[q]+d[q])*f3);return P(k('x'),k('y'),k('z'))}
function basis(t){const p=curve(t),a=curve(clamp(t-.002,0,1)),b=curve(clamp(t+.002,0,1)),f=norm(sub(b,a)),r=norm(cross(f,U));return{p,f,r}}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.max(1,Math.round(W*DPR));canvas.height=Math.max(1,Math.round(H*DPR));canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',resize);resize();
function progress(){const max=Math.max(document.body.scrollHeight-innerHeight,1),raw=scrollY/max;smooth=lerp(smooth,raw,.08);return smooth}
function setupCam(t){const {p,f,r}=basis(t),portrait=W/H<.76,back=portrait?12:10.5,height=portrait?5.7:4.8,side=portrait?.35:1.1,pos=add(add(add(p,mul(f,-back)),mul(r,side)),P(0,height,0)),target=add(add(p,mul(f,portrait?17:19)),P(0,1.15,0)),F=norm(sub(target,pos)),R=norm(cross(F,U)),Up=norm(cross(R,F)),fov=(portrait?61:50)*Math.PI/180;cam={pos,F,R,U:Up,focal:H/(2*Math.tan(fov/2)),cy:H*(portrait?.49:.52)}}
function project(p){const q=sub(p,cam.pos),z=dot(q,cam.F);if(z<.3)return null;return{x:W*.5+dot(q,cam.R)/z*cam.focal,y:cam.cy-dot(q,cam.U)/z*cam.focal,z}}
function face(points,color,alpha=1){faces.push({points,color,alpha})}
function local(c,r,f,x,y,z){return add(add(add(c,mul(r,x)),P(0,y,0)),mul(f,z))}
function box(c,r,f,w,h,d,color,sy=1){h*=sy;const p=[local(c,r,f,-w/2,0,-d/2),local(c,r,f,w/2,0,-d/2),local(c,r,f,w/2,0,d/2),local(c,r,f,-w/2,0,d/2),local(c,r,f,-w/2,h,-d/2),local(c,r,f,w/2,h,-d/2),local(c,r,f,w/2,h,d/2),local(c,r,f,-w/2,h,d/2)];face([p[0],p[1],p[5],p[4]],color);face([p[1],p[2],p[6],p[5]],color);face([p[2],p[3],p[7],p[6]],color);face([p[3],p[0],p[4],p[7]],color);face([p[4],p[5],p[6],p[7]],color)}
function taper(c,r,f,w0,d0,w1,d1,h,color,sy=1){h*=sy;const lo=[local(c,r,f,-w0/2,0,-d0/2),local(c,r,f,w0/2,0,-d0/2),local(c,r,f,w0/2,0,d0/2),local(c,r,f,-w0/2,0,d0/2)],hi=[local(c,r,f,-w1/2,h,-d1/2),local(c,r,f,w1/2,h,-d1/2),local(c,r,f,w1/2,h,d1/2),local(c,r,f,-w1/2,h,d1/2)];for(let i=0;i<4;i++)face([lo[i],lo[(i+1)%4],hi[(i+1)%4],hi[i]],color);face(hi,color)}
function pyramid(c,r,f,w,d,h,color,sy=1){h*=sy;const lo=[local(c,r,f,-w/2,0,-d/2),local(c,r,f,w/2,0,-d/2),local(c,r,f,w/2,0,d/2),local(c,r,f,-w/2,0,d/2)],tip=local(c,r,f,0,h,0);for(let i=0;i<4;i++)face([lo[i],lo[(i+1)%4],tip],color)}
function ribbon(t0,t1,o1,o2,color,y=-.06,segments=48){let prev=null;for(let i=0;i<=segments;i++){const t=lerp(t0,t1,i/segments),{p,r}=basis(t),a=add(add(p,mul(r,o1)),P(0,y,0)),b=add(add(p,mul(r,o2)),P(0,y,0));if(prev)face([prev.a,prev.b,b,a],color);prev={a,b}}}
function terrain(){ribbon(0,.43,4.1,9.1,C.sand,-.1,30);ribbon(0,.43,9.1,35,C.sea,-.24,30);ribbon(0,.43,-4.1,-22,C.paper2,-.13,30);ribbon(.40,.68,4.1,20,C.paper2,-.13,22);ribbon(.40,.68,-4.1,-20,C.paper,-.13,22);ribbon(.79,1,4.1,22,C.paper2,-.13,20);ribbon(.79,1,-4.1,-22,C.paper,-.13,20);const {p,f,r}=basis(.73),c=add(p,P(0,-.42,0));face([local(c,r,f,-30,0,-9),local(c,r,f,30,0,-9),local(c,r,f,30,0,9),local(c,r,f,-30,0,9)],C.river)}
function road(){ribbon(0,1,3.8,-3.8,C.edge,.01,72);ribbon(0,1,3.35,-3.35,C.road,.035,72);ribbon(0,1,3.38,3.18,C.lane,.055,72);ribbon(0,1,-3.18,-3.38,C.lane,.055,72);for(let t=.02;t<.99;t+=.05){const {p,f,r}=basis(t),c=add(p,P(0,.06,0));face([local(c,r,f,-.06,0,-.72),local(c,r,f,.06,0,-.72),local(c,r,f,.06,0,.72),local(c,r,f,-.06,0,.72)],C.lane)}}
function palm(t,off,s=1){const {p,f,r}=basis(t),c=add(p,mul(r,off));box(c,r,f,.16,2.1*s,.16,C.wood);const top=add(c,P(0,2.05*s,0));for(let i=0;i<5;i++){const a=i*Math.PI*2/5,rr=add(mul(r,Math.cos(a)),mul(f,Math.sin(a)));face([top,add(add(top,mul(rr,.45*s)),P(0,.06*s,0)),add(add(top,mul(rr,1.15*s)),P(0,-.28*s,0))],i%2?C.leaf:C.leaf2)}}
function building(t,off,w,h,d,color){const {p,f,r}=basis(t),c=add(p,mul(r,off));box(c,r,f,w,h,d,color)}
function streets(){for(let t=.03,i=0;t<.40;t+=.055,i++){palm(t,6.0+(i%2)*.35,.9);building(t,-7.4-(i%3)*1.2,1.8,3.2+(i%4)*.7,2.0,i%2?C.city:C.city2)}for(let t=.45,i=0;t<.68;t+=.045,i++){building(t,7+(i%2)*1.5,1.8,2.8+(i%3)*.55,2.0,i%2?C.cream:C.city2);building(t,-7-(i%2)*1.5,1.8,3+(i%4)*.48,2.0,i%2?C.city:C.cream)}for(let t=.80,i=0;t<.98;t+=.05,i++){building(t,7+(i%2)*1.5,1.8,3+(i%3)*.5,2.0,i%2?C.city2:C.cream);building(t,-7-(i%2)*1.4,1.8,3.2+(i%4)*.45,2.0,i%2?C.city:C.cream)}}
function pop(center,t,w=.11){return clamp(1-Math.abs(t-center)/w,0,1)}
function baseAt(t,off,w,d){const {p,f,r}=basis(t),c=add(add(p,mul(r,off)),P(0,.02,0));face([local(c,r,f,-w/2,0,-d/2),local(c,r,f,w/2,0,-d/2),local(c,r,f,w/2,0,d/2),local(c,r,f,-w/2,0,d/2)],C.cream);return{c,f,r}}
function tramHuong(j){const a=pop(.17,j);if(!a)return;const B=baseAt(.17,10.2,8.4,5.2),core=add(B.c,mul(B.f,.15));box(core,B.r,B.f,.95,5.4,.9,C.glass,a);for(let i=0;i<5;i++){const x=(i-2)*.48,pc=add(B.c,mul(B.r,x));const h=5*a;face([local(pc,B.r,B.f,-.55,.7*a,0),local(pc,B.r,B.f,.55,.7*a,0),local(pc,B.r,B.f,.25,3.3*a,0),local(pc,B.r,B.f,0,h,0),local(pc,B.r,B.f,-.25,3.3*a,0)],C.white)}}
function honChong(j){const a=pop(.36,j);if(!a)return;const B=baseAt(.36,11.5,9,5.2),q=[[-2,2.8,1.8,2.2],[-.4,3.2,2.0,3.0],[1.5,2.5,1.7,2.1],[2.5,2.1,1.5,2.4]];q.forEach((z,i)=>{const cc=local(B.c,B.r,B.f,z[0],0,(i%2)*.5);taper(cc,B.r,B.f,z[1],z[2],z[1]*.72,z[2]*.72,z[3],i%2?C.rock2:C.rock,a)});taper(local(B.c,B.r,B.f,.4,2.2*a,-.3),B.r,B.f,2.2,1.6,1.8,1.4,1.35,C.rock,a)}
function tower(c,r,f,w,h,a){box(c,r,f,w,h*.55,w*.75,C.brick,a);let y=h*.55*a;for(let k=0;k<2;k++){const cc=add(c,P(0,y,0)),ww=w*(1-k*.15);taper(cc,r,f,ww,ww*.78,ww*.7,ww*.58,h*.15,C.brick2,a);y+=h*.14*a}pyramid(add(c,P(0,y,0)),r,f,w*.5,w*.38,h*.16,C.brick,a)}
function poNagar(j){const a=pop(.59,j);if(!a)return;const B=baseAt(.59,10.8,10,6),hill=add(B.c,mul(B.r,.4));pyramid(hill,B.r,B.f,8.4,5.2,2.3,C.hill,a);const b=add(hill,P(0,1.55*a,0));tower(add(b,mul(B.f,-.4)),B.r,B.f,1.7,4.8,a);tower(add(add(b,mul(B.r,-2)),mul(B.f,.6)),B.r,B.f,1.2,3.5,a);tower(add(add(b,mul(B.r,2)),mul(B.f,.55)),B.r,B.f,1.15,3.2,a)}
function bridge(){const {p,f,r}=basis(.73);for(const off of[-3.5,3.5])for(let z=-7;z<=7;z+=2.5){const c=add(add(p,mul(r,off)),mul(f,z));box(add(c,P(0,.18,0)),r,f,.09,.7,.09,C.city2)}}
function longSon(j){const a=pop(.91,j,.12);if(!a)return;const B=baseAt(.91,15.5,12.5,6.8),h=add(B.c,mul(B.r,.6));pyramid(h,B.r,B.f,10.5,6,5,C.hill,a);const b=add(add(h,mul(B.r,2)),P(0,3.1*a,0));taper(b,B.r,B.f,2.8,2,2.3,1.7,.75,C.white,a);const torso=add(b,P(0,.58*a,0));taper(torso,B.r,B.f,1.3,1,.9,.7,1.45,C.white,a);box(add(torso,P(0,1.5*a,0)),B.r,B.f,.62,.62,.62,C.white,a)}
function car(j){const {p,f,r}=basis(j),c=add(p,P(0,.08,0));box(add(c,P(0,.24,0)),r,f,1.9,.46,3.4,C.car);taper(add(add(c,P(0,.62,0)),mul(f,-.25)),r,f,1.4,1.5,1.05,1,.65,C.glass);for(const sx of[-1,1])for(const zz of[-1.1,1])box(local(c,r,f,sx*.96,.15,zz),r,f,.2,.5,.58,C.dark)}
function mountains(){[[20,-.7,-182,22,12],[34,-.9,-225,27,15],[8,-1,-350,30,17]].forEach((m,i)=>pyramid(P(m[0],m[1],m[2]),P(1,0,0),P(0,0,-1),m[3],18,m[4],i%2?C.leaf2:C.hill))}
function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sky);g.addColorStop(.7,C.sky2);g.addColorStop(1,'#e9efe4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const s=ctx.createRadialGradient(W*.78,H*.16,0,W*.78,H*.16,W*.34);s.addColorStop(0,'rgba(255,244,208,.46)');s.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=s;ctx.fillRect(0,0,W,H)}
function drawFaces(){const arr=[];for(const F of faces){const pts=F.points.map(project);if(pts.some(p=>!p))continue;arr.push({F,pts,z:pts.reduce((s,p)=>s+p.z,0)/pts.length})}arr.sort((a,b)=>b.z-a.z);for(const o of arr){ctx.globalAlpha=o.F.alpha;ctx.fillStyle=o.F.color;ctx.beginPath();ctx.moveTo(o.pts[0].x,o.pts[0].y);for(let i=1;i<o.pts.length;i++)ctx.lineTo(o.pts[i].x,o.pts[i].y);ctx.closePath();ctx.fill()}ctx.globalAlpha=1}
function updateUI(j){const idx=j<.28?0:j<.44?1:j<.54?2:j<.68?3:j<.82?4:5;place.textContent=chapters[idx][0];meta.textContent=chapters[idx][1];rails.forEach((e,i)=>e.classList.toggle('active',i===idx));bar.style.width=(j*100).toFixed(1)+'%'}
function render(){try{const p=progress(),j=clamp((p-.015)/.97,0,1);setupCam(j);sky();faces=[];terrain();mountains();road();streets();tramHuong(j);honChong(j);poNagar(j);bridge();longSon(j);car(j);drawFaces();updateUI(j);errorEl.style.display='none'}catch(err){console.error(err);errorEl.textContent='Render error: '+(err&&err.message?err.message:String(err));errorEl.style.display='block';ctx.fillStyle='#bfe8f3';ctx.fillRect(0,0,W,H)}requestAnimationFrame(render)}
render();
})();
</script>
</body>
