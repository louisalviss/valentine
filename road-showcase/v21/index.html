<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#c9edf2"/>
<title>Nha Trang — Low-poly Pop-up Road Journey v21</title>
<style>
:root{--ink:#183340;--glass:rgba(247,243,233,.74);--accent:#e87857}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:#c9edf2;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:pan-y;background:radial-gradient(circle at 76% 16%,rgba(255,245,216,.72),transparent 26%),linear-gradient(180deg,#c8edf3 0%,#e9f3ed 68%,#e9e3d5 100%)}#fallback{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#c9edf2 0%,#eef4e9 66%,#ded2bd 100%)}.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 48%,rgba(18,45,57,.06) 78%,rgba(18,45,57,.13) 125%)}.ui{position:fixed;inset:0;z-index:3;pointer-events:none}.top{position:absolute;left:0;right:0;top:0;padding:calc(15px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:9px;font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(24,51,64,.78)}.brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(232,120,87,.12)}.counter{font-size:8px;font-weight:700;letter-spacing:.16em;color:rgba(24,51,64,.48)}.chapter{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));padding:9px 11px;border-radius:12px;background:var(--glass);border:1px solid rgba(255,255,255,.74);backdrop-filter:blur(14px) saturate(1.04);-webkit-backdrop-filter:blur(14px) saturate(1.04);box-shadow:0 12px 36px rgba(32,62,73,.11);min-width:178px}.chapter small{display:block;font-size:7px;font-weight:800;letter-spacing:.19em;color:#8d9794}.chapter b{display:block;margin-top:3px;font-size:14px;letter-spacing:-.025em}.chapter span{display:block;margin-top:2px;font-size:8px;letter-spacing:.01em;color:#66777a}.progress{position:absolute;left:16px;right:16px;top:calc(44px + env(safe-area-inset-top));height:1px;background:rgba(24,51,64,.13)}.progress i{display:block;width:0;height:100%;background:rgba(24,51,64,.62)}.dots{position:absolute;right:16px;top:calc(38px + env(safe-area-inset-top));display:flex;gap:7px}.dots i{width:4px;height:4px;border-radius:50%;background:rgba(24,51,64,.18);transition:.2s}.dots i.active{background:var(--accent);transform:scale(1.6)}#err{display:none;position:fixed;left:12px;right:12px;top:72px;z-index:10;padding:10px;border-radius:10px;background:rgba(90,20,20,.9);color:white;font:12px/1.4 monospace;pointer-events:none}main{position:relative;z-index:2;pointer-events:none}section{height:145vh}@media(min-width:800px){.top{padding:calc(18px + env(safe-area-inset-top)) 26px 0}.progress{left:26px;right:26px}.dots{right:26px}.chapter{left:26px;bottom:calc(22px + env(safe-area-inset-bottom));padding:11px 14px;min-width:220px}.chapter b{font-size:16px}.chapter span{font-size:9px}}@media(prefers-reduced-motion:reduce){.vignette{display:none}}
</style>
</head>
<body>
<div id="fallback"></div><canvas id="gl"></canvas><div class="vignette"></div>
<div id="err"></div>
<div class="ui">
  <div class="top"><div class="brand"><i></i><span>Nha Trang / Pop-up Road Journey</span></div><div class="counter" id="count">01 / 06</div></div>
  <div class="progress"><i id="bar"></i></div><div class="dots" id="dots"></div>
  <div class="chapter"><small>NOW PASSING</small><b id="place">Trần Phú · Trầm Hương</b><span id="meta">Biển bên phải · Quảng trường 2/4</span></div>
</div>
<main><section></section><section></section><section></section><section></section><section></section><section></section></main>
<script src="../v20/engine.js"></script>
<script src="scene.js"></script>
</body>
</html>
