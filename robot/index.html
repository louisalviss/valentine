<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your Robots — Premium Selection UI</title>
  <style>
    :root{
      --bg:#eef1f4;
      --bg2:#dfe4e9;
      --panel:rgba(255,255,255,.66);
      --panel-strong:rgba(255,255,255,.82);
      --line:#d2d8de;
      --text:#171c21;
      --muted:#6e7780;
      --ink:#111418;
      --soft-shadow:0 18px 40px rgba(12,18,24,.08);
      --sel:#fff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
    body{overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:328px 1fr 314px;gap:22px;padding:24px;position:relative}
    .panel{background:linear-gradient(180deg,var(--panel-strong),var(--panel));border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(18px);box-shadow:var(--soft-shadow)}
    .left{padding:18px;border-radius:22px;display:flex;flex-direction:column;min-height:0}
    .logo{display:flex;align-items:center;gap:14px;margin-bottom:18px}
    .logo-mark{width:48px;height:32px;background:#0b1015;position:relative;border-radius:4px}
    .logo-mark:before{content:"";position:absolute;left:11px;top:8px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:20px solid #fff}
    .logo h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.03em}
    .sub{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#9ca4ad;font-weight:700;margin:10px 0 12px}
    .roster{display:grid;gap:12px;overflow:auto;padding-right:2px}
    .item{display:grid;grid-template-columns:86px 1fr;gap:12px;background:rgba(255,255,255,.54);border:1px solid var(--line);padding:10px 12px;cursor:pointer;transition:.2s ease;min-width:0}
    .item:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(16,21,26,.08)}
    .item.active{background:rgba(255,255,255,.92);border-color:#b7c0c8;box-shadow:0 14px 34px rgba(16,21,26,.10)}
    .thumb{height:74px;border:1px solid rgba(0,0,0,.06);background:linear-gradient(180deg,#f8f9fb,#e8edf2);overflow:hidden;display:grid;place-items:center}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .meta{min-width:0;display:flex;flex-direction:column;justify-content:center}
    .meta h3{margin:0 0 4px;font-size:15px;letter-spacing:.02em}
    .meta p{margin:0;color:var(--muted);font-size:12px}
    .add{margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:16px 16px;border:1px solid var(--line);background:rgba(255,255,255,.6)}
    .plus{width:54px;height:54px;display:grid;place-items:center;border:3px solid #131920;background:#fff;font-size:42px;line-height:1}

    .stage{position:relative;overflow:hidden;border-radius:28px;border:1px solid rgba(255,255,255,.78);background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.92),rgba(245,247,249,.94) 22%,rgba(228,233,238,.96) 45%,rgba(212,217,223,1) 82%)}
    .stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 34%,rgba(255,255,255,.95),transparent 26%),linear-gradient(180deg,rgba(255,255,255,.35),transparent 24%);pointer-events:none}
    .topbar{position:absolute;inset:18px 18px auto 18px;display:flex;justify-content:space-between;align-items:center;z-index:4}
    .topbar .hint{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7e8790;font-weight:700}
    .topicons{display:flex;gap:10px}
    .pill{min-width:40px;height:38px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;padding:0 14px;color:#23282e;font-weight:600}
    .stage-ui{position:absolute;inset:0;z-index:3;pointer-events:none}
    .rings span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(109,119,128,.11);border-radius:50%}
    .rings span:nth-child(1){width:58vmin;height:58vmin}
    .rings span:nth-child(2){width:78vmin;height:78vmin;opacity:.7}
    .rings span:nth-child(3){width:98vmin;height:98vmin;opacity:.4}
    .platform{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);width:min(44vw,490px);height:48px;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.92),rgba(221,226,231,.9) 52%,rgba(190,196,202,.8) 68%,rgba(168,174,181,.68) 100%);filter:blur(.15px);box-shadow:0 28px 36px rgba(52,59,67,.18), inset 0 2px 10px rgba(255,255,255,.75)}
    .platform::before{content:"";position:absolute;inset:-14px 22px 18px;border-radius:50%;border:1px solid rgba(94,102,111,.12)}

    .viewer{position:absolute;inset:0;display:grid;place-items:center;z-index:2;overflow:hidden}
    .camera{position:relative;width:min(720px,76%);height:100%;display:flex;align-items:flex-end;justify-content:center;transform-style:preserve-3d}
    .backdrop{position:absolute;inset:0;display:grid;place-items:center;opacity:1;transition:opacity .55s ease, transform .55s ease;will-change:transform,opacity}
    .backdrop img{width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.02)}
    .hero{--mx:0px;--my:0px;position:absolute;bottom:58px;left:50%;transform:translateX(calc(-50% + var(--mx))) translateY(var(--my));width:min(520px,74%);filter:drop-shadow(0 30px 34px rgba(12,18,26,.22));transform-origin:50% 100%;will-change:transform,filter;animation:idleFloat 4.6s ease-in-out infinite}
    .hero img{display:block;width:100%;height:auto;object-fit:contain}

    .backdrop{background:
      radial-gradient(circle at 50% 26%,rgba(255,255,255,.98),transparent 25%),
      linear-gradient(160deg,rgba(255,255,255,.52),rgba(223,228,234,.82));}
    .theme-fighter .backdrop{background:radial-gradient(circle at 50% 30%,#fff 0 16%,#eef1f4 42%,#d7dde3 78%)}
    .theme-berserker .backdrop{background:radial-gradient(circle at 48% 28%,#fff 0 13%,#eee7e7 40%,#d8d2d2 78%)}
    .theme-sentinel .backdrop{background:radial-gradient(circle at 52% 28%,#fff 0 14%,#e8eef3 42%,#d2dae2 80%)}
    .theme-wanderer .backdrop{background:radial-gradient(circle at 50% 24%,#fff3d4 0 10%,#e9e7df 38%,#d3d8dd 80%)}
    .light-sweep{position:absolute;top:-10%;bottom:-10%;left:-25%;width:22%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.26),rgba(255,255,255,0));transform:skewX(-18deg) translateX(-120%);mix-blend-mode:screen;opacity:.55;animation:sweep 6.6s ease-in-out infinite}
    .status-chip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#66707a;font-weight:700;z-index:4}

    .right{padding:28px 22px 22px;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between}
    .lvlblock{display:flex;align-items:flex-end;gap:14px;margin-bottom:8px}
    .level{margin:0;font-size:94px;line-height:.82;color:#575d64;letter-spacing:-.06em;font-weight:650}
    .leveltag{background:#5a6067;color:#fff;padding:4px 12px;font-size:14px;letter-spacing:.18em;font-weight:700}
    .role{margin:6px 0 2px;font-size:41px;letter-spacing:-.04em;line-height:.92}
    .classline{margin:0 0 20px;color:#646c75;font-size:18px}
    .stat{margin:0 0 18px}
    .statrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
    .bar{height:5px;background:#d0d5da;overflow:hidden}
    .fill{height:100%;background:#151a20;border-radius:999px}
    .skills-title{margin:18px 0 10px;color:#777f88;font-size:14px}
    .skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .skill{aspect-ratio:1;background:#8c9299;border:1px solid #c6ccd1;display:grid;place-items:center;color:#fff;font-size:22px}
    .cta{margin-top:24px;padding:22px 16px;border:4px solid #11161b;background:#8f969d;color:#fff;font-size:32px;letter-spacing:.26em;text-transform:uppercase;display:grid;place-items:center;cursor:pointer;transition:.18s ease;user-select:none}
    .cta:hover{filter:brightness(1.05)}
    .caption{position:absolute;left:26px;bottom:18px;z-index:4;color:#7c858d;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}

    .motion-idle .hero{animation:idleFloat 4.6s ease-in-out infinite}
    .motion-wave .hero{animation:waveMove 3.8s ease-in-out infinite}
    .motion-wave .backdrop{animation:camDrift 5s ease-in-out infinite}
    .motion-turn .hero{animation:turnMove 4.8s ease-in-out infinite}
    .motion-turn .backdrop{animation:camDrift 6s ease-in-out infinite reverse}
    .motion-step .hero{animation:stepMove 3.4s ease-in-out infinite}
    .motion-step .backdrop{animation:pushMove 3.4s ease-in-out infinite}
    .motion-scan .hero{animation:scanMove 4s ease-in-out infinite}
    .motion-horizon .hero{animation:horizonMove 5.2s ease-in-out infinite}

    @keyframes idleFloat{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-50%) translateY(-12px) scale(1.01)}}
    @keyframes waveMove{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg) scale(1)}25%{transform:translateX(-50%) translateY(-10px) rotate(0deg) scale(1.02)}50%{transform:translateX(-50%) translateY(-4px) rotate(1.4deg) scale(1.03)}75%{transform:translateX(-50%) translateY(-10px) rotate(0deg) scale(1.02)}}
    @keyframes turnMove{0%,100%{transform:translateX(-50%) rotateY(0deg) scale(1)}50%{transform:translateX(-50%) rotateY(10deg) scale(1.015)}}
    @keyframes stepMove{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}25%{transform:translateX(-50%) translateY(-8px) translateX(calc(-50% + 12px)) scale(1.02)}50%{transform:translateX(-50%) translateY(-4px) translateX(calc(-50% - 10px)) scale(1.03)}75%{transform:translateX(-50%) translateY(-8px) translateX(calc(-50% + 8px)) scale(1.02)}}
    @keyframes scanMove{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-50%) translateY(-6px) scale(1.08)}}
    @keyframes horizonMove{0%,100%{transform:translateX(-50%) translateY(0) scale(.98)}50%{transform:translateX(-50%) translateY(-10px) scale(1.02)}}
    @keyframes camDrift{0%,100%{transform:scale(1.02) translateX(0)}50%{transform:scale(1.05) translateX(-1.5%)}}
    @keyframes pushMove{0%,100%{transform:scale(1.03)}50%{transform:scale(1.08) translateY(1%)}}
    @keyframes sweep{0%,18%,100%{transform:skewX(-18deg) translateX(-120%)}42%,58%{transform:skewX(-18deg) translateX(620%)}}

    @media (max-width: 1180px){
      body{overflow:auto}
      .app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto minmax(56vh,72vh) auto}
      .stage{min-height:58vh}
      .camera{width:100%}
      .hero{width:min(420px,74vw)}
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel left">
      <div class="logo"><div class="logo-mark"></div><h1>Your Robots</h1></div>
      <div class="sub">Classes S — A</div>
      <div class="roster" id="roster"></div>
      <div class="add"><div><div style="font-size:16px;font-weight:650;letter-spacing:.02em">Add Robots</div></div><div class="plus">+</div></div>
    </section>

    <section class="stage motion-idle" id="stage">
      <div class="topbar">
        <div class="hint">Premium robot viewer · motion enabled</div>
        <div class="topicons"><div class="pill">⎔</div><div class="pill" id="coins">2523</div><div class="pill">⌁</div></div>
      </div>
      <div class="stage-ui">
        <div class="rings"><span></span><span></span><span></span></div>
      </div>
      <div class="viewer">
        <div class="camera">
          <div class="backdrop" id="backdrop"></div>
          <div class="hero" id="hero"><img id="heroImg" src="assets/zenith_cutout.webp" alt="robot hero"><div class="light-sweep"></div></div>
        </div>
      </div>
      <div class="platform"></div>
      <div class="caption">Selection screen · high fidelity concept</div>
      <div class="status-chip" id="statusChip">fighter / wave</div>
    </section>

    <section class="panel right">
      <div>
        <div class="lvlblock"><h2 class="level" id="level">51</h2><div class="leveltag">LEVEL</div></div>
        <h3 class="role" id="role">FIGHTER</h3>
        <p class="classline">Class <span id="classText">S</span></p>
        <div id="stats"></div>
        <div class="skills-title">Skills</div>
        <div class="skills" id="skills"></div>
      </div>
      <div class="cta" id="cta">Start</div>
    </section>
  </div>

  <script>
    const robots = [
      {
        id:'fighter', name:'FIGHTER', serial:'Robot 0440.01', role:'FIGHTER', class:'S', level:51,
        status:'fighter / wave', motion:'wave', coins:2523,
        theme:'fighter', hero:'assets/zenith_cutout.webp',
        stats:{Attack:260, Defence:80, Accuracy:150, Dexterity:220}, skills:['☄','◔','⌬','✹']
      },
      {
        id:'berserker', name:'BERSERKER', serial:'Robot 2300.10', role:'BERSERKER', class:'S', level:64,
        status:'berserker / step', motion:'step', coins:2537,
        theme:'berserker', hero:'assets/zenith_cutout.webp',
        stats:{Attack:320, Defence:92, Accuracy:112, Dexterity:142}, skills:['✶','⚔','◈','⬡']
      },
      {
        id:'sentinel', name:'SENTINEL', serial:'Robot 1747.12', role:'SENTINEL', class:'A', level:44,
        status:'sentinel / scan', motion:'scan', coins:2492,
        theme:'sentinel', hero:'assets/zenith_cutout.webp',
        stats:{Attack:180, Defence:170, Accuracy:138, Dexterity:126}, skills:['◎','⟁','◉','✦']
      },
      {
        id:'wanderer', name:'WANDERER', serial:'Robot 3018.21', role:'WANDERER', class:'A', level:58,
        status:'wanderer / horizon', motion:'horizon', coins:2531,
        theme:'wanderer', hero:'assets/zenith_cutout.webp',
        stats:{Attack:230, Defence:104, Accuracy:160, Dexterity:188}, skills:['△','✺','◌','⟡']
      }
    ];

    const el = {
      roster: document.getElementById('roster'),
      stage: document.getElementById('stage'),
      heroImg: document.getElementById('heroImg'),
      level: document.getElementById('level'),
      role: document.getElementById('role'),
      classText: document.getElementById('classText'),
      stats: document.getElementById('stats'),
      skills: document.getElementById('skills'),
      statusChip: document.getElementById('statusChip'),
      coins: document.getElementById('coins'),
      cta: document.getElementById('cta')
    };
    let active = 'fighter';

    function renderRoster(){
      el.roster.innerHTML = robots.map(r => `
        <div class="item ${r.id===active?'active':''}" data-id="${r.id}">
          <div class="thumb"><img src="${r.hero}" alt="${r.name}"></div>
          <div class="meta"><h3>${r.name}</h3><p>${r.serial}</p></div>
        </div>`).join('');
      [...el.roster.querySelectorAll('.item')].forEach(item => item.addEventListener('click',()=>setRobot(item.dataset.id)));
    }

    function statBar(name,val){
      return `<div class="stat"><div class="statrow"><span>${name}</span><strong>${val}</strong></div><div class="bar"><div class="fill" style="width:${Math.min(val/3.4,100)}%"></div></div></div>`;
    }

    function setRobot(id){
      active = id;
      const r = robots.find(x=>x.id===id);
      renderRoster();
      el.level.textContent = r.level;
      el.role.textContent = r.role;
      el.classText.textContent = r.class;
      el.statusChip.textContent = r.status;
      el.coins.textContent = r.coins;
      el.heroImg.style.opacity = '0';
      setTimeout(()=>{
        el.heroImg.src = r.hero;
        el.heroImg.style.opacity = '1';
      },160);
      el.stats.innerHTML = Object.entries(r.stats).map(([k,v])=>statBar(k,v)).join('');
      el.skills.innerHTML = r.skills.map(s=>`<div class="skill">${s}</div>`).join('');
      el.stage.className = 'stage motion-' + r.motion + ' theme-' + r.theme;
    }

    renderRoster();
    setRobot(active);

    const sequence = ['fighter','berserker','sentinel','wanderer'];
    let idx = 0;
    el.cta.addEventListener('click',()=>{
      idx = (sequence.indexOf(active)+1) % sequence.length;
      setRobot(sequence[idx]);
    });

    // subtle pointer parallax on desktop
    const hero = document.getElementById('hero');
    const backdrop = document.getElementById('backdrop');
    el.stage.addEventListener('pointermove',(e)=>{
      const rect = el.stage.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      hero.style.setProperty('--mx', `${px*10}px`); hero.style.setProperty('--my', `${py*6}px`);
    });
    el.stage.addEventListener('pointerleave',()=>{
      hero.style.removeProperty('--mx'); hero.style.removeProperty('--my');
    });
  </script>
</body>
</html>
