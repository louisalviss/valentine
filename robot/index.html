<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot 3D Hero — Layered Depth</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 50% 18%, #ffffff 0%, #f3f5f8 28%, #e4e8ed 62%, #d3d9e0 100%);
    color:#11161b;
  }
  #app{position:fixed;inset:0}
  .overlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.75),transparent 24%),linear-gradient(180deg,rgba(255,255,255,.20),transparent 20%)}
  .rings span{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);border:1px solid rgba(96,108,120,.10);border-radius:50%}
  .rings span:nth-child(1){width:min(58vmin,640px);height:min(58vmin,640px)}
  .rings span:nth-child(2){width:min(76vmin,840px);height:min(76vmin,840px);opacity:.72}
  .rings span:nth-child(3){width:min(92vmin,980px);height:min(92vmin,980px);opacity:.46}
  .top{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none;color:#72808b;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .pill{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px)}
  .bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px);color:#66737e;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
  .hint{position:fixed;left:22px;bottom:18px;z-index:10;color:#78848e;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay rings"><span></span><span></span><span></span></div>
<div class="top"><div>Robot Hero 3D</div><div class="pill" id="state">Drag / touch to rotate · tap for spin</div></div>
<div class="hint">Layered 2.5D depth from your exact robot image</div>
<div class="bottom">Interactive robot showcase</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(() => {
  const mount = document.getElementById('app');
  const state = document.getElementById('state');
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.8, 8.2);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xc4ccd3, 2.2));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(4,6,6); scene.add(key);
  const fill = new THREE.PointLight(0xffffff, 8, 24); fill.position.set(-3,2,4.5); scene.add(fill);
  const rim = new THREE.PointLight(0xc6d0db, 7, 24); rim.position.set(0,3,-5); scene.add(rim);

  const floor = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.08 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -4.0;
  scene.add(floor);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(2.5, 64), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.22 }));
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = -3.99;
  scene.add(glow);

  const loader = new THREE.TextureLoader();
  Promise.all([0,1,2,3,4,5].map(i => fetch(`assets/robot_b64_${i}.txt`).then(r => r.text())))
    .then(parts => loader.load('data:image/webp;base64,' + parts.join(''), tex => {
    tex.colorSpace = THREE.SRGBColorSpace || undefined;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    const ratio = tex.image.height / tex.image.width;
    const h = 7.6;
    const w = h / ratio;

    const hero = new THREE.Group();
    scene.add(hero);
    hero.position.y = -0.15;

    const geo = new THREE.PlaneGeometry(w, h);
    const depth = 0.14;
    for (let i = 7; i >= 1; i--) {
      const z = -depth * (i / 7);
      const layerMat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: 0.16,
        color: 0x4c535a,
        depthWrite: false
      });
      const layer = new THREE.Mesh(geo, layerMat);
      layer.position.z = z;
      layer.scale.set(1 - i*0.0018, 1 - i*0.0018, 1);
      hero.add(layer);
    }

    const backMat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, color:0x1b2026, opacity:0.88, side:THREE.DoubleSide });
    const back = new THREE.Mesh(geo, backMat);
    back.position.z = -depth - 0.015;
    back.rotation.y = Math.PI;
    hero.add(back);

    const frontMat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:true });
    const front = new THREE.Mesh(geo, frontMat);
    front.position.z = 0.02;
    hero.add(front);

    const highlight = new THREE.Mesh(new THREE.PlaneGeometry(w*0.35, h*0.92), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.05, depthWrite:false }));
    highlight.position.set(-w*0.12, h*0.01, 0.035);
    highlight.rotation.z = -0.10;
    hero.add(highlight);

    let targetY = 0, currentY = 0;
    let targetX = 0, currentX = 0;
    let dragging = false, startX = 0, startY = 0, baseY = 0, baseX = 0;
    let spinUntil = 0;

    function setState(text){ state.textContent = text; }
    function down(x,y){ dragging = true; startX = x; startY = y; baseY = targetY; baseX = targetX; setState('Rotating'); }
    function move(x,y){
      if(dragging){
        targetY = THREE.MathUtils.clamp(baseY + (x-startX)*0.008, -0.7, 0.7);
        targetX = THREE.MathUtils.clamp(baseX + (y-startY)*0.004, -0.22, 0.22);
      }
    }
    function up(){ dragging = false; setState('Drag / touch to rotate · tap for spin'); }
    function spin(){ spinUntil = performance.now() + 1800; setState('Presentation spin'); setTimeout(() => { if(!dragging) setState('Drag / touch to rotate · tap for spin'); }, 1850); }

    renderer.domElement.addEventListener('pointerdown', e => down(e.clientX, e.clientY));
    window.addEventListener('pointermove', e => move(e.clientX, e.clientY));
    window.addEventListener('pointerup', up);
    renderer.domElement.addEventListener('click', spin);
    renderer.domElement.addEventListener('touchstart', e => { const t = e.touches[0]; if(!t) return; down(t.clientX, t.clientY); }, { passive:true });
    renderer.domElement.addEventListener('touchmove', e => { const t = e.touches[0]; if(!t) return; move(t.clientX, t.clientY); }, { passive:true });
    renderer.domElement.addEventListener('touchend', up);

    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const now = performance.now();
      currentY += (targetY - currentY) * 0.08;
      currentX += (targetX - currentX) * 0.08;
      hero.position.y = -0.15 + Math.sin(t*1.4)*0.06;
      hero.rotation.y = currentY;
      hero.rotation.x = currentX;
      hero.rotation.z = Math.sin(t*0.8)*0.01;
      if(now < spinUntil){
        const p = 1 - ((spinUntil - now) / 1800);
        hero.rotation.y = currentY + Math.sin(p * Math.PI) * 0.55;
      }
      renderer.render(scene, camera);
    }
    animate();
    }, undefined, () => { state.textContent = 'Image load error'; });
  }).catch(() => { state.textContent = 'Image load error'; });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
