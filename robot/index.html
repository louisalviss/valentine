<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Robot 3D — Interactive</title>
<style>
  :root{
    --bg1:#f4f6f8;
    --bg2:#dfe5ea;
    --ink:#11151a;
    --muted:#74808a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;
    background:radial-gradient(circle at 50% 20%, #ffffff 0%, var(--bg1) 28%, var(--bg2) 72%, #cfd6dd 100%);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
  }
  #app{position:fixed;inset:0}
  .overlay{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 50% 28%, rgba(255,255,255,.72), transparent 26%),
      linear-gradient(180deg, rgba(255,255,255,.28), transparent 24%);
  }
  .rings span{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    border:1px solid rgba(80,92,104,.09);border-radius:50%;
  }
  .rings span:nth-child(1){width:min(62vmin,620px);height:min(62vmin,620px)}
  .rings span:nth-child(2){width:min(78vmin,780px);height:min(78vmin,780px);opacity:.75}
  .rings span:nth-child(3){width:min(96vmin,960px);height:min(96vmin,960px);opacity:.45}
  .header{
    position:fixed;left:22px;top:18px;right:22px;display:flex;justify-content:space-between;align-items:center;
    font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);pointer-events:none;
  }
  .pill{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.68);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px)}
  .footer{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;
    background:rgba(255,255,255,.74);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px);
    color:#67727d;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;
  }
  .hint{
    position:fixed;left:22px;bottom:18px;color:#7b8690;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;
  }
  canvas{display:block;width:100%;height:100%}
  @media (max-width:700px){
    .header{font-size:10px;letter-spacing:.12em}
    .footer,.hint{font-size:10px;letter-spacing:.1em}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay rings"><span></span><span></span><span></span></div>
<div class="header">
  <div>Interactive 3D Robot</div>
  <div class="pill" id="modeTag">Idle · drag / touch / tap</div>
</div>
<div class="hint">Drag to rotate · tap/click to wave</div>
<div class="footer">Premium concept robot · 3D only</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(() => {
  const mount = document.getElementById('app');
  const modeTag = document.getElementById('modeTag');

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(33, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.5, 8.6);

  const hemi = new THREE.HemisphereLight(0xffffff, 0xc4ccd4, 2.1);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(4,6,5); scene.add(key);
  const fill = new THREE.PointLight(0xffffff, 8, 20); fill.position.set(-3,2.6,4.8); scene.add(fill);
  const rim = new THREE.PointLight(0xbfc8d2, 7, 20); rim.position.set(0,3,-6); scene.add(rim);

  const floorShadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.9, 48),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.10})
  );
  floorShadow.rotation.x = -Math.PI/2;
  floorShadow.position.y = -2.08;
  scene.add(floorShadow);

  const floorGlow = new THREE.Mesh(
    new THREE.CircleGeometry(2.1, 56),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.24})
  );
  floorGlow.rotation.x = -Math.PI/2;
  floorGlow.position.y = -2.07;
  scene.add(floorGlow);

  const whiteMat = new THREE.MeshStandardMaterial({ color:0xf6f7f8, roughness:0.34, metalness:0.32 });
  const darkMat  = new THREE.MeshStandardMaterial({ color:0x171c22, roughness:0.55, metalness:0.18 });
  const trimMat  = new THREE.MeshStandardMaterial({ color:0x59626c, roughness:0.36, metalness:0.44 });
  const eyeMat   = new THREE.MeshStandardMaterial({ color:0xff493f, emissive:0x7a0500, emissiveIntensity:2.4, roughness:0.14, metalness:0.1 });

  const robot = new THREE.Group();
  scene.add(robot);
  robot.position.y = -0.4;

  const body = new THREE.Group();
  robot.add(body);

  function sphere(r, m){ return new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), m); }
  function box(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); }
  function cyl(r1,r2,h,m,seg=28){ return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg), m); }
  function torus(R,r,m,arc=Math.PI*2){ return new THREE.Mesh(new THREE.TorusGeometry(R,r,20,42,arc), m); }
  function capsule(radius,length,m){
    const g = new THREE.Group();
    const c = cyl(radius, radius, length, m, 28);
    const s1 = sphere(radius, m);
    const s2 = sphere(radius, m);
    s1.position.y = length/2; s2.position.y = -length/2;
    g.add(c,s1,s2);
    return g;
  }

  const torso = new THREE.Group();
  body.add(torso);
  torso.position.y = 0.1;

  const chest = box(1.9, 1.7, 0.98, whiteMat);
  chest.position.set(0, 0.8, 0);
  torso.add(chest);

  const chestArch = cyl(0.78, 0.64, 0.46, trimMat, 32);
  chestArch.rotation.z = Math.PI/2;
  chestArch.position.set(0, 0.1, 0.32);
  chestArch.scale.z = 0.48;
  torso.add(chestArch);

  const waist = box(1.05, 0.58, 0.64, trimMat);
  waist.position.set(0, -0.08, 0);
  torso.add(waist);

  const cowl = torus(1.02, 0.30, darkMat, Math.PI*1.94);
  cowl.rotation.x = Math.PI/2;
  cowl.position.set(0, 1.43, 0.05);
  torso.add(cowl);

  const cowlDrop = cyl(0.92, 1.08, 0.62, darkMat, 32);
  cowlDrop.position.set(0, 1.16, 0.02);
  torso.add(cowlDrop);

  const neck = new THREE.Group();
  neck.position.set(0, 2.02, 0);
  torso.add(neck);

  const head = new THREE.Group();
  head.position.y = 0.36;
  neck.add(head);

  const skull = box(0.9, 1.04, 0.82, whiteMat);
  skull.position.set(0, 0.06, 0);
  head.add(skull);

  const helmetTop = box(0.78, 0.24, 0.74, whiteMat);
  helmetTop.position.set(0, 0.53, -0.02);
  head.add(helmetTop);

  const face = box(0.56, 0.74, 0.14, trimMat);
  face.position.set(0, -0.02, 0.40);
  head.add(face);

  const nose = box(0.12, 0.30, 0.06, darkMat);
  nose.position.set(0, -0.02, 0.47);
  head.add(nose);

  const jaw = box(0.40, 0.14, 0.08, darkMat);
  jaw.position.set(0, -0.28, 0.46);
  head.add(jaw);

  const crown = box(0.16, 0.06, 0.16, darkMat);
  crown.position.set(0, 0.53, 0.39);
  head.add(crown);

  const eyeL = sphere(0.075, eyeMat); eyeL.position.set(-0.16, 0.09, 0.43); head.add(eyeL);
  const eyeR = sphere(0.075, eyeMat); eyeR.position.set( 0.16, 0.09, 0.43); head.add(eyeR);

  function buildArm(side){
    const sign = side;
    const root = new THREE.Group();
    root.position.set(0.98*sign, 1.66, 0.02);
    torso.add(root);

    const shoulder = sphere(0.30, whiteMat);
    shoulder.scale.set(1.25, 1.1, 1.25);
    shoulder.position.x = 0.14*sign;
    root.add(shoulder);

    const upper = new THREE.Group();
    upper.position.x = 0.34*sign;
    root.add(upper);

    const upperMesh = capsule(0.17, 0.86, whiteMat);
    upperMesh.position.y = -0.54;
    upper.add(upperMesh);

    const elbow = new THREE.Group();
    elbow.position.y = -1.05;
    upper.add(elbow);
    const elbowJoint = sphere(0.15, trimMat); elbow.add(elbowJoint);

    const fore = capsule(0.14, 0.82, whiteMat);
    fore.position.y = -0.50;
    elbow.add(fore);

    const wrist = new THREE.Group();
    wrist.position.y = -0.98;
    elbow.add(wrist);
    const hand = box(0.24, 0.30, 0.26, whiteMat);
    hand.position.y = -0.10;
    wrist.add(hand);

    return {root, upper, elbow, wrist};
  }
  const armL = buildArm(-1);
  const armR = buildArm(1);

  let drag = false;
  let startX = 0, startRot = 0;
  let targetRotY = 0;
  let pointerX = 0, pointerY = 0;
  let waveUntil = 0;

  function setMode(t){ modeTag.textContent = t; }
  setMode('Idle · drag / touch / tap');

  function onPointerDown(e){
    drag = true;
    startX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
    startRot = targetRotY;
  }
  function onPointerMove(e){
    const x = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
    const y = e.clientY ?? (e.touches && e.touches[0].clientY) ?? 0;
    pointerX = (x / window.innerWidth) * 2 - 1;
    pointerY = (y / window.innerHeight) * 2 - 1;
    if(drag){
      const dx = x - startX;
      targetRotY = startRot + dx * 0.01;
      setMode('Rotate · release to idle');
    }
  }
  function endDrag(){
    if(drag){ drag = false; setMode('Idle · drag / touch / tap'); }
  }
  function triggerWave(){
    waveUntil = performance.now() + 1500;
    setMode('Wave · tap again anytime');
    clearTimeout(triggerWave._timer);
    triggerWave._timer = setTimeout(() => { if(!drag) setMode('Idle · drag / touch / tap'); }, 1600);
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('click', triggerWave);
  renderer.domElement.addEventListener('touchstart', (e)=>{ onPointerDown(e); triggerWave(); }, {passive:true});
  renderer.domElement.addEventListener('touchmove', onPointerMove, {passive:true});
  renderer.domElement.addEventListener('touchend', endDrag);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const ms = performance.now();

    body.position.y = Math.sin(t*1.6) * 0.035;
    torso.rotation.z = Math.sin(t*0.9) * 0.012;
    torso.rotation.x = Math.sin(t*0.8) * 0.014;
    robot.rotation.y += (targetRotY - robot.rotation.y) * 0.08;

    head.rotation.y = THREE.MathUtils.clamp(pointerX * 0.32, -0.35, 0.35) + Math.sin(t*0.6)*0.04;
    head.rotation.x = THREE.MathUtils.clamp(pointerY * -0.12, -0.10, 0.12) + Math.sin(t*0.7)*0.015;

    armL.upper.rotation.x = Math.sin(t*0.9) * 0.05;
    armL.elbow.rotation.z = 0.08;
    armR.upper.rotation.x = Math.sin(t*0.85) * -0.04;
    armR.elbow.rotation.z = -0.08;
    armR.wrist.rotation.y = 0;

    if(ms < waveUntil){
      const p = 1 - ((waveUntil - ms) / 1500);
      armR.upper.rotation.x = -0.98 + Math.sin(p * Math.PI * 6) * 0.10;
      armR.upper.rotation.z = -0.10;
      armR.elbow.rotation.z = -1.18 + Math.sin(p * Math.PI * 6) * 0.08;
      armR.wrist.rotation.y = Math.sin(p * Math.PI * 12) * 0.48;
      head.rotation.y += 0.18;
    }

    renderer.render(scene, camera);
  }
  animate();

  function resize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
