<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kaizen Robot Bust — 3D Prototype</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:radial-gradient(circle at 50% 18%, #ffffff 0%, #f4f6f8 26%, #e4e9ee 64%, #d4dbe2 100%);
    color:#11161b;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.70),transparent 25%),linear-gradient(180deg,rgba(255,255,255,.18),transparent 20%)}
  .rings span{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);border:1px solid rgba(96,108,120,.10);border-radius:50%}
  .rings span:nth-child(1){width:min(60vmin,640px);height:min(60vmin,640px)}
  .rings span:nth-child(2){width:min(78vmin,840px);height:min(78vmin,840px);opacity:.72}
  .rings span:nth-child(3){width:min(96vmin,1040px);height:min(96vmin,1040px);opacity:.44}
  .top{position:fixed;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;align-items:center;z-index:10;color:#72808b;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
  .pill{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px)}
  .hint{position:fixed;left:22px;bottom:18px;z-index:10;color:#7a8791;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
  .bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.74);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px);color:#66737e;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay rings"><span></span><span></span><span></span></div>
<div class="top"><div>Kaizen Robot Bust</div><div class="pill" id="state">Drag / touch to rotate · tap to nod</div></div>
<div class="hint">Prototype 3D bust based on your robot image</div>
<div class="bottom">True 3D geometry · upper-body first</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(()=>{
  const mount = document.getElementById('app');
  const state = document.getElementById('state');
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(31, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.2, 8.4);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xcad2da, 2.35));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4,7,6); scene.add(key);
  const fill = new THREE.PointLight(0xffffff, 9, 26); fill.position.set(-3.5,2.5,5.2); scene.add(fill);
  const rim = new THREE.PointLight(0xc3ced9, 8, 26); rim.position.set(0,4,-5.4); scene.add(rim);

  const mats = {
    white: new THREE.MeshStandardMaterial({color:0xf4f6f7, roughness:0.34, metalness:0.28}),
    dark:  new THREE.MeshStandardMaterial({color:0x191e24, roughness:0.56, metalness:0.18}),
    gray:  new THREE.MeshStandardMaterial({color:0x565f68, roughness:0.34, metalness:0.44}),
    red:   new THREE.MeshStandardMaterial({color:0xff5a50, emissive:0x8f140f, emissiveIntensity:2.4, roughness:0.12, metalness:0.08}),
  };

  const robot = new THREE.Group();
  scene.add(robot);
  robot.position.y = -1.55;

  function sphere(r, m){ return new THREE.Mesh(new THREE.SphereGeometry(r, 30, 22), m); }
  function box(w,h,d,m){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); }
  function cyl(r1,r2,h,m,s=28){ return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s), m); }
  function torus(R,r,m,a=Math.PI*2){ return new THREE.Mesh(new THREE.TorusGeometry(R,r,18,42,a), m); }
  function capsule(rad,len,m){
    const g = new THREE.Group();
    const c = cyl(rad, rad, len, m, 26);
    const s1 = sphere(rad, m), s2 = sphere(rad, m);
    s1.position.y = len/2; s2.position.y = -len/2;
    g.add(c,s1,s2); return g;
  }

  const torso = new THREE.Group();
  robot.add(torso);
  torso.position.y = 0;

  const chestMain = box(2.45, 1.75, 1.10, mats.white);
  chestMain.position.set(0, 0.55, 0);
  chestMain.scale.set(1,1,0.88);
  torso.add(chestMain);

  const lowerArc = cyl(0.98, 0.78, 0.52, mats.gray, 34);
  lowerArc.rotation.z = Math.PI/2;
  lowerArc.position.set(0, -0.15, 0.42);
  lowerArc.scale.z = 0.48;
  torso.add(lowerArc);

  const waist = box(1.34, 0.56, 0.74, mats.gray);
  waist.position.set(0, -0.35, 0.02);
  torso.add(waist);

  const pelvisLip = box(1.04,0.14,0.68,mats.dark);
  pelvisLip.position.set(0,-0.62,0.06);
  torso.add(pelvisLip);

  const cowl = torus(1.22, 0.34, mats.dark, Math.PI*1.90);
  cowl.rotation.x = Math.PI/2;
  cowl.position.set(0, 1.54, 0.04);
  torso.add(cowl);

  const cowlDrop = cyl(1.00, 1.22, 0.84, mats.dark, 34);
  cowlDrop.position.set(0, 1.08, 0.02);
  torso.add(cowlDrop);

  const drape = box(1.74, 0.78, 0.26, mats.dark);
  drape.position.set(0.18, 0.94, 0.48);
  drape.rotation.z = -0.28;
  drape.rotation.y = -0.18;
  torso.add(drape);

  const shoulderL = new THREE.Group();
  shoulderL.position.set(-1.42, 1.02, 0.02);
  torso.add(shoulderL);
  const shoulderR = shoulderL.clone(); shoulderR.position.x = 1.42; torso.add(shoulderR);

  function buildShoulder(root, side){
    const s = side;
    const cap = sphere(0.48, mats.white);
    cap.scale.set(1.14, 0.92, 1.08);
    root.add(cap);
    const armBase = capsule(0.34, 0.72, mats.white);
    armBase.position.set(0.18*s, -0.68, 0.02);
    armBase.rotation.z = 0.16*s;
    root.add(armBase);
    const under = box(0.34, 0.44, 0.32, mats.dark);
    under.position.set(0.14*s,-0.54,-0.10);
    root.add(under);
  }
  buildShoulder(shoulderL, -1);
  buildShoulder(shoulderR, 1);

  const neck = new THREE.Group();
  neck.position.set(0, 2.12, 0);
  torso.add(neck);
  const neckCore = cyl(0.18, 0.21, 0.40, mats.gray, 24);
  neck.add(neckCore);

  const head = new THREE.Group();
  head.position.y = 0.55;
  neck.add(head);

  const skull = sphere(0.54, mats.white);
  skull.scale.set(0.82, 1.06, 0.88);
  head.add(skull);

  const helmetTop = box(0.76, 0.26, 0.76, mats.white);
  helmetTop.position.set(0, 0.42, -0.02);
  head.add(helmetTop);

  const foreheadSlot = box(0.18, 0.06, 0.12, mats.dark);
  foreheadSlot.position.set(0, 0.48, 0.40);
  head.add(foreheadSlot);

  const faceMask = box(0.64, 0.94, 0.18, mats.white);
  faceMask.position.set(0, -0.02, 0.34);
  head.add(faceMask);

  const noseBridge = box(0.13, 0.38, 0.08, mats.dark);
  noseBridge.position.set(0, -0.02, 0.45);
  head.add(noseBridge);

  const eyeSocketL = box(0.19, 0.14, 0.08, mats.dark);
  eyeSocketL.position.set(-0.18, 0.10, 0.43);
  eyeSocketL.rotation.z = -0.16;
  head.add(eyeSocketL);
  const eyeSocketR = eyeSocketL.clone(); eyeSocketR.position.x = 0.18; eyeSocketR.rotation.z = 0.16; head.add(eyeSocketR);

  const eyeL = sphere(0.08, mats.red); eyeL.position.set(-0.18, 0.10, 0.48); eyeL.scale.z = 0.65; head.add(eyeL);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.18; head.add(eyeR);

  const cheekL = box(0.16, 0.52, 0.24, mats.dark);
  cheekL.position.set(-0.24,-0.05,0.22); cheekL.rotation.z = -0.16; head.add(cheekL);
  const cheekR = cheekL.clone(); cheekR.position.x=0.24; cheekR.rotation.z = 0.16; head.add(cheekR);

  const jawBar = box(0.44, 0.14, 0.10, mats.dark);
  jawBar.position.set(0, -0.34, 0.46);
  head.add(jawBar);

  const chinFrame = box(0.20,0.18,0.08,mats.dark);
  chinFrame.position.set(0,-0.22,0.44); head.add(chinFrame);

  let targetY = 0, currentY = 0;
  let targetX = 0, currentX = 0;
  let dragging = false, startX = 0, startY = 0, baseY = 0, baseX = 0;
  let nodUntil = 0;

  function setState(t){ state.textContent = t; }
  function onDown(x,y){ dragging = true; startX=x; startY=y; baseY=targetY; baseX=targetX; setState('Rotating'); }
  function onMove(x,y){
    if(dragging){
      targetY = THREE.MathUtils.clamp(baseY + (x-startX)*0.008, -0.85, 0.85);
      targetX = THREE.MathUtils.clamp(baseX + (y-startY)*0.004, -0.20, 0.24);
    }
  }
  function onUp(){ dragging = false; setState('Drag / touch to rotate · tap to nod'); }
  function nod(){ nodUntil = performance.now() + 1200; setState('Nod'); setTimeout(() => { if(!dragging) setState('Drag / touch to rotate · tap to nod'); }, 1250); }

  renderer.domElement.addEventListener('pointerdown', e => onDown(e.clientX, e.clientY));
  window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('pointerup', onUp);
  renderer.domElement.addEventListener('click', nod);
  renderer.domElement.addEventListener('touchstart', e => { const t=e.touches[0]; if(!t) return; onDown(t.clientX,t.clientY); }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e => { const t=e.touches[0]; if(!t) return; onMove(t.clientX,t.clientY); }, {passive:true});
  renderer.domElement.addEventListener('touchend', onUp);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const now = performance.now();
    currentY += (targetY - currentY) * 0.08;
    currentX += (targetX - currentX) * 0.08;
    robot.rotation.y = currentY;
    robot.rotation.x = currentX*0.35;
    robot.position.y = -1.55 + Math.sin(t*1.4)*0.05;
    head.rotation.y = Math.sin(t*0.5)*0.04;
    head.rotation.z = Math.sin(t*0.6)*0.01;
    if(now < nodUntil){
      const p = 1 - ((nodUntil - now)/1200);
      head.rotation.x = Math.sin(p*Math.PI)*0.22;
    } else {
      head.rotation.x = Math.sin(t*0.7)*0.018;
    }
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
