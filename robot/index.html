<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>ZENITH PRO — Cinematic Motion</title>
<style>
:root{--gold:#d8ab59;--white:#f4f3ef;--muted:#a9acb2;--p:0}
*{box-sizing:border-box}html,body{margin:0;background:#050608;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}body{overflow-x:hidden}.page{height:620vh}.stage{position:fixed;inset:0;overflow:hidden;background:#050608}.plate{position:absolute;inset:-3%;width:106%;height:106%;opacity:0;transform:translate3d(0,0,0) scale(1.06);filter:saturate(.9) contrast(1.04);will-change:transform,opacity;transition:opacity .08s linear;background-image:url('zenith-scenes.jpg');background-repeat:no-repeat;background-size:auto 500vh;background-position-x:center}.plate:nth-child(1){opacity:1;background-position-y:0}.plate:nth-child(2){background-position-y:-100vh}.plate:nth-child(3){background-position-y:-200vh}.plate:nth-child(4){background-position-y:-300vh}.plate:nth-child(5){background-position-y:-400vh}.veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,7,.82) 0%,rgba(4,5,7,.48) 29%,rgba(4,5,7,.09) 57%,rgba(4,5,7,.22) 100%),linear-gradient(180deg,rgba(4,5,7,.08),rgba(4,5,7,.03) 56%,rgba(4,5,7,.66));z-index:5;pointer-events:none}.flare{position:absolute;z-index:6;inset:-20%;background:linear-gradient(112deg,transparent 36%,rgba(255,230,181,0) 43%,rgba(255,230,181,.18) 50%,rgba(255,230,181,0) 57%,transparent 64%);transform:translateX(calc((var(--p) * 160%) - 80%));mix-blend-mode:screen;pointer-events:none}.grain{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E")}.nav{position:fixed;left:clamp(20px,4vw,62px);right:clamp(20px,4vw,62px);top:0;z-index:20;height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff17}.brand{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.35em}.brand b{color:var(--gold)}.navsmall{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#d4d5d7;text-transform:uppercase}.copy{position:fixed;z-index:18;left:clamp(24px,6vw,92px);top:50%;transform:translateY(-44%);width:min(620px,44vw)}.eyebrow{font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}.copy h1{font:400 clamp(60px,7.8vw,132px)/.82 Georgia,"Times New Roman",serif;letter-spacing:-.05em;margin:0;text-wrap:balance;text-shadow:0 8px 30px #0008}.copy p{font-size:clamp(15px,1.35vw,20px);line-height:1.58;color:#e8e8e6;max-width:540px;margin:26px 0 0;text-shadow:0 4px 20px #000}.meta{display:flex;gap:32px;margin-top:30px;font:600 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#aeb1b5}.meta b{display:block;color:#fff;font-size:14px;letter-spacing:.03em;margin-top:5px}.rail{position:fixed;right:clamp(20px,3vw,46px);top:50%;transform:translateY(-50%);z-index:20;display:grid;gap:13px}.rail i{width:6px;height:6px;border-radius:50%;border:1px solid #ffffff78;background:transparent;transition:.2s}.rail i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px #d8ab5988}.progress{position:fixed;z-index:21;right:0;top:0;width:2px;height:100%;background:#ffffff10}.progress span{display:block;width:100%;height:calc(var(--p)*100%);background:linear-gradient(#c79240,#f0d298)}.hint{position:fixed;z-index:20;bottom:26px;left:clamp(24px,6vw,92px);font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#c8c9cb;display:flex;align-items:center;gap:12px}.hint:before{content:"";width:42px;height:1px;background:var(--gold)}.cut{position:fixed;inset:0;z-index:15;background:#fff;opacity:0;pointer-events:none}.chaptertag{position:fixed;z-index:19;right:clamp(48px,6vw,96px);bottom:34px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#d9d9d9}@media(max-width:780px){.page{height:560vh}.nav{height:66px}.navsmall{display:none}.copy{left:24px;right:24px;top:auto;bottom:10vh;transform:none;width:auto}.copy h1{font-size:clamp(54px,18vw,86px);line-height:.86}.copy p{font-size:15px;max-width:88vw}.meta{gap:18px}.rail{right:14px}.chaptertag{right:24px;bottom:24px}.hint{display:none}.veil{background:linear-gradient(180deg,rgba(4,5,7,.02) 0%,rgba(4,5,7,.05) 38%,rgba(4,5,7,.72) 69%,rgba(4,5,7,.96) 100%)}.plate{inset:-5%;width:110%;height:110%;background-size:auto 500vh}}
</style>
</head>
<body>
<div class="page" aria-hidden="true"></div>
<div class="stage">
  <div class="plate" role="img" aria-label="Zenith Pro standing in a cinematic showroom"></div>
  <div class="plate" role="img" aria-label="Zenith Pro visor close-up"></div>
  <div class="plate" role="img" aria-label="Zenith Pro in dynamic motion"></div>
  <div class="plate" role="img" aria-label="Zenith Pro precision hand"></div>
  <div class="plate" role="img" aria-label="Zenith Pro facing the city horizon"></div>
  <div class="veil"></div><div class="flare"></div><div class="grain"></div>
</div>
<header class="nav"><div class="brand">ZENITH <b>PRO</b></div><div class="navsmall">Flagship Humanoid · Model 30</div></header>
<section class="copy" id="copy"><div class="eyebrow" id="eyebrow">00 · Arrival</div><h1 id="title">A body<br>built to move.</h1><p id="desc">Một humanoid flagship được thiết kế như một cỗ máy thật — vật liệu, chuyển động và nhận thức hợp nhất trong một hình thể duy nhất.</p><div class="meta" id="meta"><span>Frame<b>Carbon alloy</b></span><span>Vision<b>360° fusion</b></span><span>Control<b>4.2 ms</b></span></div></section>
<div class="rail" id="rail"><i class="on"></i><i></i><i></i><i></i><i></i></div><div class="progress"><span></span></div><div class="hint">Scroll to direct the film</div><div class="chaptertag" id="tag">01 / 05</div><div class="cut" id="cut"></div>
<script>
(()=>{
const plates=[...document.querySelectorAll('.plate')], dots=[...document.querySelectorAll('.rail i')];
const eyebrow=document.getElementById('eyebrow'),title=document.getElementById('title'),desc=document.getElementById('desc'),meta=document.getElementById('meta'),tag=document.getElementById('tag'),cut=document.getElementById('cut');
const chapters=[
 ['00 · Arrival','A body<br>built to move.','Một humanoid flagship được thiết kế như một cỗ máy thật — vật liệu, chuyển động và nhận thức hợp nhất trong một hình thể duy nhất.','<span>Frame<b>Carbon alloy</b></span><span>Vision<b>360° fusion</b></span><span>Control<b>4.2 ms</b></span>'],
 ['01 · Perception','See before<br>you act.','Camera, depth sensing và acoustic mapping tạo thành một world model liên tục. Camera lao vào visor khi bạn scroll.','<span>Depth<b>Millimetric</b></span><span>Latency<b>12 ms</b></span><span>Field<b>360°</b></span>'],
 ['02 · Motion','Power<br>becomes motion.','Scroll tiếp và Zenith chuyển từ trạng thái đứng sang pha chuyển động mạnh. Không loop: timeline đi theo chính vị trí scroll của bạn.','<span>Actuators<b>42</b></span><span>Balance<b>Adaptive</b></span><span>Payload<b>80 kg</b></span>'],
 ['03 · Dexterity','Precision<br>at the fingertips.','Từng ngón tay trở thành một cơ cấu điều khiển độc lập cho những thao tác đòi hỏi lực, độ chính xác và phản hồi xúc giác.','<span>Joints<b>20 hand DOF</b></span><span>Touch<b>Force sensing</b></span><span>Grip<b>Variable</b></span>'],
 ['04 · Horizon','The machine<br>steps forward.','Cảnh cuối mở rộng khỏi showroom. Robot quay lưng về phía đường chân trời — kết thúc như một shot điện ảnh, không phải một trang catalog.','<span>Mode<b>Autonomous</b></span><span>Runtime<b>All day</b></span><span>Status<b>Ready</b></span>']
];
let last=-1, ticking=false;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
function render(){
 const max=Math.max(1,document.documentElement.scrollHeight-innerHeight), p=clamp(scrollY/max); document.documentElement.style.setProperty('--p',p.toFixed(5));
 const s=p*4, idx=Math.min(4,Math.floor(s+1e-6)), local=clamp(s-idx);
 for(let i=0;i<5;i++){
   let o=0;
   if(i===idx) o=1-smooth(clamp((local-.72)/.28));
   else if(i===idx+1) o=smooth(clamp((local-.72)/.28));
   plates[i].style.opacity=o.toFixed(3);
 }
 plates[0].style.transform=`translate3d(${(1-local)*1.5}%,${local*-1.2}%,0) scale(${1.09-local*.055})`;
 plates[1].style.transform=`translate3d(${-3+local*4.5}%,${1-local*.8}%,0) scale(${1.17-local*.07})`;
 plates[2].style.transform=`translate3d(${2-local*3.5}%,${2-local*3}%,0) scale(${1.08+local*.08})`;
 plates[3].style.transform=`translate3d(${-1+local*3}%,${-1+local*1.5}%,0) scale(${1.14-local*.06}) rotate(${-.4+local*.8}deg)`;
 plates[4].style.transform=`translate3d(${2-local*2}%,${1-local*.6}%,0) scale(${1.10-local*.07})`;
 if(idx!==last){
   last=idx; const c=chapters[idx]; eyebrow.textContent=c[0]; title.innerHTML=c[1]; desc.textContent=c[2]; meta.innerHTML=c[3]; tag.textContent=String(idx+1).padStart(2,'0')+' / 05'; dots.forEach((d,j)=>d.classList.toggle('on',j===idx));
   cut.animate([{opacity:.18},{opacity:0}],{duration:260,easing:'ease-out'});
   document.querySelector('.copy').animate([{opacity:.25,transform:'translateY(-41%)'},{opacity:1,transform:'translateY(-44%)'}],{duration:430,easing:'cubic-bezier(.2,.8,.2,1)'});
 }
 ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(render)}},{passive:true});addEventListener('resize',render);render();
})();
</script>
</body>
</html>
