<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kaizen Robot — Final 3D Web</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}body{background:radial-gradient(circle at 50% 18%,#fff 0,#f2f5f7 38%,#dde4ea 78%,#d0d8e0 100%);touch-action:none;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.status{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(0,0,0,.05);border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);color:#687580;font-size:10px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap;pointer-events:none;transition:opacity .35s}.status.hide{opacity:0}.error{color:#9b1d1d}.top{position:fixed;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;pointer-events:none}.chip{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.68);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px);color:#73808b;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.rings span{position:fixed;left:50%;top:56%;transform:translate(-50%,-50%);border:1px solid rgba(96,108,120,.10);border-radius:50%;pointer-events:none}.rings span:nth-child(1){width:min(58vmin,620px);height:min(58vmin,620px)}.rings span:nth-child(2){width:min(76vmin,840px);height:min(76vmin,840px);opacity:.72}.rings span:nth-child(3){width:min(94vmin,1040px);height:min(94vmin,1040px);opacity:.44}
</style>
</head>
<body>
<div id="app"></div>
<div class="rings"><span></span><span></span><span></span></div>
<div class="top"><div class="chip">Kaizen Robot 3D</div><div class="chip">Drag · Pinch · Tap</div></div>
<div class="status" id="status">Loading 3D model…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(()=>{
const status=document.getElementById('status');
if(!window.THREE||!THREE.GLTFLoader){status.textContent='3D engine load error';status.classList.add('error');return}
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8)); renderer.setSize(innerWidth,innerHeight); renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.16; document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100); camera.position.set(0,.25,7.6);
scene.add(new THREE.HemisphereLight(0xffffff,0xd5dce3,2.4));
const key=new THREE.DirectionalLight(0xffffff,2.9); key.position.set(4,7,6); scene.add(key);
const fill=new THREE.PointLight(0xffffff,5.8,20); fill.position.set(-3,2.8,5); scene.add(fill);
const rim=new THREE.PointLight(0xd7e4ef,5.0,18); rim.position.set(1,3,-4); scene.add(rim);
const pivot=new THREE.Group(); scene.add(pivot);
let model=null,targetY=0,targetX=0,currentY=0,currentX=0,drag=false,sx=0,sy=0,by=0,bx=0,moved=false,nodUntil=0,cameraZ=7.6;
const pointers=new Map(); let pinchDist=0,pinchZ=7.6;
new THREE.GLTFLoader().load('robot.glb?v=a35dcd93',g=>{
  model=g.scene;
  const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const s=5.05/Math.max(size.y,1e-6); model.scale.setScalar(s);
  model.traverse(o=>{ if(o.isMesh){ o.frustumCulled=false; if(o.material){ o.material.side=THREE.DoubleSide; if('roughness' in o.material) o.material.roughness=Math.max(.48,o.material.roughness||0); if('metalness' in o.material) o.material.metalness=Math.min(.14,o.material.metalness||0); } } });
  pivot.add(model); status.textContent='Drag to rotate · pinch to zoom · tap to nod'; setTimeout(()=>status.classList.add('hide'),2400);
},undefined,e=>{console.error(e);status.textContent='GLB load error';status.classList.add('error')});
function pointDown(e){renderer.domElement.setPointerCapture?.(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===1){drag=true;moved=false;sx=e.clientX;sy=e.clientY;by=targetY;bx=targetX;} else if(pointers.size===2){const a=[...pointers.values()]; pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); pinchZ=cameraZ;}}
function pointMove(e){ if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinchDist>5){cameraZ=THREE.MathUtils.clamp(pinchZ*pinchDist/d,5.8,9.6); moved=true;} return;} if(!drag) return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>5)moved=true; targetY=THREE.MathUtils.clamp(by+dx*.0062,-.55,.55); targetX=THREE.MathUtils.clamp(bx+dy*.0028,-.16,.18); }
function pointUp(e){ pointers.delete(e.pointerId); if(pointers.size===0){ if(drag&&!moved) nodUntil=performance.now()+900; drag=false; } else if(pointers.size===1){ const a=[...pointers.values()][0]; sx=a.x; sy=a.y; by=targetY; bx=targetX; } }
renderer.domElement.addEventListener('pointerdown',pointDown); renderer.domElement.addEventListener('pointermove',pointMove); renderer.domElement.addEventListener('pointerup',pointUp); renderer.domElement.addEventListener('pointercancel',pointUp);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); cameraZ=THREE.MathUtils.clamp(cameraZ+e.deltaY*.004,5.8,9.6)},{passive:false});
const clock=new THREE.Clock(); function loop(){requestAnimationFrame(loop); const t=clock.getElapsedTime(), now=performance.now(); currentY+=(targetY-currentY)*.09; currentX+=(targetX-currentX)*.09; pivot.rotation.y=currentY+(!drag?Math.sin(t*.45)*.010:0); pivot.rotation.x=currentX+(!drag?Math.sin(t*.62)*.004:0); pivot.position.y=Math.sin(t*1.1)*.02; if(now<nodUntil){const p=1-(nodUntil-now)/900; pivot.rotation.x+=Math.sin(p*Math.PI)*.08;} camera.position.z+=(cameraZ-camera.position.z)*.12; renderer.render(scene,camera);} loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
