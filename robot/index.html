<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#d4d7dc">
<title>KAIZEN — Robot Study</title>
<style>
:root{--bg:#d5d8dd;--ink:#0d1116;--red:#e51f22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:auto}
body{margin:0;min-height:520vh;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow-x:hidden;overscroll-behavior-y:none}
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#b8bbc2 0%,#aeb1b9 43%,#969aa3 100%)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 44%,rgba(20,25,31,.09) 82%,rgba(10,14,19,.17) 120%)}
.floor{position:absolute;left:50%;bottom:2.5vh;width:min(76vw,740px);height:8vh;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(26,30,35,.23) 0%,rgba(26,30,35,.10) 45%,transparent 74%);filter:blur(14px);opacity:.7}
.scene{position:absolute;left:50%;top:50%;width:max(100vw,75vh);height:calc(max(100vw,75vh)*1.333333);transform:translate3d(-50%,-50%,0);perspective:1200px;transform-style:preserve-3d;will-change:transform}
.robot{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.robot img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;object-position:center center;pointer-events:none;-webkit-user-drag:none;user-select:none;will-change:transform,filter}
.base{filter:drop-shadow(0 26px 27px rgba(16,20,24,.19)) saturate(1.02) contrast(1.025)}
.hud{position:fixed;z-index:20;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));font-size:10px;line-height:1;font-weight:760;letter-spacing:.18em;text-transform:uppercase;color:rgba(13,17,22,.77)}
.hud span{display:block;margin-top:7px;font-size:8px;font-weight:650;letter-spacing:.12em;color:rgba(13,17,22,.42)}
.progress{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right));top:50%;display:flex;flex-direction:column;gap:9px;transform:translateY(-50%)}
.dot{width:4px;height:4px;border-radius:50%;background:rgba(13,17,22,.24);transition:transform .25s ease,background .25s ease}.dot.on{background:rgba(13,17,22,.82);transform:scale(1.65)}
.hint{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;font-size:9px;font-weight:730;letter-spacing:.16em;text-transform:uppercase;color:rgba(13,17,22,.46);white-space:nowrap;transition:opacity .4s ease}
.chev{width:7px;height:7px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translateY(-2px)}
section{height:100vh;pointer-events:none}
@media(max-width:820px){
 body{min-height:500vh}.scene{top:50%}.floor{bottom:5vh;width:80vw}.hud{font-size:9px}.hud span{font-size:7px}.progress{right:12px}.hint{bottom:max(15px,env(safe-area-inset-bottom));font-size:8px}
}
@media(max-width:430px) and (max-height:760px){.scene{top:50%}}

@media(min-aspect-ratio:1/1){
 .scene{width:81vh;height:108vh}
 .floor{width:min(46vw,620px);bottom:1.5vh}
 .base{filter:drop-shadow(0 28px 34px rgba(16,20,24,.18)) saturate(1.02) contrast(1.025)}
}
@media(prefers-reduced-motion:reduce){.robot,.robot img,.scene{transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="floor" id="floor"></div>
  <div class="scene" id="scene">
    <div class="robot" id="robot">
      <img class="base" id="base" src="assets/clean_hero.jpg" alt="White humanoid KAIZEN robot with black cowl and red eyes" decoding="sync" fetchpriority="high">
    </div>
  </div>
</div>
<div class="hud">KAIZEN<span>UNIT 01</span></div>
<div class="progress" aria-hidden="true"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
<div class="hint" id="hint"><i class="chev"></i>scroll / swipe</div>
<main aria-hidden="true"><section></section><section></section><section></section><section></section><section></section></main>
<script>
(()=>{
 const scene=document.getElementById('scene'),robot=document.getElementById('robot'),base=document.getElementById('base'),floor=document.getElementById('floor'),hint=document.getElementById('hint'),dots=[...document.querySelectorAll('.dot')];
 let px=0,py=0,dragX=0,dragTarget=0,downX=null,raf=0;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const smooth=(t)=>t*t*(3-2*t);
 const seg=(p,a,b)=>smooth(clamp((p-a)/(b-a),0,1));
 function draw(){
   raf=0;
   const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
   const p=clamp(scrollY/max,0,1);
   const a=seg(p,0,.22),b=seg(p,.18,.45),c=seg(p,.42,.69),d=seg(p,.66,.87),e=seg(p,.84,1);
   dragX+=(dragTarget-dragX)*.075;
   const yaw=(-2.4*a+4.2*b-4.8*c+3.6*d-1.5*e)+(px*2.2)+dragX*.72;
   const pitch=(-.7*a+1.0*b-.5*c+.8*d-.4*e)-(py*.85);
   const zoom=1+.035*a+.055*b+.065*c+.035*d-.06*e;
   const lift=.3+1*a+2.2*b+3.4*c+2.4*d+.8*e;
   const lateral=(-1*a+4*b-5*c+4*d-1*e)+px*1.7;
   scene.style.transform=`translate3d(calc(-50% + ${lateral}vw),calc(-50% + ${lift}vh),0) scale(${zoom})`;
   robot.style.transform=`rotateX(${pitch}deg) rotateY(${yaw}deg)`;
   base.style.transform=`translate3d(${px*1.6}px,${py*.9}px,0) scale(1.002)`;
   floor.style.transform=`translateX(-50%) scale(${1-.12*c+.05*d})`;
   floor.style.opacity=.70-.22*c+.10*d;
   hint.style.opacity=p>.045?0:1;
   const idx=Math.min(4,Math.floor(p*5));dots.forEach((n,i)=>n.classList.toggle('on',i===idx));
 }
 function tick(){if(!raf)raf=requestAnimationFrame(draw)}
 addEventListener('scroll',tick,{passive:true});
 addEventListener('resize',tick,{passive:true});
 addEventListener('pointermove',ev=>{
   px=clamp(ev.clientX/innerWidth*2-1,-1,1);py=clamp(ev.clientY/innerHeight*2-1,-1,1);
   if(downX!==null)dragTarget=clamp((ev.clientX-downX)*.045,-8,8);
   tick();
 },{passive:true});
 addEventListener('pointerdown',ev=>{downX=ev.clientX},{passive:true});
 addEventListener('pointerup',()=>{downX=null;dragTarget*=.25;tick()},{passive:true});
 addEventListener('pointercancel',()=>{downX=null;dragTarget=0;tick()},{passive:true});
 async function loadCanonical(){
   try{
     const files=['kaizen_head_a.txt','kaizen_head_b.txt','kaizen_ref_1.txt','kaizen_ref_2.txt','kaizen_ref_3.txt','kaizen_ref_4.txt','kaizen_ref_5.txt','kaizen_ref_6.txt','kaizen_ref_7.txt','kaizen_ref_8.txt'];
    const parts=await Promise.all(files.map(name=>
       fetch(`assets/${name}`,{cache:'force-cache'}).then(r=>{
         if(!r.ok) throw new Error(`${name}: ${r.status}`);
         return r.text();
       })
     ));
     const b64=parts.join('').replace(/\s+/g,'');
     const raw=atob(b64),bytes=new Uint8Array(raw.length);
     for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
     const url=URL.createObjectURL(new Blob([bytes],{type:'image/webp'}));
     const img=new Image();
     img.onload=()=>{base.src=url;base.dataset.canonical='1'};
     img.src=url;
   }catch(err){console.warn('KAIZEN canonical artwork fallback',err)}
 }
 base.addEventListener('error',()=>{if(base.dataset.canonical)base.src='assets/clean_hero.jpg'},{once:true});
 loadCanonical();
 setInterval(tick,80);
 tick();
})();
</script>
</body>
</html>
