<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Robot 3D — iOS Safe</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 18%,#fff 0,#f2f4f7 30%,#e2e7ec 68%,#d2d8df 100%);touch-action:none}.scene{position:fixed;inset:0;display:grid;place-items:center;perspective:1100px;overflow:hidden}.ring{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);border:1px solid rgba(92,104,116,.10);border-radius:50%;pointer-events:none}.r1{width:min(60vmin,650px);height:min(60vmin,650px)}.r2{width:min(78vmin,840px);height:min(78vmin,840px);opacity:.72}.r3{width:min(96vmin,1030px);height:min(96vmin,1030px);opacity:.42}.robot3d{position:relative;width:min(68vw,500px);max-height:86vh;aspect-ratio:3/4;transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 30px 26px rgba(24,30,36,.20));transition:transform .08s linear}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:26px;user-select:none;-webkit-user-drag:none;pointer-events:none}.layer.back{filter:brightness(.42) saturate(.55);opacity:.14}.layer.front{transform:translateZ(10px)}.layer.shine{mix-blend-mode:screen;opacity:.08;filter:brightness(1.7)}.shadow{position:absolute;left:50%;bottom:4.5vh;transform:translateX(-50%);width:min(42vw,360px);height:42px;border-radius:50%;background:radial-gradient(circle,rgba(24,30,36,.20),rgba(24,30,36,.06) 55%,transparent 75%);filter:blur(4px);pointer-events:none}.top{position:fixed;z-index:20;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;color:#6d7984;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}.pill{padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px)}.bottom{position:fixed;z-index:20;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(0,0,0,.05);color:#66727d;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;pointer-events:none;white-space:nowrap}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#6d7984;font:800 11px system-ui;letter-spacing:.15em;text-transform:uppercase;z-index:30;pointer-events:none}@media(max-width:650px){.robot3d{width:min(88vw,470px);max-height:82vh}.top{font-size:9px;letter-spacing:.10em}.bottom{font-size:9px;letter-spacing:.09em}}</style></head><body><div class="scene"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="shadow"></div><div class="robot3d" id="robot"><img class="layer back" style="transform:translateZ(-18px) scale(.994)"><img class="layer back" style="transform:translateZ(-12px) scale(.996)"><img class="layer back" style="transform:translateZ(-6px) scale(.998)"><img class="layer front"><img class="layer shine" style="transform:translateZ(14px)"></div></div><div class="top"><div>Robot 3D / iOS Safe</div><div class="pill" id="state">Loading robot…</div></div><div class="bottom">Drag / touch = rotate · tap = spin</div><div class="loading" id="loading">Loading robot…</div><script>(()=>{const robot=document.getElementById('robot'),state=document.getElementById('state'),loading=document.getElementById('loading');let rx=-2,ry=0,drag=false,sx=0,sy=0,bx=0,by=0,moved=false,spin=0;function apply(){robot.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`}function start(x,y){drag=true;moved=false;sx=x;sy=y;bx=ry;by=rx;state.textContent='Rotating'}function move(x,y){if(!drag)return;const dx=x-sx,dy=y-sy;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;ry=Math.max(-42,Math.min(42,bx+dx*.18));rx=Math.max(-15,Math.min(15,by-dy*.10));apply()}function end(){if(!drag)return;drag=false;state.textContent='Drag / touch to rotate';if(!moved)present()}function present(){if(spin)return;spin=1;state.textContent='Presentation spin';const st=performance.now(),base=ry;function f(n){const p=Math.min(1,(n-st)/1100),e=1-Math.pow(1-p,3);ry=base+Math.sin(e*Math.PI)*38;rx=-2+Math.sin(e*Math.PI)*4;apply();if(p<1)requestAnimationFrame(f);else{ry=base;rx=-2;apply();spin=0;state.textContent='Drag / touch to rotate'}}requestAnimationFrame(f)}robot.addEventListener('pointerdown',e=>{robot.setPointerCapture?.(e.pointerId);start(e.clientX,e.clientY)});robot.addEventListener('pointermove',e=>move(e.clientX,e.clientY));robot.addEventListener('pointerup',end);robot.addEventListener('pointercancel',end);fetch('assets/ios_robot_b64.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(b64=>{const src='data:image/jpeg;base64,'+b64.trim();document.querySelectorAll('.layer').forEach(i=>i.src=src);state.textContent='Drag / touch to rotate';loading.remove();}).catch(()=>{state.textContent='Robot image load error';loading.textContent='Robot image load error'});let t0=performance.now();function idle(n){if(!drag&&!spin){const t=(n-t0)/1000;robot.style.transform=`rotateX(${rx+Math.sin(t*.8)*.35}deg) rotateY(${ry+Math.sin(t*.5)*.7}deg) translateY(${Math.sin(t*1.25)*2}px)`}requestAnimationFrame(idle)}requestAnimationFrame(idle);apply()})();</script></body></html>
