<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Robot 3D — Refined Interactive</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 50% 18%,#fff 0,#f4f6f8 26%,#e4e9ee 64%,#d3d9df 100%);color:#101419}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.overlay{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.72),transparent 28%),linear-gradient(180deg,rgba(255,255,255,.28),transparent 24%)}.rings span{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);border:1px solid rgba(96,108,119,.08);border-radius:50%}.rings span:nth-child(1){width:min(58vmin,620px);height:min(58vmin,620px)}.rings span:nth-child(2){width:min(74vmin,790px);height:min(74vmin,790px);opacity:.7}.rings span:nth-child(3){width:min(92vmin,980px);height:min(92vmin,980px);opacity:.45}.top{position:fixed;left:22px;right:22px;top:18px;z-index:5;display:flex;justify-content:space-between;align-items:center;color:#73808b;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;pointer-events:none}.pill{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.04);backdrop-filter:blur(10px)}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.05);backdrop-filter:blur(10px);color:#67737e;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}.hint{position:fixed;left:22px;bottom:18px;z-index:5;color:#79858f;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;pointer-events:none}@media(max-width:700px){.top,.hint,.bottom{font-size:10px;letter-spacing:.11em}}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay rings"><span></span><span></span><span></span></div>
<div class="top"><div>Interactive 3D Robot</div><div class="pill" id="mode">Idle · drag / tap</div></div>
<div class="hint">Drag to rotate · tap to wave</div>
<div class="bottom">Refined full-body humanoid · 3D only</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
(()=>{
const mount=document.getElementById('app'),modeEl=document.getElementById('mode');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8)); renderer.setSize(innerWidth,innerHeight); renderer.outputEncoding=THREE.sRGBEncoding; mount.appendChild(renderer.domElement);
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(33,innerWidth/innerHeight,.1,100); camera.position.set(0,2.8,9.4);
scene.add(new THREE.HemisphereLight(0xffffff,0xc7cfd7,2.2));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(4.5,7,5.5); scene.add(key);
const fill=new THREE.PointLight(0xffffff,8,24); fill.position.set(-3,3,5); scene.add(fill);
const rim=new THREE.PointLight(0xbcc7d2,7,22); rim.position.set(0,4,-6); scene.add(rim);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(2.05,48),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.1})); shadow.rotation.x=-Math.PI/2; shadow.position.y=-2.45; scene.add(shadow);
const glow=new THREE.Mesh(new THREE.CircleGeometry(2.35,56),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.23})); glow.rotation.x=-Math.PI/2; glow.position.y=-2.44; scene.add(glow);
const white=new THREE.MeshStandardMaterial({color:0xf5f7f8,roughness:.32,metalness:.28});
const black=new THREE.MeshStandardMaterial({color:0x171d23,roughness:.56,metalness:.16});
const gray=new THREE.MeshStandardMaterial({color:0x59626b,roughness:.34,metalness:.42});
const gold=new THREE.MeshStandardMaterial({color:0xe2b76d,roughness:.18,metalness:.82});
const eye=new THREE.MeshStandardMaterial({color:0xff564b,emissive:0x8a0f0a,emissiveIntensity:2.2,roughness:.12,metalness:.08});
const robot=new THREE.Group(); scene.add(robot);
function box(w,h,d,m){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m)}
function sphere(r,m){return new THREE.Mesh(new THREE.SphereGeometry(r,28,20),m)}
function cyl(r1,r2,h,m,s=28){return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,s),m)}
function torus(R,r,m,a=Math.PI*2){return new THREE.Mesh(new THREE.TorusGeometry(R,r,18,42,a),m)}
function capsule(radius,length,m){const g=new THREE.Group(),c=cyl(radius,radius,length,m,26),s1=sphere(radius,m),s2=sphere(radius,m); s1.position.y=length/2; s2.position.y=-length/2; g.add(c,s1,s2); return g}
const body=new THREE.Group(); robot.add(body);
const pelvis=new THREE.Group(); pelvis.position.y=0.5; body.add(pelvis);
pelvis.add(box(1.14,.42,.62,black)); let belt=box(1.30,.09,.66,gold); belt.position.y=.15; pelvis.add(belt); let cod=box(.42,.44,.36,gray); cod.position.set(0,-.24,.12); pelvis.add(cod);
for(const s of[-1,1]){ let hip=box(.15,.30,.30,gold); hip.position.set(.45*s,-.06,.06); hip.rotation.z=.17*s; pelvis.add(hip)}
const torso=new THREE.Group(); torso.position.y=.55; pelvis.add(torso);
let abdomen=box(.56,1.02,.40,gray); abdomen.position.y=.50; torso.add(abdomen);
for(let i=0;i<4;i++){ let rib=box(.58-i*.05,.08,.42,black); rib.position.set(0,.12+i*.18,.02); torso.add(rib)}
const chest=new THREE.Group(); chest.position.y=1.48; torso.add(chest);
let chestMain=box(1.46,1.08,.56,white); chestMain.scale.set(1.02,1.04,.84); chest.add(chestMain);
let chestUpper=box(1.66,.28,.62,black); chestUpper.position.y=.34; chest.add(chestUpper);
let sternum=box(.26,.78,.14,gray); sternum.position.set(0,-.04,.18); chest.add(sternum);
let core=cyl(.12,.12,.07,eye,28); core.rotation.x=Math.PI/2; core.position.set(0,-.12,.32); chest.add(core);
for(const s of[-1,1]){ let v=box(.78,.05,.07,gold); v.position.set(.22*s,-.10,.29); v.rotation.z=.72*s; chest.add(v); let panel=box(.40,.54,.18,black); panel.position.set(.35*s,.02,.27); panel.rotation.z=.22*s; chest.add(panel); let flank=box(.16,.78,.42,black); flank.position.set(.58*s,-.04,.02); flank.rotation.z=.22*s; chest.add(flank); }
let collar=box(1.42,.14,.50,gold); collar.position.y=.40; chest.add(collar);
const neck=new THREE.Group(); neck.position.y=2.00; torso.add(neck); let neckCore=cyl(.14,.18,.38,gray,24); neck.add(neckCore); let neckRing=torus(.20,.025,gold); neckRing.rotation.x=Math.PI/2; neck.add(neckRing);
const head=new THREE.Group(); head.position.y=.45; neck.add(head);
let skull=sphere(.40,white); skull.scale.set(.72,1.06,.86); head.add(skull);
let crown=box(.54,.24,.54,black); crown.position.set(0,.22,0); head.add(crown);
for(const s of[-1,1]){ let cheek=box(.18,.36,.22,black); cheek.position.set(.22*s,-.03,.22); cheek.rotation.z=.16*s; head.add(cheek)}
let face=box(.52,.44,.16,white); face.position.set(0,.01,.32); head.add(face);
let visor=box(.56,.05,.035,eye); visor.position.set(0,.07,.42); head.add(visor);
let brow=box(.50,.04,.13,gold); brow.position.set(0,.155,.30); head.add(brow);
let chin=box(.16,.07,.13,gold); chin.position.set(0,-.18,.31); head.add(chin);
for(const s of[-1,1]){ let fin=box(.08,.30,.09,gold); fin.position.set(.29*s,.31,.03); fin.rotation.z=-.58*s; head.add(fin); let ear=torus(.10,.018,gold); ear.rotation.y=Math.PI/2; ear.position.set(.41*s,.04,.05); head.add(ear)}
function buildArm(side){const s=side, root=new THREE.Group(); root.position.set(1.00*s,1.67,0.02); chest.add(root); let shoulder=sphere(.23,gray); shoulder.scale.set(1.05,1.05,1.05); root.add(shoulder); let pauldron=box(.78,.38,.70,white); pauldron.position.set(.30*s,.02,.03); pauldron.rotation.z=.34*s; root.add(pauldron); let trim=box(.30,.16,.40,gold); trim.position.set(.48*s,.06,.10); trim.rotation.z=.58*s; root.add(trim); const upper=new THREE.Group(); upper.position.set(.48*s,-.02,0); root.add(upper); let u=capsule(.15,1.02,black); u.position.y=-.64; upper.add(u); let utrim=box(.10,.88,.10,gold); utrim.position.set(.10*s,-.64,.10); upper.add(utrim); const elbow=new THREE.Group(); elbow.position.y=-1.26; upper.add(elbow); elbow.add(sphere(.16,gold)); let fore=capsule(.12,1.00,white); fore.position.y=-.60; elbow.add(fore); let strip=box(.08,.72,.08,gray); strip.position.set(.08*s,-.58,.10); elbow.add(strip); const wrist=new THREE.Group(); wrist.position.y=-1.18; elbow.add(wrist); wrist.add(sphere(.10,gold)); let palm=box(.20,.24,.32,white); palm.position.y=-.12; wrist.add(palm); return {root,upper,elbow,wrist}}
function buildLeg(side){const s=side, root=new THREE.Group(); root.position.set(.42*s,-.08,0); pelvis.add(root); root.add(sphere(.18,gold)); const thigh=new THREE.Group(); thigh.position.y=-.10; root.add(thigh); let t=capsule(.18,1.55,black); t.position.y=-.82; thigh.add(t); let tout=box(.12,1.18,.12,gold); tout.position.set(.15*s,-.78,.08); thigh.add(tout); const knee=new THREE.Group(); knee.position.y=-1.74; thigh.add(knee); knee.add(sphere(.16,gold)); let shin=capsule(.14,1.62,white); shin.position.y=-.86; knee.add(shin); let calf=box(.15,1.10,.16,gray); calf.position.set(0,-.68,-.08); knee.add(calf); let fin=box(.10,.80,.12,gold); fin.position.set(.12*s,-.48,.10); fin.rotation.z=.06*s; knee.add(fin); const ankle=new THREE.Group(); ankle.position.y=-1.82; knee.add(ankle); ankle.add(sphere(.10,gold)); let foot=box(.32,.16,.98,black); foot.position.set(0,-.05,.28); ankle.add(foot); let toe=box(.25,.10,.42,white); toe.position.set(0,-.02,.62); ankle.add(toe); return {root,thigh,knee,ankle}}
const L=buildArm(-1), R=buildArm(1), LL=buildLeg(-1), RR=buildLeg(1);
robot.updateMatrixWorld(true); const bb=new THREE.Box3().setFromObject(robot); robot.position.y=-bb.min.y-2.45;
let targetRotY=0, drag=false, startX=0, startRot=0, px=0, py=0, waveUntil=0;
function setMode(t){modeEl.textContent=t} setMode('Idle · drag / tap');
function down(x){drag=true;startX=x;startRot=targetRotY}
function move(x,y){px=(x/innerWidth)*2-1; py=(y/innerHeight)*2-1; if(drag){targetRotY=startRot+(x-startX)*0.01; setMode('Rotate · release to idle')}}
function up(){if(drag){drag=false; setMode('Idle · drag / tap')}}
function wave(){waveUntil=performance.now()+1500; setMode('Wave · tap again anytime'); clearTimeout(wave._t); wave._t=setTimeout(()=>{ if(!drag) setMode('Idle · drag / tap') },1600)}
renderer.domElement.addEventListener('pointerdown',e=>down(e.clientX)); window.addEventListener('pointermove',e=>move(e.clientX,e.clientY)); window.addEventListener('pointerup',up); renderer.domElement.addEventListener('click',wave);
renderer.domElement.addEventListener('touchstart',e=>{const t=e.touches[0]; if(!t)return; down(t.clientX); move(t.clientX,t.clientY); wave()},{passive:true}); renderer.domElement.addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) move(t.clientX,t.clientY)},{passive:true}); renderer.domElement.addEventListener('touchend',up);
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick); const t=clock.getElapsedTime(), now=performance.now(); body.position.y=Math.sin(t*1.6)*.03; torso.rotation.z=Math.sin(t*.9)*.012; torso.rotation.x=Math.sin(t*.8)*.012; robot.rotation.y += (targetRotY-robot.rotation.y)*.08; head.rotation.y=THREE.MathUtils.clamp(px*.32,-.35,.35)+Math.sin(t*.6)*.04; head.rotation.x=THREE.MathUtils.clamp(py*-.12,-.10,.12)+Math.sin(t*.7)*.015;
L.upper.rotation.x=Math.sin(t*.9)*.04; L.elbow.rotation.z=.10; R.upper.rotation.x=Math.sin(t*.85)*-.04; R.elbow.rotation.z=-.10; R.wrist.rotation.y=0;
LL.thigh.rotation.x=Math.sin(t*.8)*.02; RR.thigh.rotation.x=Math.sin(t*.8+1.2)*.02;
if(now<waveUntil){ const p=1-((waveUntil-now)/1500); R.upper.rotation.x=-.92+Math.sin(p*Math.PI*6)*.10; R.upper.rotation.z=-.10; R.elbow.rotation.z=-1.18+Math.sin(p*Math.PI*6)*.08; R.wrist.rotation.y=Math.sin(p*Math.PI*12)*.45; head.rotation.y+=.16 }
renderer.render(scene,camera)} tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight)});
})();
</script>
</body>
</html>
