<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Your Robots — 3D Selector</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#f0f2f4,#dfe3e8);color:#20242a;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{height:100%;display:grid;grid-template-columns:310px 1fr 290px;gap:22px;padding:22px}.p{background:linear-gradient(#ffffffcf,#edf0f3c2);border:1px solid #fff;border-radius:18px;box-shadow:0 14px 42px #17202a14}.left{padding:18px;display:flex;flex-direction:column}.brand{display:flex;gap:13px;align-items:center;margin-bottom:16px}.mark{width:42px;height:30px;background:#0b0e12;position:relative}.mark:after{content:'';position:absolute;left:12px;top:7px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:17px solid #fff}.brand b{font-size:24px}.ttl{font-size:15px;letter-spacing:.2em;color:#989fa7;text-transform:uppercase;margin:8px 0 10px;font-weight:700}.roster{display:grid;gap:10px}.card{display:grid;grid-template-columns:68px 1fr;gap:12px;padding:9px;border:1px solid #cbd0d5;background:#ffffffb8;cursor:pointer}.card.on{background:#fff;box-shadow:0 8px 24px #1b212817}.thumb{height:64px;background:linear-gradient(#d7dce1,#f3f5f7);position:relative}.thumb:before{content:'';position:absolute;width:22px;height:22px;border-radius:9px;left:23px;top:7px;background:#eef1f3;border:2px solid #252a30}.thumb:after{content:'';position:absolute;width:38px;height:30px;left:15px;top:27px;background:#eef1f3;border:2px solid #252a30;border-radius:11px}.card h3{margin:9px 0 2px;font-size:16px}.card p{margin:0;font-size:12px;color:#6c737d}.add{margin-top:10px;border:1px solid #cbd0d5;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:700}.plus{width:48px;height:48px;border:3px solid #12161b;display:grid;place-items:center;font-size:38px}.center{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff,#edf0f3 38%,#d4d9df 80%)}#scene{position:absolute;inset:0}.halo{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 32%,#ffffffcc,transparent 32%)}.ring{position:absolute;left:50%;top:52%;width:66vmin;height:66vmin;transform:translate(-50%,-50%);border:1px solid #69737d1f;border-radius:50%;pointer-events:none}.ring.r2{width:84vmin;height:84vmin}.hint{position:absolute;left:22px;top:18px;color:#76808a;font:700 11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}.label{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#ffffffbd;padding:9px 13px;border-radius:999px;color:#5f6972;font:700 10px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}.diag{position:absolute;right:15px;bottom:15px;background:#ffffffb8;padding:7px 9px;font:700 10px ui-monospace,monospace;color:#59636c}.right{padding:25px 20px;display:flex;flex-direction:column;justify-content:space-between}.lvl{font-size:88px;line-height:.85;margin:0;color:#555b61;letter-spacing:-.06em}.badge{display:inline-block;background:#5d6369;color:#fff;padding:3px 10px;font-size:13px;letter-spacing:.2em}.role{font-size:38px;margin:14px 0 3px;letter-spacing:-.04em}.cls{margin:0 0 24px;color:#68717b}.stat{margin:0 0 16px}.row{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}.bar{height:5px;background:#d3d7db}.fill{height:100%;background:#1b2025}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.skill{aspect-ratio:1;background:#8d949b;color:#fff;display:grid;place-items:center;font-weight:800}.start{border:4px solid #11161b;background:#90979e;color:#fff;text-align:center;padding:18px;font-size:30px;letter-spacing:.24em;cursor:pointer}@media(max-width:1050px){html,body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto 62vh auto}.center{min-height:540px}}@media(max-width:600px){.app{padding:10px;gap:10px}.left,.right{padding:14px}.center{min-height:58vh}.lvl{font-size:68px}.role{font-size:32px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js"}}</script></head><body><div class="app"><aside class="p left"><div class="brand"><div class="mark"></div><b>Your Robots</b></div><div class="ttl">Classes S — A</div><div class="roster" id="roster"></div><div class="add">ADD ROBOTS <div class="plus">+</div></div></aside><main class="center"><div id="scene"></div><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><div class="hint">Interactive 3D showcase · motion active</div><div class="label" id="label">fighter / wave</div><div class="diag" id="diag">3D INIT</div></main><aside class="p right"><div><div style="display:flex;gap:12px;align-items:end"><h2 class="lvl" id="lvl">51</h2><span class="badge">LEVEL</span></div><h3 class="role" id="role">FIGHTER</h3><p class="cls">Class <span id="cls">S</span></p><div id="stats"></div><div style="color:#747c84;font-size:13px;margin-top:20px">Skills</div><div class="skills" id="skills"></div></div><div class="start" id="start">START</div></aside></div><script type="module">import*as T from'three';const data=[{id:'berserker',name:'BERSERKER',serial:'Robot 2300.10',role:'BERSERKER',cl:'S',lv:64,trim:0x7d2323,eye:0xff3322,m:'idle',st:{Attack:320,Defence:90,Accuracy:110,Dexterity:145}},{id:'destroyer',name:'DESTROER',serial:'Robot 1747.12',role:'DESTROER',cl:'A',lv:44,trim:0x46586d,eye:0x64d6ff,m:'turn',st:{Attack:280,Defence:140,Accuracy:100,Dexterity:130}},{id:'warrior',name:'WARRIOR',serial:'Robot 2347.12',role:'WARRIOR',cl:'A',lv:58,trim:0x766244,eye:0xff6952,m:'step',st:{Attack:240,Defence:120,Accuracy:160,Dexterity:190}},{id:'fighter',name:'FIGHTER',serial:'Robot 0440.01',role:'FIGHTER',cl:'S',lv:51,trim:0x3f454d,eye:0xff3025,m:'wave',st:{Attack:260,Defence:80,Accuracy:150,Dexterity:220}}];let active='fighter',motion='wave';const roster=document.querySelector('#roster'),lvl=document.querySelector('#lvl'),role=document.querySelector('#role'),cls=document.querySelector('#cls'),stats=document.querySelector('#stats'),skills=document.querySelector('#skills'),label=document.querySelector('#label'),diag=document.querySelector('#diag');function ui(){const r=data.find(x=>x.id===active);roster.innerHTML=data.map(x=>`<div class="card ${x.id===active?'on':''}" data-id="${x.id}"><div class="thumb"></div><div><h3>${x.name}</h3><p>${x.serial}</p></div></div>`).join('');roster.querySelectorAll('.card').forEach(c=>c.onclick=()=>{active=c.dataset.id;motion=data.find(x=>x.id===active).m;style();ui()});lvl.textContent=r.lv;role.textContent=r.role;cls.textContent=r.cl;stats.innerHTML=Object.entries(r.st).map(([k,v])=>`<div class="stat"><div class="row"><span>${k}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,v/3.4)}%"></div></div></div>`).join('');skills.innerHTML=['✶','◈','⚡','⌬'].map(x=>`<div class="skill">${x}</div>`).join('');label.textContent=r.role.toLowerCase()+' / '+motion}const wrap=document.querySelector('#scene'),R=new T.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,1.6));R.outputColorSpace=T.SRGBColorSpace;wrap.appendChild(R.domElement);const S=new T.Scene,C=new T.PerspectiveCamera(31,1,.1,100);C.position.set(0,1.45,8);S.add(new T.HemisphereLight(0xffffff,0xbec6ce,2.5));let K=new T.DirectionalLight(0xffffff,3);K.position.set(4,7,6);S.add(K);let F=new T.PointLight(0xffffff,9,20);F.position.set(-3,2,4);S.add(F);let armor=new T.MeshPhysicalMaterial({color:0xf4f5f6,metalness:.32,roughness:.28,clearcoat:.45}),dark=new T.MeshPhysicalMaterial({color:0x171b20,metalness:.32,roughness:.46}),trim=new T.MeshPhysicalMaterial({color:0x3f454d,metalness:.65,roughness:.22}),eye=new T.MeshPhysicalMaterial({color:0xff3025,emissive:0xff1000,emissiveIntensity:3});let bot=new T.Group;S.add(bot);bot.position.y=-.12;const mesh=(g,m=armor)=>new T.Mesh(g,m),caps=(r,l,m=armor)=>{let g=new T.Group,c=mesh(new T.CylinderGeometry(r,r,l,28),m),a=mesh(new T.SphereGeometry(r,28,18),m),b=a.clone();a.position.y=l/2;b.position.y=-l/2;g.add(c,a,b);return g},body=new T.Group;bot.add(body),pel=new T.Group;pel.position.y=.15;body.add(pel),tor=new T.Group;tor.position.y=.72;pel.add(tor),neck=new T.Group;neck.position.y=1.62;tor.add(neck),head=new T.Group;head.position.y=.33;neck.add(head);pel.add(mesh(new T.BoxGeometry(1.1,.45,.58),trim));tor.add(mesh(new T.BoxGeometry(.92,.55,.5),trim));let chest=mesh(new T.BoxGeometry(1.74,1.35,.82));chest.position.y=.64;tor.add(chest);let scarf=mesh(new T.TorusGeometry(1.1,.27,24,48,Math.PI*1.72),dark);scarf.rotation.x=Math.PI/2;scarf.position.set(0,1.16,.12);tor.add(scarf);let wrapScarf=mesh(new T.CylinderGeometry(.9,1.05,.58,30,1,true),dark);wrapScarf.position.set(0,1.02,.02);tor.add(wrapScarf);let helm=mesh(new T.BoxGeometry(.84,.98,.76));helm.position.y=.05;head.add(helm);let fp=mesh(new T.BoxGeometry(.56,.68,.12),trim);fp.position.z=.39;head.add(fp);let mouth=mesh(new T.BoxGeometry(.34,.11,.07),dark);mouth.position.set(0,-.23,.47);head.add(mouth);let e1=mesh(new T.SphereGeometry(.07,18,12),eye);e1.position.set(-.16,.08,.45);head.add(e1);let e2=e1.clone();e2.position.x=.16;head.add(e2);function arm(s){let root=new T.Group;root.position.set(.9*s,1.34,.02);tor.add(root);let sh=mesh(new T.SphereGeometry(.29,24,16));sh.scale.set(1.35,1.08,1.25);root.add(sh);let up=new T.Group;up.position.x=.34*s;root.add(up);let u=caps(.16,.8);u.position.y=-.5;up.add(u);let el=new T.Group;el.position.y=-1;up.add(el);el.add(mesh(new T.SphereGeometry(.14,20,14),trim));let f=caps(.13,.8);f.position.y=-.5;el.add(f);let wr=new T.Group;wr.position.y=-1;el.add(wr);let palm=mesh(new T.BoxGeometry(.22,.3,.25));palm.position.y=-.08;wr.add(palm);return{root,up,el,wr}}function leg(s){let root=new T.Group;root.position.set(.4*s,-.04,0);pel.add(root);root.add(mesh(new T.SphereGeometry(.18,20,14),trim));let th=new T.Group;th.position.y=-.1;root.add(th);let a=caps(.18,1.08);a.position.y=-.65;th.add(a);let kn=new T.Group;kn.position.y=-1.3;th.add(kn);kn.add(mesh(new T.SphereGeometry(.15,20,14),trim));let b=caps(.15,1.05);b.position.y=-.64;kn.add(b);let ft=new T.Group;ft.position.y=-1.29;kn.add(ft);ft.add(mesh(new T.BoxGeometry(.3,.17,.68)));return{root,th,kn,ft}}let AL=arm(-1),AR=arm(1),LL=leg(-1),LR=leg(1);let platform=mesh(new T.CylinderGeometry(1.65,1.8,.13,60),new T.MeshStandardMaterial({color:0xe5e8ec,roughness:.55}));platform.position.y=-1.62;S.add(platform);function style(){let r=data.find(x=>x.id===active);trim.color.setHex(r.trim);eye.color.setHex(r.eye);eye.emissive.setHex(r.eye)}style();ui();document.querySelector('#start').onclick=()=>{motion=['wave','turn','step'][Math.floor(Math.random()*3)];ui()};let clock=new T.Clock;function anim(){requestAnimationFrame(anim);let t=clock.getElapsedTime(),b=Math.sin(t*1.8)*.025;body.position.y=b;head.rotation.y=Math.sin(t*.8)*.08;tor.rotation.y=Math.sin(t*.55)*.045;AL.up.rotation.x=AR.up.rotation.x=0;AL.el.rotation.z=.08;AR.el.rotation.z=-.08;LL.th.rotation.x=LR.th.rotation.x=LL.kn.rotation.x=LR.kn.rotation.x=0;bot.rotation.y=Math.sin(t*.3)*.12;if(motion==='wave'){AR.up.rotation.x=-.95+Math.sin(t*4)*.1;AR.el.rotation.z=-1;AR.wr.rotation.y=Math.sin(t*8)*.55;head.rotation.y=.2}else if(motion==='turn'){bot.rotation.y=Math.sin(t*1.1)*.55}else if(motion==='step'){let s=Math.sin(t*2.6);LL.th.rotation.x=s*.42;LR.th.rotation.x=-s*.42;LL.kn.rotation.x=Math.max(0,-s)*.48;LR.kn.rotation.x=Math.max(0,s)*.48;AL.up.rotation.x=-s*.28;AR.up.rotation.x=s*.28}R.render(S,C)}function resize(){let w=wrap.clientWidth,h=wrap.clientHeight;C.aspect=w/h;C.updateProjectionMatrix();R.setSize(w,h)}addEventListener('resize',resize);resize();diag.textContent='3D OK';anim();addEventListener('error',()=>diag.textContent='3D ERROR')</script></body></html>
