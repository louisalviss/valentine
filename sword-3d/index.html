<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Azure Void Sword — Thin Blade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 40%,#fff 0,#f0f4f7 55%,#dce3e8 100%);color:#18222c}canvas{display:block;width:100%;height:100%}.top{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6c7781}.k b{display:block;margin-top:5px;font-size:15px;letter-spacing:.06em;color:#202a33}.k em{font-style:normal;color:#088ec4}.badge{font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;border:1px solid rgba(30,50,65,.12);border-radius:999px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);color:#697781}.ui{position:fixed;z-index:5;left:50%;bottom:max(15px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:7px;padding:7px;border:1px solid rgba(30,50,65,.12);border-radius:15px;background:rgba(255,255,255,.74);backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(36,51,62,.12)}button{border:0;border-radius:10px;padding:11px 13px;background:rgba(24,39,50,.055);color:#52606b;font-weight:650;font-size:10px;letter-spacing:.07em;text-transform:uppercase}button.on{background:rgba(15,158,211,.12);color:#08759e}.hint{position:fixed;right:16px;bottom:max(76px,calc(env(safe-area-inset-bottom) + 76px));font-size:10px;color:rgba(45,62,74,.48);pointer-events:none}@media(max-width:520px){.badge{display:none}.ui{width:calc(100% - 28px)}button{flex:1;padding:12px 6px}.hint{right:14px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
</head><body>
<div class="top"><div class="k">reference reconstruction<b>AZURE <em>VOID</em> SWORD</b></div><div class="badge">thin blade · v4</div></div><div class="hint">drag to rotate · pinch / wheel to zoom</div><div class="ui"><button id="spin" class="on">Auto 360</button><button id="glow" class="on">Rune glow</button><button id="reset">Reset</button></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,60);camera.position.set(0,.1,14.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=9.5;controls.maxDistance=23;controls.target.set(0,.15,0);controls.autoRotate=true;controls.autoRotateSpeed=.65;
scene.add(new THREE.HemisphereLight(0xffffff,0xc6d0d7,2.6));const key=new THREE.DirectionalLight(0xffffff,4.2);key.position.set(4,7,6);scene.add(key);const rim=new THREE.DirectionalLight(0x73d9ff,2.1);rim.position.set(-4,2,-5);scene.add(rim);const blueLight=new THREE.PointLight(0x37c9ff,5,10,2);blueLight.position.set(0,.6,4);scene.add(blueLight);

const sword=new THREE.Group();scene.add(sword);sword.rotation.x=-.02;
const steel=new THREE.MeshPhysicalMaterial({color:0x151b22,metalness:.98,roughness:.22,clearcoat:.34,clearcoatRoughness:.16});
const edge=new THREE.MeshPhysicalMaterial({color:0x7e8992,metalness:1,roughness:.17});
const black=new THREE.MeshPhysicalMaterial({color:0x080b0f,metalness:.96,roughness:.31});
const leather=new THREE.MeshStandardMaterial({color:0x090b0f,roughness:.91});
const glow=new THREE.MeshStandardMaterial({color:0x4ed6ff,emissive:0x149fd7,emissiveIntensity:3.2,metalness:.25,roughness:.23});
const core=new THREE.MeshBasicMaterial({color:0xb7efff,toneMapped:false,transparent:true,opacity:.96});

function ext(points,depth,mat,bev=.015){const s=new THREE.Shape();s.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)s.lineTo(points[i][0],points[i][1]);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:2});g.translate(0,0,-depth/2);const m=new THREE.Mesh(g,mat);return m}
function box(w,h,d,mat,x=0,y=0,z=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.z=rz;return m}

// Blade: deliberately thin. Width ~0.75 world units, thickness only 0.085.
const bladePts=[[-.39,1.92],[.39,1.92],[.34,-3.48],[.18,-4.12],[0,-4.58],[-.18,-4.12],[-.34,-3.48]];
const blade=ext(bladePts,.085,steel,.012);sword.add(blade);
// Slight raised spine/ridge, still thin overall.
const ridge=box(.105,5.45,.105,black,0,-.76,0);sword.add(ridge);
// Sharpened edge strips are thinner than the body, not chunky side walls.
const leftEdge=ext([[-.39,1.92],[-.31,1.88],[-.27,-3.46],[-.10,-4.08],[0,-4.48],[-.18,-4.12],[-.34,-3.48]],.095,edge,.006);sword.add(leftEdge);const rightEdge=leftEdge.clone();rightEdge.scale.x=-1;sword.add(rightEdge);
const rune=box(.024,4.75,.115,glow,0,-.38,.012);sword.add(rune);const runeCore=box(.008,4.55,.121,core,0,-.38,.014);sword.add(runeCore);

// Guard/hilt remain thicker than blade, as they should.
const guardPts=[[-1.20,2.18],[-.96,2.02],[-.61,2.07],[-.39,1.93],[-.19,2.17],[0,2.31],[.19,2.17],[.39,1.93],[.61,2.07],[.96,2.02],[1.20,2.18],[.88,2.31],[.51,2.37],[.25,2.45],[0,2.38],[-.25,2.45],[-.51,2.37],[-.88,2.31]];
sword.add(ext(guardPts,.24,black,.025));
sword.add(ext([[-.46,2.27],[-.23,2.48],[0,2.59],[.23,2.48],[.46,2.27],[.28,2.08],[0,2.17],[-.28,2.08]],.28,steel,.022));
const centerGem=ext([[0,2.47],[.13,2.29],[0,2.10],[-.13,2.29]],.30,glow,.01);sword.add(centerGem);
const gemCore=ext([[0,2.43],[.055,2.29],[0,2.16],[-.055,2.29]],.31,core,.005);sword.add(gemCore);

const grip=new THREE.Mesh(new THREE.CylinderGeometry(.20,.19,1.70,28),leather);grip.position.y=3.38;sword.add(grip);
for(const y of [2.52,4.24]){const cap=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.12,30),edge);cap.position.y=y;sword.add(cap)}
for(let i=0;i<8;i++){sword.add(box(.46,.026,.045,edge,0,2.69+i*.19,.19,(i%2?-.62:.62)))}
const pommel=ext([[-.23,4.29],[-.16,4.52],[-.08,4.76],[0,5.00],[.08,4.76],[.16,4.52],[.23,4.29],[.11,4.27],[0,4.42],[-.11,4.27]],.21,black,.018);sword.add(pommel);
const pgem=ext([[0,4.80],[.075,4.64],[0,4.49],[-.075,4.64]],.23,glow,.007);sword.add(pgem);

const cord=new THREE.CatmullRomCurve3([new THREE.Vector3(-.18,4.78,.02),new THREE.Vector3(-.43,4.62,.03),new THREE.Vector3(-.49,4.12,.03),new THREE.Vector3(-.41,3.82,.03)]);sword.add(new THREE.Mesh(new THREE.TubeGeometry(cord,28,.015,7,false),black));
const bead=new THREE.Mesh(new THREE.SphereGeometry(.075,18,12),glow);bead.position.set(-.41,3.70,.03);sword.add(bead);
for(let i=0;i<7;i++){const x=-.48+i*.023;const c=new THREE.CatmullRomCurve3([new THREE.Vector3(-.41,3.62,.03),new THREE.Vector3(x,3.39,.04),new THREE.Vector3(x-.018,3.16,.03)]);sword.add(new THREE.Mesh(new THREE.TubeGeometry(c,12,.011,5,false),leather))}

const shadow=new THREE.Mesh(new THREE.CircleGeometry(2.5,64),new THREE.MeshBasicMaterial({color:0x7b919f,transparent:true,opacity:.13,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.scale.y=.23;shadow.position.y=-4.85;scene.add(shadow);
const particles=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0x53cbef,size:.025,transparent:true,opacity:.28,depthWrite:false}));const arr=new Float32Array(90*3);for(let i=0;i<90;i++){arr[i*3]=(Math.random()-.5)*3.2;arr[i*3+1]=(Math.random()-.5)*8.5;arr[i*3+2]=(Math.random()-.5)*2.2}particles.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(particles);

let glowOn=true;const spin=document.getElementById('spin'),gb=document.getElementById('glow');spin.onclick=()=>{controls.autoRotate=!controls.autoRotate;spin.classList.toggle('on',controls.autoRotate)};gb.onclick=()=>{glowOn=!glowOn;gb.classList.toggle('on',glowOn);glow.emissiveIntensity=glowOn?3.2:.15;core.opacity=glowOn?.96:.3;blueLight.intensity=glowOn?5:1;particles.visible=glowOn};document.getElementById('reset').onclick=()=>{camera.position.set(0,.1,14.5);controls.target.set(0,.15,0);sword.rotation.set(-.02,0,0);controls.update()};
renderer.setAnimationLoop(t=>{controls.update();particles.rotation.y=t*.00004;shadow.material.opacity=.12+Math.sin(t*.0014)*.012;if(glowOn)glow.emissiveIntensity=2.9+Math.sin(t*.0022)*.4;renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script></body></html>
