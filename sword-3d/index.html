<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Azure Void Sword — Three.js</title>
<style>
  :root{color-scheme:dark;--bg:#05070b;--panel:rgba(8,12,18,.58);--line:rgba(148,214,255,.18);--text:#d9e7f2;--muted:#7f93a3;--accent:#55c9ff}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);touch-action:none}
  #app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 0 38%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.58) 100%)}
  .top{position:fixed;left:18px;right:18px;top:max(18px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
  .brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(214,233,246,.74);text-shadow:0 2px 12px #000}.brand b{display:block;font-size:16px;letter-spacing:.08em;color:#f1f7fb;margin-top:5px;font-weight:650}.brand em{font-style:normal;color:var(--accent)}
  .badge{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#92a7b6}
  .controls{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.34)}
  button{appearance:none;border:0;background:rgba(255,255,255,.04);color:#b9c9d5;font:600 11px/1 ui-sans-serif,-apple-system,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:11px 13px;border-radius:11px;min-width:76px}button.active{background:rgba(85,201,255,.12);color:#dff6ff;box-shadow:inset 0 0 0 1px rgba(85,201,255,.18)}
  .hint{position:fixed;right:18px;bottom:max(80px,calc(env(safe-area-inset-bottom) + 80px));font-size:10px;line-height:1.5;color:rgba(170,190,203,.52);text-align:right;pointer-events:none}
  @media(max-width:520px){.top{left:14px;right:14px}.brand b{font-size:14px}.badge{display:none}.controls{bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 28px);justify-content:space-between}.controls button{flex:1;padding:12px 8px;min-width:0}.hint{right:14px;bottom:max(78px,calc(env(safe-area-inset-bottom) + 78px))}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>
<div class="top"><div class="brand">Generated 2D → procedural 3D<b>AZURE <em>VOID</em> SWORD</b></div><div class="badge">Three.js · r184</div></div>
<div class="hint">drag to rotate · pinch / wheel to zoom</div>
<div class="controls"><button id="spin" class="active">Auto 360</button><button id="glow" class="active">Rune glow</button><button id="reset">Reset</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host=document.getElementById('app');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070b);
scene.fog=new THREE.FogExp2(0x05070b,0.055);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,50);
camera.position.set(0,.55,15.2);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;controls.enablePan=false;controls.minDistance=10.2;controls.maxDistance=24;controls.target.set(0,.45,0);controls.autoRotate=true;controls.autoRotateSpeed=.8;

scene.add(new THREE.HemisphereLight(0x87cfff,0x020307,1.75));
const key=new THREE.DirectionalLight(0xffffff,4.2);key.position.set(4.5,6,6);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0x37bfff,3.2);rim.position.set(-5,2,-4);scene.add(rim);
const fill=new THREE.PointLight(0x5bcfff,18,10,2);fill.position.set(0,1.1,3);scene.add(fill);

const sword=new THREE.Group(); sword.rotation.x=-.04; scene.add(sword);
const metal=new THREE.MeshPhysicalMaterial({color:0x11171d,metalness:.94,roughness:.24,clearcoat:.35,clearcoatRoughness:.24});
const darkMetal=new THREE.MeshPhysicalMaterial({color:0x070a0e,metalness:.98,roughness:.32});
const edgeMat=new THREE.MeshPhysicalMaterial({color:0x42505a,metalness:1,roughness:.18});
const leather=new THREE.MeshStandardMaterial({color:0x07090c,roughness:.86,metalness:.08});
const glowMat=new THREE.MeshStandardMaterial({color:0x4fd0ff,emissive:0x18aef0,emissiveIntensity:4.5,metalness:.18,roughness:.28});
const glowCore=new THREE.MeshBasicMaterial({color:0xa7edff,toneMapped:false,transparent:true,opacity:1});
const glowMeshes=[];

function shapeMesh(points,depth,material,bevel=.045){
  const s=new THREE.Shape();s.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)s.lineTo(points[i][0],points[i][1]);s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:3,curveSegments:2});g.translate(0,0,-depth/2);
  const m=new THREE.Mesh(g,material);m.castShadow=true;m.receiveShadow=true;return m;
}
function box(w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d,2,2,2),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;return m}

const bladePts=[[-.48,2.0],[.48,2.0],[.40,-2.72],[.21,-3.28],[0,-3.72],[-.21,-3.28],[-.40,-2.72]];
sword.add(shapeMesh(bladePts,.24,metal,.055));
const leftEdge=shapeMesh([[-.48,2.0],[-.34,1.94],[-.29,-2.68],[-.11,-3.25],[0,-3.6],[-.21,-3.28],[-.40,-2.72]],.255,edgeMat,.018);leftEdge.position.z=.005;sword.add(leftEdge);
const rightEdge=leftEdge.clone();rightEdge.scale.x=-1;sword.add(rightEdge);
sword.add(box(.17,4.82,.275,darkMetal,0,-.30,0));
const rune=box(.038,4.35,.292,glowMat,0,-.28,.006);sword.add(rune);glowMeshes.push(rune);
const core=box(.012,4.1,.304,glowCore,0,-.28,.008);sword.add(core);glowMeshes.push(core);
for(const y of [1.43,1.18,.94]){const d=shapeMesh([[0,.12],[.11,0],[0,-.12],[-.11,0]],.31,glowMat,.018);d.scale.set(.72,.72,.72);d.position.set(0,y,.005);sword.add(d);glowMeshes.push(d);}
const tipRune=shapeMesh([[0,.16],[.12,0],[0,-.24],[-.12,0]],.31,glowMat,.015);tipRune.position.set(0,-2.72,.005);sword.add(tipRune);glowMeshes.push(tipRune);

const guardPts=[[-1.48,2.25],[-1.12,2.02],[-.72,2.08],[-.52,1.92],[-.26,2.13],[0,2.32],[.26,2.13],[.52,1.92],[.72,2.08],[1.12,2.02],[1.48,2.25],[1.03,2.31],[.61,2.39],[.34,2.50],[0,2.40],[-.34,2.50],[-.61,2.39],[-1.03,2.31]];
sword.add(shapeMesh(guardPts,.42,darkMetal,.065));
const guardTop=shapeMesh([[-.64,2.28],[-.31,2.53],[0,2.61],[.31,2.53],[.64,2.28],[.35,2.14],[0,2.26],[-.35,2.14]],.46,metal,.055);sword.add(guardTop);
const guardGem=shapeMesh([[0,2.43],[.19,2.24],[0,2.03],[-.19,2.24]],.49,glowMat,.025);sword.add(guardGem);glowMeshes.push(guardGem);
const guardCore=shapeMesh([[0,2.39],[.08,2.24],[0,2.10],[-.08,2.24]],.505,glowCore,.012);sword.add(guardCore);glowMeshes.push(guardCore);

sword.add(box(.28,.30,.35,darkMetal,0,2.62,0));
const grip=new THREE.Mesh(new THREE.CylinderGeometry(.245,.23,1.72,28,1,false),leather);grip.position.y=3.51;grip.castShadow=true;sword.add(grip);
for(const y of [2.67,4.36]){const cap=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.13,32),edgeMat);cap.position.y=y;cap.castShadow=true;sword.add(cap)}
for(let i=0;i<9;i++){const y=2.83+i*.19;const b1=box(.56,.032,.09,edgeMat,0,y,.215,0,0,.64);b1.scale.x=.92;sword.add(b1);const b2=box(.56,.032,.09,darkMetal,0,y+.095,.218,0,0,-.64);b2.scale.x=.92;sword.add(b2);}

const pommel=shapeMesh([[-.28,4.40],[-.18,4.62],[-.10,4.84],[0,5.10],[.10,4.84],[.18,4.62],[.28,4.40],[.12,4.38],[0,4.52],[-.12,4.38]],.36,darkMetal,.045);sword.add(pommel);
const pGem=shapeMesh([[0,4.87],[.10,4.68],[0,4.52],[-.10,4.68]],.39,glowMat,.02);sword.add(pGem);glowMeshes.push(pGem);

const cordCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.22,4.83,.03),new THREE.Vector3(-.52,4.68,.06),new THREE.Vector3(-.58,4.18,.07),new THREE.Vector3(-.48,3.94,.07)]);
const cord=new THREE.Mesh(new THREE.TubeGeometry(cordCurve,28,.018,7,false),darkMetal);sword.add(cord);
const bead=new THREE.Mesh(new THREE.SphereGeometry(.10,18,12),glowMat);bead.position.set(-.48,3.84,.07);sword.add(bead);glowMeshes.push(bead);
for(let i=0;i<7;i++){const x=-.56+i*.025;const c=new THREE.CatmullRomCurve3([new THREE.Vector3(-.48,3.73,.07),new THREE.Vector3(x,3.48,.07+(i%2)*.02),new THREE.Vector3(x-.025,3.24,.06)]);sword.add(new THREE.Mesh(new THREE.TubeGeometry(c,12,.012,5,false),leather));}

const particleCount=120;const pos=new Float32Array(particleCount*3);
for(let i=0;i<particleCount;i++){const a=Math.random()*Math.PI*2,r=2.0+Math.random()*2.6;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=-.3+Math.random()*6.8-3.1;pos[i*3+2]=(Math.random()-.5)*3.5;}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const pm=new THREE.PointsMaterial({color:0x4fc8ff,size:.024,transparent:true,opacity:.34,depthWrite:false,blending:THREE.AdditiveBlending});const particles=new THREE.Points(pg,pm);scene.add(particles);

const ground=new THREE.Mesh(new THREE.CircleGeometry(2.55,64),new THREE.MeshBasicMaterial({color:0x0a2533,transparent:true,opacity:.28,depthWrite:false}));ground.scale.y=.26;ground.rotation.x=-Math.PI/2;ground.position.set(0,-4.05,0);scene.add(ground);

const spinBtn=document.getElementById('spin'),glowBtn=document.getElementById('glow'),resetBtn=document.getElementById('reset');
spinBtn.onclick=()=>{controls.autoRotate=!controls.autoRotate;spinBtn.classList.toggle('active',controls.autoRotate)};
let glowOn=true;glowBtn.onclick=()=>{glowOn=!glowOn;glowBtn.classList.toggle('active',glowOn);glowMat.emissiveIntensity=glowOn?4.5:.15;glowCore.opacity=glowOn?1:.35;fill.intensity=glowOn?18:4};
resetBtn.onclick=()=>{camera.position.set(0,.55,15.2);controls.target.set(0,.45,0);controls.update();sword.rotation.set(-.04,0,0)};

let t=0;
function animate(dt){t=dt*.001;controls.update();particles.rotation.y=t*.025;particles.position.y=Math.sin(t*.45)*.035;ground.material.opacity=.22+Math.sin(t*1.6)*.04;if(glowOn)glowMat.emissiveIntensity=4.1+Math.sin(t*2.4)*.55;renderer.render(scene,camera)}
renderer.setAnimationLoop(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
</script>
</body>
</html>
