<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07090b">
<title>The Last House — Cinematic</title>
<style>
:root{--p:0;--mx:0;--my:0;--warm:.22;--cold:0;--flood:0;--rain:0;--zoom:1.06;--camx:0px;--camy:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#07090b;color:#f3f1ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:none}body{height:650vh;overflow-x:hidden}.stage{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:#090b0d;isolation:isolate}.scene{position:absolute;inset:-3%;transform:perspective(1200px) translate3d(var(--camx),var(--camy),0) scale(var(--zoom));transform-origin:52% 56%;will-change:transform}.plane{position:absolute;inset:0;overflow:hidden;will-change:transform,filter}.plane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;user-select:none;-webkit-user-drag:none}.base{transform:translate3d(calc(var(--mx)*-4px),calc(var(--my)*-3px),0) scale(1.02);filter:saturate(calc(.88 + var(--warm)*.3)) contrast(1.04) brightness(calc(.86 - var(--cold)*.12))}.sky{clip-path:polygon(0 0,100% 0,100% 47%,0 59%);transform:translate3d(calc(var(--mx)*-9px),calc(var(--my)*-6px),0) scale(1.045);filter:blur(.35px) saturate(.85) brightness(calc(.9 - var(--cold)*.12))}.house{clip-path:polygon(26% 16%,82% 10%,87% 78%,28% 82%);transform:translate3d(calc(var(--mx)*5px),calc(var(--my)*3px),0) scale(1.025);filter:contrast(1.07) saturate(.94)}.foreground{clip-path:polygon(0 48%,28% 51%,38% 70%,100% 61%,100% 100%,0 100%);transform:translate3d(calc(var(--mx)*11px),calc(var(--my)*7px),0) scale(1.055);filter:contrast(1.06) saturate(.9)}
.grade,.vignette,.grain,.flood,.flare,.windowGlow,.rain{position:absolute;inset:0;pointer-events:none}.grade{z-index:6;background:linear-gradient(180deg,rgba(6,8,10,.22),transparent 34%,rgba(4,5,7,.24)),linear-gradient(110deg,rgba(255,167,95,calc(var(--warm)*.16)),transparent 45%),linear-gradient(0deg,rgba(22,52,70,calc(var(--cold)*.38)),transparent 65%);mix-blend-mode:color}.vignette{z-index:7;background:radial-gradient(ellipse at 52% 49%,transparent 37%,rgba(0,0,0,.18) 64%,rgba(0,0,0,.68) 100%)}.grain{z-index:8;opacity:.15;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}100%{transform:translate(-1%,-1%)}}
.flare{z-index:5;background:radial-gradient(circle at 15% 34%,rgba(255,211,149,calc(var(--warm)*.17)),transparent 19%);mix-blend-mode:screen}.windowGlow{z-index:5;opacity:calc(.12 + var(--warm)*.55);background:radial-gradient(ellipse at 57.1% 55.5%,rgba(255,207,130,.52),transparent 2.2%),radial-gradient(ellipse at 68.1% 56.8%,rgba(255,207,130,.38),transparent 2%);mix-blend-mode:screen;filter:blur(2px)}.flood{z-index:5;top:auto;height:calc(var(--flood)*32%);background:linear-gradient(180deg,rgba(60,95,112,.08),rgba(27,60,77,.62));backdrop-filter:blur(calc(var(--flood)*1.8px));border-top:1px solid rgba(210,231,237,calc(var(--flood)*.35));transform:translateY(calc((1 - var(--flood))*100%));transition:height .15s linear}.rain{z-index:9;opacity:var(--rain)}#rain{position:absolute;inset:0;width:100%;height:100%}
.letterbox:before,.letterbox:after{content:"";position:absolute;left:0;right:0;height:clamp(16px,2.3vw,34px);background:#050607;z-index:20;pointer-events:none}.letterbox:before{top:0}.letterbox:after{bottom:0}
.ui{position:absolute;inset:0;z-index:15;pointer-events:none;padding:calc(max(26px,env(safe-area-inset-top)) + 18px) clamp(18px,3vw,46px) calc(max(26px,env(safe-area-inset-bottom)) + 18px);display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:flex-start;font:700 9px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.23em;text-transform:uppercase}.top .sub{font-weight:500;color:#ffffff78;letter-spacing:.15em;text-align:right}.hero{align-self:center;max-width:min(520px,72vw);text-shadow:0 3px 24px #000}.year{font:400 clamp(70px,14vw,160px)/.72 Georgia,serif;letter-spacing:-.065em}.kicker{margin-top:18px;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.21em;text-transform:uppercase;color:#f4f1e2b0}.hero h1{margin:10px 0 0;font:400 clamp(28px,4.3vw,62px)/.92 Georgia,serif;letter-spacing:-.04em;max-width:12ch}.hero p{max-width:37ch;margin:14px 0 0;font-size:11px;line-height:1.6;color:#f7f4ecc7}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.timeline{flex:1;max-width:820px}.track{position:relative;height:22px}.track:before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:#fff3}.track i{position:absolute;left:0;top:9px;height:2px;width:calc(var(--p)*100%);background:#f2eee3}.track b{position:absolute;top:6px;width:8px;height:8px;border-radius:50%;border:1px solid #ffffff70;background:#0b0d0f;transform:translateX(-50%)}.track b.active{background:#f3f1ea;border-color:#f3f1ea;box-shadow:0 0 0 5px #ffffff12}.years{display:flex;justify-content:space-between;margin-top:5px;font:600 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#ffffff76}.hint{font:700 8px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;text-align:right;color:#ffffffaa}.loader{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#080a0c;transition:opacity .7s}.loader.hide{opacity:0;pointer-events:none}.loader span{font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;text-transform:uppercase;color:#ffffff8a}.scrollmark{position:absolute;right:clamp(18px,3vw,46px);top:50%;transform:translateY(-50%);z-index:16;display:grid;gap:11px}.scrollmark i{width:5px;height:5px;border-radius:50%;border:1px solid #ffffff70}.scrollmark i.active{background:#fff;border-color:#fff;transform:scale(1.35)}
@media(max-width:720px){body{height:720vh}.scene{inset:-7%;transform-origin:58% 55%}.plane img{object-position:57% 50%}.sky{clip-path:polygon(0 0,100% 0,100% 48%,0 56%)}.house{clip-path:polygon(13% 13%,100% 10%,100% 78%,15% 83%)}.foreground{clip-path:polygon(0 52%,22% 54%,38% 72%,100% 62%,100% 100%,0 100%)}.top .sub{display:none}.hero{align-self:end;margin-bottom:18vh;max-width:88vw}.year{font-size:clamp(72px,25vw,122px)}.hero h1{font-size:clamp(30px,10vw,45px)}.hero p{font-size:10px;max-width:31ch}.bottom{display:block}.hint{margin-top:10px;text-align:left}.scrollmark{right:14px}.years span:nth-child(2),.years span:nth-child(4){display:none}}
@media(prefers-reduced-motion:reduce){.grain{animation:none}.scene,.plane{transition:none!important}}
</style>
</head>
<body>
<div class="stage letterbox">
  <div class="scene" id="scene">
    <div class="plane base"><img class="shot" alt=""></div>
    <div class="plane sky"><img class="shot" alt=""></div>
    <div class="plane house"><img class="shot" alt=""></div>
    <div class="plane foreground"><img class="shot" alt=""></div>
  </div>
  <div class="flare"></div><div class="windowGlow"></div><div class="grade"></div><div class="flood"></div><canvas id="rain" class="rain"></canvas><div class="vignette"></div><div class="grain"></div>
  <div class="ui">
    <div class="top"><div>THE LAST HOUSE</div><div class="sub">100 YEARS · ONE CAMERA<br>SCROLL THROUGH TIME</div></div>
    <div class="hero"><div class="year" id="year">1968</div><div class="kicker" id="kicker">01 · FIRST LIGHT</div><h1 id="title">A house before the city.</h1><p id="desc">A wet road, one old tree, and a single warm window. Nothing here knows what is coming.</p></div>
    <div class="bottom"><div class="timeline"><div class="track" id="track"><i></i><b style="left:0%"></b><b style="left:20%"></b><b style="left:40%"></b><b style="left:60%"></b><b style="left:80%"></b><b style="left:100%"></b></div><div class="years"><span>1968</span><span>1987</span><span>2008</span><span>2028</span><span>2046</span><span>2068</span></div></div><div class="hint">MOVE TO LOOK<br>SCROLL TO TRAVEL</div></div>
  </div>
  <div class="scrollmark" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="loader" id="loader"><span>DEVELOPING THE MEMORY</span></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const phases=[
 {p:0,year:1968,k:'01 · FIRST LIGHT',t:'A house before the city.',d:'A wet road, one old tree, and a single warm window. Nothing here knows what is coming.'},
 {p:.2,year:1987,k:'02 · NEW GENERATION',t:'Life fills every room.',d:'More voices, a car at the gate, dinner light in the windows. The house is no longer alone.'},
 {p:.4,year:2008,k:'03 · THE CITY ARRIVES',t:'The horizon gets closer.',d:'Roads harden, poles multiply, distant buildings rise. The same walls keep their place.'},
 {p:.6,year:2028,k:'04 · THE LONG QUIET',t:'One room still turns on at dusk.',d:'The city has moved around it. The tree is older than everyone who planted it.'},
 {p:.8,year:2046,k:'05 · HIGH WATER',t:'The storm reaches the doorstep.',d:'Rain erases the road. Water takes the yard first, then the threshold, then the memory of dry ground.'},
 {p:1,year:2068,k:'06 · RETURN',t:'Someone opens the door again.',d:'The scars remain, but the light is warm. The house survives because somebody comes back.'}
];
let raw=0,p=0,last=performance.now(),mx=0,my=0,active=-1;
const root=document.documentElement,year=$('#year'),kicker=$('#kicker'),title=$('#title'),desc=$('#desc'),loader=$('#loader'),dots=$$('#dots i'),marks=$$('#track b'),shots=$$('.shot');
fetch('hero.b64').then(r=>r.text()).then(b64=>{const src='data:image/webp;base64,'+b64.trim();let n=0;shots.forEach(img=>{img.onload=()=>{if(++n===shots.length)setTimeout(()=>loader.classList.add('hide'),120)};img.src=src})}).catch(()=>{loader.querySelector('span').textContent='IMAGE LOAD FAILED'});
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function onScroll(){raw=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))}
onScroll();addEventListener('scroll',onScroll,{passive:true});
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2},{passive:true});
function phaseIndex(v){return Math.min(5,Math.floor(v*5.999))}
function renderRain(a,ts){const c=$('#rain'),d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(c.width!==w*d||c.height!==h*d){c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px'}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(a<.02)return;x.strokeStyle='rgba(210,230,238,'+(.12+.22*a)+')';x.lineWidth=1;for(let i=0;i<90;i++){const xx=(i*97+(ts*.18))%(w+140)-70,yy=(i*53+(ts*.42))%(h+120)-60,len=8+(i%7)*2;x.beginPath();x.moveTo(xx,yy);x.lineTo(xx-4*a,yy+len);x.stroke()}}
function updateUI(k,v){if(k===active)return;active=k;year.style.opacity=.25;kicker.style.opacity=.25;title.style.opacity=.25;desc.style.opacity=.25;setTimeout(()=>{const q=phases[k];kicker.textContent=q.k;title.textContent=q.t;desc.textContent=q.d;year.style.opacity=1;kicker.style.opacity=1;title.style.opacity=1;desc.style.opacity=1},110);dots.forEach((d,i)=>d.classList.toggle('active',i===k));marks.forEach((d,i)=>d.classList.toggle('active',i===k))}
function frame(ts){const dt=Math.min(.04,(ts-last)/1000);last=ts;p+=(raw-p)*(1-Math.pow(.00035,dt));const k=phaseIndex(p);const yr=Math.round(1968+(2068-1968)*p);year.textContent=yr;updateUI(k,p);const storm=clamp((p-.70)/.10)*clamp((.93-p)/.10),flood=clamp((p-.73)/.10)*clamp((.94-p)/.08),returnWarm=clamp((p-.88)/.12);const warm=.18*(1-p)+.24*returnWarm,cold=.75*storm;root.style.setProperty('--p',p.toFixed(4));root.style.setProperty('--mx',mx.toFixed(3));root.style.setProperty('--my',my.toFixed(3));root.style.setProperty('--warm',warm.toFixed(3));root.style.setProperty('--cold',cold.toFixed(3));root.style.setProperty('--rain',storm.toFixed(3));root.style.setProperty('--flood',flood.toFixed(3));root.style.setProperty('--zoom',(1.055+p*.085+storm*.02).toFixed(4));root.style.setProperty('--camx',((p-.5)*-10+mx*2).toFixed(1)+'px');root.style.setProperty('--camy',((p-.5)*-7+my*1.5).toFixed(1)+'px');renderRain(storm,ts);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
