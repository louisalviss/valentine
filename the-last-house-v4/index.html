@media(max-width:720px){body{height:780vh}.visual{height:58dvh}.photo{object-position:52% 50%;transform:none;filter:saturate(calc(.94 - var(--storm)*.26 + var(--return)*.10)) brightness(calc(.93 - var(--storm)*.20 + var(--return)*.05));}.grade{background:linear-gradient(180deg,rgba(3,4,5,.12),transparent 62%,rgba(3,4,5,.52))}.vignette{box-shadow:inset 0 0 18vw rgba(0,0,0,.38)}.grain{opacity:.035}.scan{height:58dvh;bottom:auto}.ui{padding:calc(max(18px,env(safe-area-inset-top)) + 4px) 18px calc(max(17px,env(safe-area-inset-bottom)) + 4px);grid-template-rows:auto 58dvh 1fr auto}.top span:last-child{display:none}.story{grid-row:3;align-self:start;width:100%;padding-top:16px;text-shadow:none}.year{font-size:58px;line-height:.82}.kicker{margin-top:12px;font-size:8px}.story h1{font-size:30px;line-height:.96;max-width:11ch}.story p{font-size:10px;line-height:1.55;max-width:34ch;color:#f2eee2a8}.bottom{grid-row:4;display:block;padding-bottom:2px}.hint{margin-top:8px;text-align:left}.years span:nth-child(even){display:none}.memory{top:50dvh;right:14px;width:52px;height:52px;font-size:6px;backdrop-filter:none}.lens{width:150px;height:150px}.lens img{height:58dvh}.loader{height:58dvh}}

<div class="stage" id="stage">
 <div class="visual" id="visual"><img class="photo" id="photo" alt="The Last House"><canvas class="world" id="world"></canvas><div class="grade"></div><div class="stormgrade"></div><div class="warm"></div><div class="vignette"></div><div class="grain"></div><div class="scan" id="scan"></div><div class="lens" id="lens"><img id="lensImg" alt="Memory"></div></div>
 <div class="ui"><div class="top"><span>THE LAST HOUSE</span><span>ONE PLACE · ONE CENTURY<br>TIME CHANGES THE WORLD</span></div><div></div><div class="story"><div class="year" id="year">1968</div><div class="kicker" id="kicker">01 · BEFORE THE CITY</div><h1 id="title">The road still ends here.</h1><p id="desc">One house, one tree, a wet road. Scroll slowly. The world changes around the same walls.</p></div><div class="bottom"><div class="timeline"><div class="track"><i class="fill"></i><b class="dot" style="left:0%"></b><b class="dot" style="left:20%"></b><b class="dot" style="left:40%"></b><b class="dot" style="left:60%"></b><b class="dot" style="left:80%"></b><b class="dot" style="left:100%"></b></div><div class="years"><span>1968</span><span>1987</span><span>2008</span><span>2028</span><span>2046</span><span>2068</span></div></div><div class="hint">SCROLL · TIME<br>HOLD · MEMORY</div></div></div>

</div>
<script>
(()=>{
const PHOTO='https://images.unsplash.com/photo-1759211321606-0cf140be1cff?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=92&w=2400';
const phases=[['1968','01 · BEFORE THE CITY','The road still ends here.','One house, one tree, a wet road. The city has not found this place yet.'],['1987','02 · THE HOUSE FILLS','Life presses against the windows.','More voices, a car, new wires. The house is still the centre of its small world.'],['2008','03 · THE EDGE MOVES IN','The horizon begins to rise.','Road surface hardens. Buildings appear beyond the fields. Distance starts disappearing.'],['2028','04 · SURROUNDED','The world has reached the gate.','Traffic lines, utility poles and a dense skyline arrive. The house keeps the same footprint.'],['2046','05 · HIGH WATER','The road disappears first.','Rain fills the low ground. Water reaches the yard, then the threshold. Everything except the house begins to move.'],['2068','06 · SOMEONE RETURNS','Warm light behind old walls.','The water is gone. Repairs are imperfect. Someone opens the door, and the century begins again.']];
const root=document.documentElement,photo=document.getElementById('photo'),lensImg=document.getElementById('lensImg'),loader=document.getElementById('loader'),c=document.getElementById('world'),ctx=c.getContext('2d'),scan=document.getElementById('scan'),dots=[...document.querySelectorAll('.dot')];let raw=0,p=0,mx=0,my=0,active=-1,last=performance.now(),holding=false,lx=0,ly=0;
photo.onload=()=>loader.classList.add('hide');photo.onerror=()=>loader.querySelector('span').textContent='IMAGE LOAD FAILED';photo.src=PHOTO;lensImg.src=PHOTO;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
function resize(){const d=Math.min(devicePixelRatio||1,2),r=document.getElementById('visual').getBoundingClientRect();c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize,{passive:true});
function scrollRead(){raw=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))}scrollRead();addEventListener('scroll',scrollRead,{passive:true});
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;lx=e.clientX;ly=e.clientY},{passive:true});
const mem=document.getElementById('memory'),lens=document.getElementById('lens');const hold=e=>{holding=true;lens.classList.add('on');if(e&&e.clientX){lx=e.clientX;ly=e.clientY}};const release=()=>{holding=false;lens.classList.remove('on')};mem.addEventListener('pointerdown',hold);addEventListener('pointerup',release);addEventListener('pointercancel',release);document.getElementById('visual').addEventListener('pointerdown',e=>{if(e.target!==mem)hold(e)});document.getElementById('visual').addEventListener('pointerup',release);
function skyline(a,w,h){if(a<=0)return;ctx.save();ctx.globalAlpha=.8*a;const base=h*.53;for(let i=0;i<13;i++){const x=w*(.61+i*.035),hh=h*(.08+((i*37)%11)*.009)*a,ww=w*.024;ctx.fillStyle=`rgba(${38+i*2},${45+i*2},${50+i*2},${.8*a})`;ctx.fillRect(x,base-hh,ww,hh);ctx.fillStyle=`rgba(238,198,120,${.16*a})`;for(let y=base-hh+8;y<base-5;y+=12)for(let xx=x+5;xx<x+ww-3;xx+=10)ctx.fillRect(xx,y,2,2)}ctx.restore()}
function road(a,w,h){if(a<=0)return;ctx.save();ctx.globalAlpha=.62*a;ctx.fillStyle='rgba(29,31,31,.82)';ctx.beginPath();ctx.moveTo(w*.46,h*.72);ctx.lineTo(w*.77,h*.68);ctx.lineTo(w*1.02,h*.91);ctx.lineTo(w*.18,h*1.03);ctx.closePath();ctx.fill();ctx.strokeStyle=`rgba(223,219,195,${.48*a})`;ctx.lineWidth=2;ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(w*.59,h*.76);ctx.lineTo(w*.91,h*.9);ctx.stroke();ctx.restore()}
function poles(a,w,h){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='rgba(24,25,24,.88)';ctx.lineWidth=3;const P=[[.78,.38,.78,.77],[.89,.31,.89,.73],[.68,.43,.68,.74]];P.forEach(p=>{ctx.beginPath();ctx.moveTo(w*p[0],h*p[1]);ctx.lineTo(w*p[2],h*p[3]);ctx.stroke()});ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(w*.68,h*.46);ctx.bezierCurveTo(w*.76,h*.42,w*.83,h*.34,w*.89,h*.34);ctx.stroke();ctx.restore()}
function damage(a,w,h){if(a<=0)return;ctx.save();ctx.globalAlpha=.55*a;ctx.strokeStyle='rgba(31,25,21,.68)';ctx.lineWidth=1;const cracks=[[[.47,.35],[.49,.43],[.48,.50]],[[.57,.39],[.55,.47],[.58,.55]],[[.39,.43],[.41,.49],[.40,.57]]];for(const q of cracks){ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(w*p[0],h*p[1]):ctx.moveTo(w*p[0],h*p[1]));ctx.stroke()}ctx.restore()}
function water(a,w,h,ts){if(a<=0)return;const top=h*(.98-.22*a);ctx.save();const g=ctx.createLinearGradient(0,top,0,h);g.addColorStop(0,`rgba(72,102,116,${.28*a})`);g.addColorStop(1,`rgba(18,37,47,${.72*a})`);ctx.fillStyle=g;ctx.fillRect(0,top,w,h-top);ctx.strokeStyle=`rgba(202,224,229,${.18*a})`;ctx.lineWidth=1;for(let i=0;i<24;i++){const y=top+((i*19+ts*.02)%(Math.max(8,h-top)));ctx.beginPath();ctx.moveTo((i*53)%w,y);ctx.lineTo(Math.min(w,(i*53)%w+70+20*Math.sin(i)),y+1);ctx.stroke()}ctx.strokeStyle=`rgba(210,226,232,${.28*a})`;for(let i=0;i<85;i++){const x=(i*97+ts*.15)%(w+90)-45,y=(i*47+ts*.38)%(h+80)-40;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+16);ctx.stroke()}ctx.restore()}
function returnLight(a,w,h){if(a<=0)return;ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=a;let g=ctx.createRadialGradient(w*.52,h*.54,0,w*.52,h*.54,w*.12);g.addColorStop(0,'rgba(255,197,112,.52)');g.addColorStop(1,'rgba(255,165,72,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore()}
function renderWorld(ts){const d=Math.min(devicePixelRatio||1,2),w=c.width/d,h=c.height/d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const city=smooth(.28,.62,p),asphalt=smooth(.36,.63,p),pole=smooth(.40,.68,p),age=smooth(.48,.77,p);let flood=smooth(.72,.83,p)*(1-smooth(.87,.97,p));let ret=smooth(.89,1,p);skyline(city,w,h);road(asphalt,w,h);poles(pole,w,h);damage(age,w,h);water(flood,w,h,ts);returnLight(ret,w,h);root.style.setProperty('--storm',flood.toFixed(3));root.style.setProperty('--return',ret.toFixed(3));}
function setPhase(i){if(i===active)return;active=i;const s=phases[i];document.getElementById('year').textContent=s[0];document.getElementById('kicker').textContent=s[1];document.getElementById('title').textContent=s[2];document.getElementById('desc').textContent=s[3];dots.forEach((d,n)=>d.classList.toggle('active',n===i))}
function frame(ts){const dt=Math.min(.04,(ts-last)/1000);last=ts;p+=(raw-p)*(1-Math.pow(.0007,dt));root.style.setProperty('--p',p.toFixed(5));if(matchMedia('(hover:hover) and (pointer:fine)').matches){root.style.setProperty('--mx',mx.toFixed(3));root.style.setProperty('--my',my.toFixed(3))}else{root.style.setProperty('--mx','0');root.style.setProperty('--my','0')}const seg=Math.min(5,Math.floor(p*5.999));setPhase(seg);const local=(p*5)%1;scan.style.left=(8+84*local)+'%';renderWorld(ts);if(holding){const r=document.getElementById('visual').getBoundingClientRect(),sz=lens.getBoundingClientRect().width,x=clamp(lx-r.left-sz/2,8,r.width-sz-8),y=clamp(ly-r.top-sz/2,8,r.height-sz-8);lens.style.left=x+'px';lens.style.top=y+'px';lensImg.style.left=(-x)+'px';lensImg.style.top=(-y)+'px';lensImg.style.width=r.width+'px';lensImg.style.height=r.height+'px'}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
